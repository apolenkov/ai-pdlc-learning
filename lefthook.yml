pre-commit:
  jobs:
    # Real corporate addresses, mail and names never enter Git; stop list outside the repository (README).
    - name: corp-guard
      run: python3 scripts/corp-guard.py pre-commit
    - name: lint
      run: npm run --silent lint
    - name: format
      run: npm run --silent format:check
    - name: typecheck
      glob: "*.{ts,mts}"
      run: npm run --silent typecheck
commit-msg:
  jobs:
    - name: corp-guard
      run: python3 scripts/corp-guard.py commit-msg {1}
    - name: commitlint
      run: npx commitlint --edit {1}
pre-push:
  jobs:
    # A script, not run: Lefthook skips a run job for a push without file changes (an empty commit).
    - name: local-checks
      # Without it Lefthook gives the job an empty stdin and the outgoing-commit checks see no refs.
      use_stdin: true
      script: local-checks.sh
      runner: sh
