<template id="scene-03-template">
  <div data-composition-id="scene-03" data-width="1920" data-height="1080" data-duration="13.2">
    <style>
      [data-composition-id="scene-03"] .ov-h { position: absolute; left: 96px; top: 64px; width: 1728px; font-size: 58px; font-weight: 800; }
      [data-composition-id="scene-03"] .ov-h span { color: var(--k-ok); }
      [data-composition-id="scene-03"] .ov-rail { position: absolute; left: 96px; top: 400px; width: 1728px; height: 140px; }
      [data-composition-id="scene-03"] .ov-link { position: absolute; top: 56px; height: 8px; background: var(--k-ok); border-radius: 4px; }
      [data-composition-id="scene-03"] .ov-stop { position: absolute; top: 0; width: 228px; text-align: center; }
      [data-composition-id="scene-03"] .ov-node { position: relative; margin: 0 auto; width: 80px; height: 80px; border-radius: 50%; display: grid; place-items: center; font-size: 34px; font-weight: 800; background: var(--k-panel-2); border: 4px solid var(--k-ok); color: var(--k-ok); }
      [data-composition-id="scene-03"] .ov-agent { position: absolute; top: -18px; right: 52px; font-size: 34px; line-height: 1; color: var(--k-ok); background: var(--k-bg); padding: 0 4px; }
      [data-composition-id="scene-03"] .ov-lab { margin-top: 16px; font-size: 26px; font-weight: 600; line-height: 1.25; color: var(--k-text); }
      [data-composition-id="scene-03"] .ov-sub { position: absolute; left: 96px; top: 700px; width: 1728px; font-size: 44px; font-weight: 700; line-height: 1.3; }
      [data-composition-id="scene-03"] .ov-sub span { color: var(--k-ok); }
    </style>
    <script>
      (function () {
        const S = Kit.scene("03"), DUR = 13.2;
        const h = document.createElement("div"); h.className = "ov-h";
        h.innerHTML = "Как стало <span>· с ИИ-агентами</span>"; S.root.appendChild(h);
        S.tl.fromTo(h, { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, 0.1);
        const rail = document.createElement("div"); rail.className = "ov-rail"; S.root.appendChild(rail);
        const names = ["Намерение", "Анализ", "Архитектура", "Реализация", "Тестирование", "Выпуск", "Наблюдение"];
        const withAgent = [1, 2, 3, 4, 6];
        const W = 1728, pitch = W / 7, cx = (i) => pitch * (i + 0.5);
        names.forEach((n, i) => {
          if (i < 6) {
            const link = document.createElement("div"); link.className = "ov-link";
            link.style.left = (cx(i) + 48) + "px"; link.style.width = (pitch - 96) + "px";
            rail.appendChild(link);
            S.tl.fromTo(link, { autoAlpha: 0, scaleX: 0.4 }, { autoAlpha: 1, scaleX: 1, duration: 0.4, ease: "power2.inOut", immediateRender: false }, 0.3 + i * 0.15);
          }
          const stop = document.createElement("div"); stop.className = "ov-stop";
          stop.style.left = (cx(i) - 114) + "px";
          stop.innerHTML = '<div class="ov-node">' + (withAgent.includes(i) ? '<span class="ov-agent">✦</span>' : "") + (i + 1) + '</div><div class="ov-lab">' + n + "</div>";
          rail.appendChild(stop);
          S.tl.fromTo(stop, { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, 0.3 + i * 0.15);
        });
        const sub = document.createElement("div"); sub.className = "ov-sub";
        sub.innerHTML = "Требования, решения и тесты — <span>в Git рядом с кодом</span>";
        S.root.appendChild(sub);
        S.tl.fromTo(sub, { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, Math.min(S.t("рядом с кодом"), DUR - 1.8));
        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
