<template id="scene-04-template">
  <div data-composition-id="scene-04" data-width="1920" data-height="1080" data-duration="16.7">
    <style>
      [data-composition-id="scene-04"] .ov-h { position: absolute; left: 96px; top: 64px; width: 1728px; font-size: 58px; font-weight: 800; }
      [data-composition-id="scene-04"] .ov-grid { position: absolute; left: 96px; top: 230px; width: 1728px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
      [data-composition-id="scene-04"] .ov-card { padding: 30px 34px; border: 2px solid var(--k-line); border-radius: 24px; background: var(--k-panel); min-height: 240px; }
      [data-composition-id="scene-04"] .ov-card.hot { border-color: var(--k-ok); }
      [data-composition-id="scene-04"] .ov-ic { font-size: 40px; line-height: 1; color: var(--k-accent-soft); }
      [data-composition-id="scene-04"] .ov-t { margin-top: 12px; font-size: 38px; font-weight: 800; }
      [data-composition-id="scene-04"] .ov-d { margin-top: 10px; font-size: 30px; line-height: 1.3; color: var(--k-text-2); }
    </style>
    <script>
      (function () {
        const S = Kit.scene("04"), DUR = 16.7;
        const h = document.createElement("div"); h.className = "ov-h"; h.textContent = "Четыре входа"; S.root.appendChild(h);
        S.tl.fromTo(h, { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, 0.1);
        const grid = document.createElement("div"); grid.className = "ov-grid"; S.root.appendChild(grid);
        const cards = [
          ["Карта этапов", "◆", "Карта этапов", "что происходит на каждом"],
          ["Курс анализа", "●", "Курс анализа", "как работать уже сегодня"],
          ["Гайд", "▲", "Гайд «как было — как стало»", "что именно меняется"],
          ["Команда развития", "✦", "Команда развития процессов AI PDLC", "кто помогает и как пройти аудит"],
        ];
        cards.forEach(([word, ic, t, d]) => {
          const c = document.createElement("div"); c.className = "ov-card";
          c.innerHTML = '<div class="ov-ic">' + ic + '</div><div class="ov-t">' + t + '</div><div class="ov-d">' + d + "</div>";
          grid.appendChild(c);
          let at = 0.4;
          try { at = Math.min(S.t(word), DUR - 2); } catch (e) { at = 0.4; }
          S.tl.fromTo(c, { autoAlpha: 0, y: 22 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, at);
          S.tl.to(c, { borderColor: "#3ccf91", duration: 0.3, immediateRender: false }, at);
        });
        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
