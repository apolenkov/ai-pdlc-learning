<template id="scene-02-template">
  <div data-composition-id="scene-02" data-width="1920" data-height="1080" data-duration="10.9">
    <style>
      [data-composition-id="scene-02"] .ov-h { position: absolute; left: 96px; top: 64px; width: 1728px; font-size: 58px; font-weight: 800; }
      [data-composition-id="scene-02"] .ov-h span { color: var(--k-text-2); font-weight: 600; }
      [data-composition-id="scene-02"] .ov-rail { position: absolute; left: 96px; top: 400px; width: 1728px; height: 120px; }
      [data-composition-id="scene-02"] .ov-link { position: absolute; top: 56px; height: 8px; background: var(--k-line); border-radius: 4px; }
      [data-composition-id="scene-02"] .ov-stop { position: absolute; top: 0; width: 228px; text-align: center; }
      [data-composition-id="scene-02"] .ov-node { margin: 0 auto; width: 80px; height: 80px; border-radius: 50%; display: grid; place-items: center; font-size: 34px; font-weight: 800; background: var(--k-panel-2); border: 4px solid var(--k-line); color: var(--k-text-2); }
      [data-composition-id="scene-02"] .ov-lab { margin-top: 16px; font-size: 26px; font-weight: 600; line-height: 1.25; color: var(--k-text); }
      [data-composition-id="scene-02"] .ov-wait { position: absolute; top: 262px; width: 250px; padding: 12px 10px; text-align: center; border: 2px solid var(--k-line); border-radius: 16px; background: var(--k-panel-2); font-size: 27px; font-weight: 600; color: var(--k-text-2); }
      [data-composition-id="scene-02"] .ov-sub { position: absolute; left: 96px; top: 700px; width: 1728px; font-size: 44px; font-weight: 700; line-height: 1.3; color: var(--k-text-2); }
    </style>
    <script>
      (function () {
        const S = Kit.scene("02"), DUR = 10.9;
        const h = document.createElement("div"); h.className = "ov-h";
        h.innerHTML = 'Как было <span>· решения в письмах</span>'; S.root.appendChild(h);
        S.tl.fromTo(h, { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, 0.1);
        const rail = document.createElement("div"); rail.className = "ov-rail"; S.root.appendChild(rail);
        const names = ["Намерение", "Анализ", "Архитектура", "Реализация", "Тестирование", "Выпуск", "Наблюдение"];
        const W = 1728, pitch = W / 7, cx = (i) => pitch * (i + 0.5);
        names.forEach((n, i) => {
          if (i < 6) {
            const link = document.createElement("div"); link.className = "ov-link";
            link.style.left = (cx(i) + 48) + "px"; link.style.width = (pitch - 96) + "px";
            rail.appendChild(link);
            S.tl.fromTo(link, { autoAlpha: 0, scaleX: 0.6 }, { autoAlpha: 1, scaleX: 1.15, duration: 0.6, ease: "power2.inOut", immediateRender: false }, 0.2);
          }
          const stop = document.createElement("div"); stop.className = "ov-stop";
          stop.style.left = (cx(i) - 114) + "px";
          stop.innerHTML = '<div class="ov-node">' + (i + 1) + '</div><div class="ov-lab">' + n + "</div>";
          rail.appendChild(stop);
          S.tl.fromTo(stop, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, immediateRender: false }, 0.1 + i * 0.08);
        });
        const waits = [["письма", "письма"], ["шаблоны", "шаблоны в Confluence"], ["ожидание", "ожидание согласований"]];
        waits.forEach(([word, label], i) => {
          const el = document.createElement("div"); el.className = "ov-wait"; el.textContent = label;
          el.style.left = (96 + 300 + i * 480) + "px";
          S.root.appendChild(el);
          S.tl.fromTo(el, { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, Math.min(S.t(word), DUR - 1.6));
        });
        const sub = document.createElement("div"); sub.className = "ov-sub";
        sub.textContent = "Что решили и когда — приходилось искать";
        S.root.appendChild(sub);
        S.tl.fromTo(sub, { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, Math.min(S.t("искать"), DUR - 1.6));
        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
