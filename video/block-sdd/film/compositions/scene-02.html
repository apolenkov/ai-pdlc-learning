<template id="scene-02-template">
  <div data-composition-id="scene-02" data-width="1920" data-height="1080" data-duration="32.3">
    <style>
      [data-composition-id="scene-02"] .pr-title { position: absolute; left: 96px; width: 1728px; top: 206px; font-size: 54px; font-weight: 700; color: var(--k-accent); }
      [data-composition-id="scene-02"] .pr-sub { position: absolute; left: 96px; width: 1728px; font-size: 40px; font-weight: 700; color: var(--k-accent-soft); }
      [data-composition-id="scene-02"] .pr-row { position: absolute; left: 96px; width: 1728px; display: grid; align-items: stretch; gap: 24px; }
      [data-composition-id="scene-02"] .pr-col { display: grid; gap: 14px; justify-items: stretch; align-content: start; }
      [data-composition-id="scene-02"] .pr-col > .k-aside, [data-composition-id="scene-02"] .pr-row > .k-aside { position: relative; }
      [data-composition-id="scene-02"] .pr-t { font-size: 44px; font-weight: 700; line-height: 1.15; }
      [data-composition-id="scene-02"] .pr-t span { color: var(--k-accent-soft); }
      [data-composition-id="scene-02"] .pr-c { font-size: 30px; line-height: 1.25; color: var(--k-text-2); margin-top: 8px; }
      [data-composition-id="scene-02"] .pr-arr { align-self: center; text-align: center; font-size: 56px; font-weight: 300; color: var(--k-text-2); line-height: 1; }
      [data-composition-id="scene-02"] .pr-chips { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
      [data-composition-id="scene-02"] .pr-chip { padding: 8px 16px; border: 2px solid var(--k-line); border-radius: 14px; background: var(--k-panel-2); font-size: 30px; font-weight: 600; line-height: 1.2; white-space: nowrap; }
      [data-composition-id="scene-02"] .pr-ok { border-color: var(--k-ok); background: var(--k-ok-tint); }
      [data-composition-id="scene-02"] .pr-tag { position: absolute; left: 96px; top: 222px; }
      [data-composition-id="scene-02"] .sc-item { height: 100%; display: flex; align-items: center; gap: 28px; font-size: 44px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.15; }
      [data-composition-id="scene-02"] .sc-ok { flex: none; width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; color: var(--k-ok); border: 3px solid var(--k-ok); background: var(--k-ok-tint); }
      [data-composition-id="scene-02"] .sc-ok svg { width: 44px; height: 44px; opacity: 0; }
      [data-composition-id="scene-02"] .sc-next { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 32px; }
      [data-composition-id="scene-02"] .sc-next .lab { font-size: 36px; font-weight: 700; color: var(--k-accent-soft); white-space: nowrap; }
      [data-composition-id="scene-02"] .sc-next .nm { font-size: 58px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
      [data-composition-id="scene-02"] .sc-next svg { flex: none; width: 76px; height: 41px; }
    </style>
    <script>
      (function () {
        const S = Kit.scene("02"), t = S.t, DUR = 32.3;
        // Count only fully revealed, stationary text; transitions do not count as reading time.
        const read = (text, at, off, reveal = 0.6) => {
          const needed = text.trim().split(/\s+/).filter((word) => /[\p{L}\p{N}]/u.test(word)).length / 3 + 1;
          if (off - at - reveal < needed - 1e-6) throw new Error(`Недостаточно времени для «${text}»: ${(off - at - reveal).toFixed(1)} с, нужно ${needed.toFixed(1)}`);
        };
        if (DUR - S.speechEnd < 1.5) throw new Error("Недостаточный хвост сцены");
        const hide = (...els) => els.forEach((el) => gsap.set(el, { autoAlpha: 0 }));
        const div = (cls, html, parent) => { const el = document.createElement("div"); el.className = cls; el.innerHTML = html; parent.appendChild(el); return el; };
        const col = (p) => div("pr-col", "", p);
        const row = (p, top, cols) => { const r = div("pr-row", "", p); r.style.top = top + "px"; r.style.gridTemplateColumns = cols; return r; };
        const tile = (p, at, ttl, sub, off, cls) => {
          const a = Kit.aside(S, { parent: p, tail: false, html: '<div class="pr-t">' + ttl + "</div>" + (sub ? '<div class="pr-c">' + sub + "</div>" : "") });
          if (cls) a.el.classList.add(cls);
          a.show(at); read(ttl.replace(/<[^>]+>/g, "") + " " + (sub || ""), at, off);
          return a;
        };
        const arrow = (p, at, ch = "→") => { const a = div("pr-arr", ch, p); hide(a); Kit.popIn(S, a, at); return a; };
        const line = (cls, text, p, at, off) => { const e = div(cls, text, p); hide(e); Kit.popIn(S, e, at); read(text, at, off); return e; };

        Kit.header(S, { header: { mode: "parts", total: 5 }, chapter: "Где лежат требования", step: 2, duration: DUR, parts: [{ n: 1, blank: true, at: 0 }] });

        const OUT1 = t("Путь") - 0.5;
        const s1 = S.stage(); gsap.set(s1, { autoAlpha: 1 });
        const r1 = row(s1, 250, "1fr 64px 1.3fr");
        tile(r1, t("Требования"), "Главные спецификации", "действующие требования", OUT1);
        arrow(r1, t("разницу"), "←");
        tile(r1, t("Новое изменение"), "Папка изменения", "зачем · что меняется · план изменений", OUT1, "pr-ok");
        line("pr-sub", "Только разница", s1, t("Папка показывает"), OUT1).style.top = "520px";

        const s2 = S.stage();
        const r2 = row(s2, 270, "1fr 1fr 1fr 1fr 1fr");
        tile(r2, t("создали"), "Создали", "папка изменения", DUR);
        tile(r2, t("проверили форму"), "Форма", "проверяет программа", DUR);
        tile(r2, t("смысл проверяют"), "Смысл", "техлид и другой аналитик", DUR);
        tile(r2, t("одобряет"), "Одобрение", "владелец продукта", DUR);
        tile(r2, t("архивирует"), "Архив", "разработчик, после реализации", DUR);
        line("pr-sub", "Форму проверяет программа, смысл — всегда люди", s2, t("Форму проверяет"), DUR).style.top = "640px";
        Kit.stageOut(S, s1, OUT1); Kit.stageIn(S, s2, OUT1 + 0.5);

        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
