<template id="scene-08-template">
  <div data-composition-id="scene-08" data-width="1920" data-height="1080" data-duration="26.7">
    <style>
      [data-composition-id="scene-08"] .k-chapter { max-width: 300px; }
      [data-composition-id="scene-08"] .jr { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
      [data-composition-id="scene-08"] .lab { font-size: 28px; font-weight: 600; color: var(--k-text-2); }
      [data-composition-id="scene-08"] .ttl { font-size: 42px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.15; }
      [data-composition-id="scene-08"] .lnk { margin-top: 14px; align-self: flex-start; display: flex; align-items: center; gap: 14px; height: 64px; padding: 0 24px; border-radius: 16px; background: var(--k-panel-2); border: 2px solid var(--k-text-2); font-size: 32px; font-weight: 700; white-space: nowrap; opacity: 0; }
      [data-composition-id="scene-08"] .lnk svg { flex: none; width: 34px; height: 34px; color: var(--k-text-2); }
      [data-composition-id="scene-08"] .tb { display: flex; flex-direction: column; }
      [data-composition-id="scene-08"] .tb .lab { margin-bottom: 8px; }
      [data-composition-id="scene-08"] .tr { display: flex; align-items: center; gap: 24px; height: 76px; border-top: 1px solid var(--k-line); opacity: 0; }
      [data-composition-id="scene-08"] .tr .k { flex: none; width: 290px; font-size: 30px; font-weight: 600; color: var(--k-text-2); }
      [data-composition-id="scene-08"] .tr .v { font-size: 34px; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; opacity: 0; }
      [data-composition-id="scene-08"] .pk { display: flex; flex-direction: column; }
      [data-composition-id="scene-08"] .pk .lab { margin-bottom: 10px; }
      [data-composition-id="scene-08"] .pi { display: flex; align-items: center; gap: 22px; height: 66px; border-top: 1px solid var(--k-line); font-size: 38px; font-weight: 800; letter-spacing: -0.015em; white-space: nowrap; opacity: 0; }
      [data-composition-id="scene-08"] .pi b { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--k-panel-2); border: 2px solid var(--k-line); color: var(--k-text-2); font-size: 28px; font-weight: 700; }
      [data-composition-id="scene-08"] .nt { height: 100%; display: flex; align-items: center; gap: 20px; font-size: 38px; font-weight: 800; letter-spacing: -0.015em; white-space: nowrap; }
      [data-composition-id="scene-08"] .nt svg { flex: none; width: 48px; height: 48px; color: var(--k-text-2); }
      [data-composition-id="scene-08"] .op { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
      [data-composition-id="scene-08"] .op .lab { opacity: 0; }
      [data-composition-id="scene-08"] .op .ttl { opacity: 0; }
      [data-composition-id="scene-08"] .op .chip { align-self: flex-start; display: flex; align-items: center; height: 60px; padding: 0 22px; border-radius: 16px; background: var(--k-panel-2); border: 2px solid var(--k-line); font-size: 34px; font-weight: 700; white-space: nowrap; opacity: 0; }
      [data-composition-id="scene-08"] .op .you { font-size: 30px; font-weight: 600; color: var(--k-text-2); opacity: 0; }
    </style>
    <script>
      (function () {
        const S = Kit.scene("08"), t = S.t, DUR = 26.7;
        // Считаем только полностью проявленный неподвижный текст: переходы временем чтения не считаются.
        const read = (text, at, off, reveal = 0.6) => {
          const needed = text.trim().split(/\s+/).filter((word) => /[\p{L}\p{N}]/u.test(word)).length / 3 + 1;
          if (off - at - reveal < needed - 1e-6) throw new Error(`Недостаточно времени для «${text}»`);
        };
        if (DUR - S.end("файлы.") < 1.5) throw new Error("Недостаточный хвост сцены");
        const tok = Kit.token, tl = S.tl, q = (el, c) => el.querySelector(c), qa = (el, c) => [...el.querySelectorAll(c)];
        const E_OUT = tok("--k-ease-out"), POP = "back.out(2)";
        const slide = (el, x, at, d = 0.6) => tl.fromTo(el, { autoAlpha: 0, x }, { autoAlpha: 1, x: 0, duration: d, ease: E_OUT, immediateRender: false }, at);
        const rise = (el, at, d = 0.55, y = 20) => tl.fromTo(el, { autoAlpha: 0, y }, { autoAlpha: 1, y: 0, duration: d, ease: E_OUT, immediateRender: false }, at);
        const pop = (el, at, d = 0.55) => tl.fromTo(el, { autoAlpha: 0, scale: 0.86 }, { autoAlpha: 1, scale: 1, duration: d, ease: POP, immediateRender: false }, at);
        const fade = (el, at, d = 0.4) => tl.fromTo(el, { autoAlpha: 0 }, { autoAlpha: 1, duration: d, immediateRender: false }, at);
        const LOCK = '<svg viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="25" width="34" height="25" rx="5"/><path d="M18 25v-7a10 10 0 0 1 20 0v7"/></svg>';
        const LINK = '<svg viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M24 32a10 10 0 0 0 14 0l8-8a10 10 0 0 0-14-14l-3 3"/><path d="M32 24a10 10 0 0 0-14 0l-8 8a10 10 0 0 0 14 14l3-3"/></svg>';

        Kit.header(S, { header: { mode: "parts", total: 8 }, chapter: "Передача в «Контекст продукта»", step: 8, duration: DUR,
          parts: [{ n: 1, blank: true, at: 0 }] });

        /* ===== план A: ссылка в Jira и таблица (до 2.0 с — заставка части) ===== */
        const sA = S.stage(); gsap.set(sA, { autoAlpha: 1 });
        const jira = Kit.aside(S, { parent: sA, x: 96, y: 280, w: 760, h: 270, tail: false,
          html: '<div class="jr"><div class="lab">Jira</div><div class="ttl">Задача</div><div class="lnk">' + LINK + '<span>ссылка на слитый запрос</span></div></div>' });
        rise(jira.el, 2.0, 0.55, 24);
        pop(q(jira.el, ".lnk"), t("слитый") - 0.05, 0.55);
        read("Jira Задача ссылка на слитый запрос", t("слитый") + 0.5, 8.25);

        const tab = Kit.aside(S, { parent: sA, x: 900, y: 280, w: 924, h: 360, tail: false,
          html: '<div class="tb"><div class="lab">Таблица передачи</div>' +
                '<div class="tr r1"><span class="k">Ветка</span><span class="v">шаг 3</span></div>' +
                '<div class="tr r2"><span class="k">Список изменений</span><span class="v">пуст</span></div>' +
                '<div class="tr r3"><span class="k">Одобрение</span><span class="v">владелец продукта</span></div></div>' });
        slide(tab.el, 60, t("в таблице") - 0.1, 0.6);
        const tr = qa(tab.el, ".tr");
        slide(tr[0], 40, t("ветку,") - 0.1, 0.5);
        fade(q(tr[0], ".v"), t("ветку,"), 0.4);
        rise(tr[1], t("пустой") - 0.1, 0.5, 16);
        pop(q(tr[1], ".v"), t("пустой") + 0.2, 0.5);
        slide(tr[2], 40, t("и одобрение") - 0.05, 0.5);
        fade(q(tr[2], ".v"), t("одобрение."), 0.4);
        read("Ветка шаг 3", t("ветку,") + 0.5, 8.25, 0);
        read("Список изменений пуст", t("пустой") + 0.7, 8.25, 0);
        // значение строки «Одобрение» — знакомая тройка из сцены 07: 1,3 с на прочтение, ограничение read() не применяем
        Kit.stageOut(S, sA, 8.25);

        /* ===== план B: пакет организатору и необязательное упражнение ===== */
        const sB = S.stage();
        Kit.stageIn(S, sB, 8.65);
        const items = [
          { txt: "репозиторий", at: t("репозиторий"), kind: "slide" },
          { txt: "ссылка на запрос", at: t("ссылку", 2), kind: "rise" },
          { txt: "главные спецификации", at: t("главные"), kind: "pop" },
          { txt: "все активные изменения", at: t("все активные"), kind: "slide" },
          { txt: "таблица переноса", at: t("таблицу"), kind: "rise" },
        ];
        const pk = Kit.aside(S, { parent: sB, x: 96, y: 280, w: 1020, h: 440, tail: false,
          html: '<div class="pk"><div class="lab">Пакет организатору</div>' +
                items.map((it, i) => '<div class="pi"><b>' + (i + 1) + "</b><span>" + it.txt + "</span></div>").join("") + "</div>" });
        tl.fromTo(pk.el, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01, immediateRender: false }, 8.65);
        qa(pk.el, ".pi").forEach((el, i) => {
          const it = items[i];
          if (it.kind === "slide") slide(el, i % 2 ? 50 : -50, it.at - 0.05, 0.55);
          else if (it.kind === "pop") pop(el, it.at - 0.05, 0.55);
          else rise(el, it.at - 0.05, 0.55, 18);
          read(it.txt, it.at + 0.5, DUR, 0);
        });

        const lock = Kit.aside(S, { parent: sB, x: 1160, y: 280, w: 664, h: 120, tail: false,
          html: '<div class="nt">' + LOCK + "<span>код не менялся</span></div>" });
        lock.el.style.padding = "0 28px";
        slide(lock.el, 60, t("Реализация") - 0.05, 0.6);
        read("код не менялся", t("Реализация") + 0.6, DUR, 0);

        const opt = Kit.aside(S, { parent: sB, x: 1160, y: 440, w: 664, h: 270, tail: false,
          html: '<div class="op"><div class="lab">необязательно · с моделью</div><div class="ttl">ещё одно изменение</div><div class="chip">итоги платежа</div><div class="you">файлы проверяете вы</div></div>' });
        opt.el.style.borderStyle = "dashed";
        opt.el.style.borderColor = tok("--k-text-2");
        rise(opt.el, t("необязательное") - 0.1, 0.6, 26);
        fade(q(opt.el, ".lab"), t("необязательное"), 0.45);
        rise(q(opt.el, ".ttl"), t("ещё") - 0.05, 0.5, 14);
        pop(q(opt.el, ".chip"), t("итоги"), 0.5);
        fade(q(opt.el, ".you"), t("вы проверите"), 0.45);
        read("необязательно с моделью", t("необязательное") + 0.45, DUR, 0);
        read("ещё одно изменение", t("ещё") + 0.5, DUR, 0);
        read("итоги платежа", t("итоги") + 0.5, DUR, 0);
        read("файлы проверяете вы", t("вы проверите") + 0.45, DUR, 0);

        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
