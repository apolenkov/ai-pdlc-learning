<template id="scene-08-template">
  <div data-composition-id="scene-08" data-width="1920" data-height="1080" data-duration="23.5">
    <style>
      [data-composition-id="scene-08"] .ttl { height: 100%; display: flex; align-items: center; font-size: 52px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
      [data-composition-id="scene-08"] .gr { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
      [data-composition-id="scene-08"] .gr .gi { font-size: 36px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; opacity: 0; }
      [data-composition-id="scene-08"] .gr .gs { font-size: 32px; font-weight: 500; color: var(--k-text-2); line-height: 1.2; opacity: 0; }
      [data-composition-id="scene-08"] .lk { position: absolute; width: 56px; height: 40px; }
      [data-composition-id="scene-08"] .lk svg { display: block; width: 100%; height: 100%; overflow: visible; }
      [data-composition-id="scene-08"] .ck { height: 100%; display: flex; align-items: center; gap: 24px; font-size: 40px; font-weight: 800; letter-spacing: -0.015em; white-space: nowrap; }
      [data-composition-id="scene-08"] .ck .ok { flex: none; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; color: var(--k-ok); border: 3px solid var(--k-ok); background: var(--k-ok-tint); opacity: 0; }
      [data-composition-id="scene-08"] .ck .ok svg { width: 34px; height: 34px; }
      [data-composition-id="scene-08"] .cx { height: 100%; display: flex; align-items: center; gap: 22px; font-size: 34px; font-weight: 700; white-space: nowrap; }
      [data-composition-id="scene-08"] .cx .c { display: flex; align-items: center; height: 60px; padding: 0 22px; border-radius: 16px; background: var(--k-panel-2); border: 2px solid var(--k-line); opacity: 0; }
      [data-composition-id="scene-08"] .cx svg { flex: none; width: 56px; height: 30px; opacity: 0; }
      [data-composition-id="scene-08"] .cat { height: 100%; display: flex; align-items: center; justify-content: space-between; font-size: 44px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
      [data-composition-id="scene-08"] .cat svg { flex: none; width: 76px; height: 41px; }
    </style>
    <script>
      (function () {
        const S = Kit.scene("08"), t = S.t, DUR = 23.5;
        // Считаем только полностью проявленный неподвижный текст: переходы временем чтения не считаются.
        const read = (text, at, off, reveal = 0.6) => {
          const needed = text.trim().split(/\s+/).filter((word) => /[\p{L}\p{N}]/u.test(word)).length / 3 + 1;
          if (off - at - reveal < needed - 1e-6) throw new Error(`Недостаточно времени для «${text}»`);
        };
        if (DUR - S.end("заканчивается.") < 1.5) throw new Error("Недостаточный хвост сцены");
        const tok = Kit.token, tl = S.tl, q = (el, c) => el.querySelector(c), qa = (el, c) => [...el.querySelectorAll(c)];
        const E_OUT = tok("--k-ease-out"), POP = "back.out(2)";
        const slide = (el, x, at, d = 0.6) => tl.fromTo(el, { autoAlpha: 0, x }, { autoAlpha: 1, x: 0, duration: d, ease: E_OUT, immediateRender: false }, at);
        const rise = (el, at, d = 0.55, y = 20) => tl.fromTo(el, { autoAlpha: 0, y }, { autoAlpha: 1, y: 0, duration: d, ease: E_OUT, immediateRender: false }, at);
        const pop = (el, at, d = 0.55) => tl.fromTo(el, { autoAlpha: 0, scale: 0.86 }, { autoAlpha: 1, scale: 1, duration: d, ease: POP, immediateRender: false }, at);
        const fade = (el, at, d = 0.4) => tl.fromTo(el, { autoAlpha: 0 }, { autoAlpha: 1, duration: d, immediateRender: false }, at);
        const CHECK = Kit.icons.check;
        const gray = tok("--k-text-2"), acc = tok("--k-accent");
        const ARR = (c) => '<svg viewBox="0 0 56 30" fill="none"><path d="M3 15H49M39 5L50 15L39 25" stroke="' + c + '" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

        /* Итог без шага: все части пройдены, шапка «Готово» */
        Kit.header(S, { header: { mode: "parts", total: 7 }, chapter: "Что дальше", step: null, duration: DUR,
          parts: [{ n: 1, blank: true, at: 0 }] });
        const s1 = S.stage(); gsap.set(s1, { autoAlpha: 1 });

        /* ---- заголовок-итог ---- */
        const ttl = Kit.aside(S, { parent: s1, x: 96, y: 205, w: 1728, h: 74, tail: false,
          html: '<div class="ttl">От принятого изменения — к коду и спецификации</div>' });
        ttl.el.style.cssText += ";background:transparent;border-color:transparent;box-shadow:none;padding:0 4px;";
        rise(ttl.el, 0.3, 0.6, 16);
        read("От принятого изменения к коду и спецификации", 0.9, DUR, 0);

        /* ---- четыре группы одной линией: слова диктора ---- */
        const W = 390, GAP = 56, Y = 300, H = 200;
        const groups = [
          { lines: [["две папки", t("две папки")], ["код модели", t("код модели")]], kind: "slide", dx: -60 },
          { lines: [["независимая проверка", t("независимая проверка")], ["проверка людьми", t("проверка людьми")]], kind: "rise" },
          { lines: [["два слитых запроса", t("два слитых запроса")]], kind: "pop" },
          { lines: [["главная спецификация", t("главная спецификация")]], sub: ["обновлённая архивом", t("обновлённая архивом")], kind: "slide", dx: 60 },
        ];
        groups.forEach((g, i) => {
          const x = 96 + i * (W + GAP);
          const html = '<div class="gr">' + g.lines.map((l) => '<div class="gi">' + l[0] + "</div>").join("") + (g.sub ? '<div class="gs">' + g.sub[0] + "</div>" : "") + "</div>";
          const c = Kit.aside(S, { parent: s1, x, y: Y, w: W, h: H, tail: false, html });
          const first = g.lines[0][1];
          if (g.kind === "slide") slide(c.el, g.dx, first - 0.05, 0.6); else if (g.kind === "pop") pop(c.el, first - 0.05, 0.6); else rise(c.el, first - 0.05, 0.6, 26);
          const items = qa(c.el, ".gi");
          items.forEach((it, k) => fade(it, g.lines[k][1], 0.4));
          if (g.sub) fade(q(c.el, ".gs"), g.sub[1], 0.4);
          read(g.lines.map((l) => l[0]).join(" "), g.lines[g.lines.length - 1][1] + 0.4, DUR, 0);
          if (g.sub) read(g.sub[0], g.sub[1] + 0.4, DUR, 0);
          if (i) {
            const a = document.createElement("div");
            a.className = "lk"; a.setAttribute("data-layout-allow-overlap", "");
            a.style.left = (x - GAP + 0) + "px"; a.style.top = (Y + H / 2 - 20) + "px";
            a.innerHTML = ARR(gray); s1.appendChild(a); gsap.set(a, { autoAlpha: 0 });
            fade(a, first - 0.05, 0.4);
          }
        });

        /* ---- у каждого сценария есть проверка: единственная зелёная галочка ---- */
        const T_CK = t("У каждого");
        const ck = Kit.aside(S, { parent: s1, x: 96, y: 525, w: 1250, h: 84, tail: false,
          html: '<div class="ck"><span class="ok">' + CHECK + '</span><span class="tx">каждый сценарий — с проверкой</span></div>' });
        ck.el.style.padding = "14px 26px";
        rise(ck.el, T_CK, 0.55, 22);
        pop(q(ck.el, ".ok"), t("проверка."), 0.55);
        read("каждый сценарий с проверкой", T_CK + 0.6, DUR, 0);

        /* ---- контекст следующего запроса ---- */
        const cx = Kit.aside(S, { parent: s1, x: 96, y: 630, w: 1250, h: 100, tail: false,
          html: '<div class="cx"><span class="c a">требования + история</span>' + ARR(gray) + '<span class="c b">контекст следующего запроса</span></div>' });
        cx.el.style.padding = "20px 26px";
        tl.set(cx.el, { autoAlpha: 1 }, t("Принятые") - 0.05);
        slide(q(cx.el, ".c.a"), -50, t("Принятые"), 0.6);
        tl.fromTo(q(cx.el, "svg"), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.5, ease: E_OUT, immediateRender: false }, t("теперь"));
        slide(q(cx.el, ".c.b"), 50, t("контекст"), 0.6);
        read("требования история", t("Принятые") + 0.6, DUR, 0);
        read("контекст следующего запроса", t("контекст") + 0.6, DUR, 0);

        /* ---- курс заканчивается: к каталогу ---- */
        const T_END = t("На этом");
        const cat = Kit.aside(S, { parent: s1, x: 96, y: 732, w: 1250, h: 82, tail: false,
          html: '<div class="cat"><span>К каталогу курса</span>' + ARR(acc) + '</div>' });
        cat.el.style.padding = "0 36px";
        cat.el.style.borderColor = acc;
        pop(cat.el, T_END, 0.6);
        tl.to(q(cat.el, ".cat svg"), { x: 14, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, S.end("заканчивается."));
        read("К каталогу курса", T_END + 0.6, DUR, 0);

        /* ---- скетч команды: рисуется, пока идут итоги ---- */
        Kit.sketch(S, { parent: s1, name: "team-done", x: 1400, y: 525, w: 424, at: T_CK, dur: 6.0 });

        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
