<template id="scene-07-template">
  <div data-composition-id="scene-07" data-width="1920" data-height="1080" data-duration="24.9">
    <style>
      [data-composition-id="scene-07"] .cd { height: 100%; }
      [data-composition-id="scene-07"] .cd .ic { width: 52px; height: 52px; color: var(--k-text-2); }
      [data-composition-id="scene-07"] .cd .ic svg { width: 100%; height: 100%; }
      [data-composition-id="scene-07"] .cd .ttl { margin-top: 6px; font-size: 40px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.15; }
      [data-composition-id="scene-07"] .cd .m { margin-top: 10px; font-family: var(--k-font-mono); font-size: 30px; font-weight: 500; line-height: 1.3; color: var(--k-accent-soft); font-variant-ligatures: none; white-space: nowrap; }
      [data-composition-id="scene-07"] .cd .sub { margin-top: 6px; font-size: 32px; font-weight: 500; color: var(--k-text-2); line-height: 1.25; }
      [data-composition-id="scene-07"] .cd .m.plain { color: var(--k-text); }
      [data-composition-id="scene-07"] .tg { display: inline-flex; align-items: center; gap: 12px; margin-top: 14px; margin-right: 12px; height: 56px; padding: 0 20px; border-radius: 16px; font-size: 30px; font-weight: 700; white-space: nowrap; opacity: 0; }
      [data-composition-id="scene-07"] .tg svg { flex: none; width: 28px; height: 28px; }
      [data-composition-id="scene-07"] .tg.okc { color: var(--k-text); border: 2px solid var(--k-ok); background: var(--k-ok-tint); }
      [data-composition-id="scene-07"] .tg.okc svg { color: var(--k-ok); }
      [data-composition-id="scene-07"] .tg.lk { color: var(--k-text); border: 2px solid var(--k-text-2); background: var(--k-panel-2); }
      [data-composition-id="scene-07"] .tg.lk svg { color: var(--k-text-2); }
      [data-composition-id="scene-07"] .st-i { height: 100%; display: flex; align-items: center; gap: 18px; font-size: 34px; font-weight: 700; white-space: nowrap; }
      [data-composition-id="scene-07"] .st-i b { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--k-panel-2); border: 2px solid var(--k-line); color: var(--k-text-2); font-size: 28px; font-weight: 700; }
      [data-composition-id="scene-07"] .sk { position: relative; height: 100%; display: flex; align-items: center; font-size: 36px; font-weight: 700; color: var(--k-text-2); white-space: nowrap; }
      [data-composition-id="scene-07"] .sk .tx { position: relative; }
      [data-composition-id="scene-07"] .sk .strike { position: absolute; left: -10px; right: -10px; top: 54%; height: 5px; border-radius: 3px; background: var(--k-accent); transform-origin: 0 50%; transform: scaleX(0); }
      [data-composition-id="scene-07"] .an-i { height: 100%; display: flex; flex-direction: column; justify-content: center; }
      [data-composition-id="scene-07"] .an-i .l { font-size: 28px; font-weight: 600; color: var(--k-text-2); }
      [data-composition-id="scene-07"] .an-i .v { font-size: 40px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.15; }
      [data-composition-id="scene-07"] .lab { position: absolute; width: 380px; text-align: center; font-size: 34px; font-weight: 700; color: var(--k-accent-soft); }
      [data-composition-id="scene-07"] .sc-arrow { position: absolute; }
      [data-composition-id="scene-07"] .sc-arrow svg { display: block; width: 100%; height: 100%; overflow: visible; }
    </style>
    <script>
      (function () {
        const S = Kit.scene("07"), t = S.t, DUR = 24.9;
        // Считаем только полностью проявленный неподвижный текст: переходы временем чтения не считаются.
        const read = (text, at, off, reveal = 0.6) => {
          const needed = text.trim().split(/\s+/).filter((word) => /[\p{L}\p{N}]/u.test(word)).length / 3 + 1;
          if (off - at - reveal < needed - 1e-6) throw new Error(`Недостаточно времени для «${text}»`);
        };
        if (DUR - S.end("исправляют.") < 1.5) throw new Error("Недостаточный хвост сцены");
        const tok = Kit.token, tl = S.tl, q = (el, c) => el.querySelector(c);
        const E_OUT = tok("--k-ease-out"), POP = "back.out(2)";
        const slide = (el, x, at, d = 0.6) => tl.fromTo(el, { autoAlpha: 0, x }, { autoAlpha: 1, x: 0, duration: d, ease: E_OUT, immediateRender: false }, at);
        const rise = (el, at, d = 0.55, y = 20) => tl.fromTo(el, { autoAlpha: 0, y }, { autoAlpha: 1, y: 0, duration: d, ease: E_OUT, immediateRender: false }, at);
        const pop = (el, at, d = 0.55) => tl.fromTo(el, { autoAlpha: 0, scale: 0.86 }, { autoAlpha: 1, scale: 1, duration: d, ease: POP, immediateRender: false }, at);
        const CHECK = Kit.icons.check;
        const LOCK = '<svg viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="25" width="34" height="25" rx="5"/><path d="M18 25v-7a10 10 0 0 1 20 0v7"/></svg>';
        const acc = tok("--k-accent");

        Kit.header(S, { header: { mode: "parts", total: 7 }, chapter: "Архив", step: 7, duration: DUR,
          parts: [{ n: 1, blank: true, at: 0 }] });
        const s1 = S.stage(); gsap.set(s1, { autoAlpha: 1 });

        /* ---- папка изменения → главная спецификация (до 2.0 с — заставка части) ---- */
        const folder = Kit.aside(S, { parent: s1, x: 96, y: 225, w: 660, h: 230, tail: false,
          html: '<div class="cd"><div class="ic">' + Kit.icons.folder + '</div><div class="ttl">Папка изменения</div><div class="m">openspec/changes/<br>limit-credit-amount/</div></div>' });
        slide(folder.el, -70, 2.0, 0.65);
        read("Папка изменения openspec changes limit-credit-amount", 2.0, DUR);

        const T_SPEC = t("в главную") - 0.25;
        const spec = Kit.aside(S, { parent: s1, x: 1156, y: 225, w: 668, h: 200, tail: false,
          html: '<div class="cd"><div class="ttl">Главная спецификация</div><div class="m plain">credit-calculator</div>' +
                '<div><span class="tg okc">' + CHECK + '= принятый договор</span></div><div><span class="tg lk">' + LOCK + 'руками не правят</span></div></div>' });
        slide(spec.el, 70, T_SPEC, 0.6);
        read("Главная спецификация credit-calculator", T_SPEC + 0.6, DUR, 0);

        // стрелка «разница»: папка → спецификация
        const mkArrow = (left, top, w, h, path, head) => {
          const a = document.createElement("div");
          a.className = "sc-arrow"; a.setAttribute("data-layout-allow-overlap", "");
          a.style.left = left + "px"; a.style.top = top + "px"; a.style.width = w + "px"; a.style.height = h + "px";
          a.innerHTML = '<svg viewBox="0 0 ' + w + ' ' + h + '" fill="none"><path class="ln" pathLength="1" d="' + path + '" stroke="' + acc + '" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:1 2;stroke-dashoffset:1"/>' +
                        '<path class="hd" d="' + head + '" stroke="' + acc + '" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"/></svg>';
          s1.appendChild(a); gsap.set(a, { autoAlpha: 0 });
          return a;
        };
        const draw = (a, at, d) => {
          tl.set(a, { autoAlpha: 1 }, at);
          tl.to(q(a, ".ln"), { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, at);
          tl.to(q(a, ".hd"), { opacity: 1, duration: 0.2 }, at + d - 0.05);
        };
        const a1 = mkArrow(766, 330, 380, 40, "M4 20H356", "M338 6L358 20L338 34");
        draw(a1, t("разницу"), 0.7);
        const lab1 = document.createElement("div");
        lab1.className = "lab"; lab1.textContent = "принятая разница"; lab1.style.left = "766px"; lab1.style.top = "276px";
        s1.appendChild(lab1); gsap.set(lab1, { autoAlpha: 0 });
        pop(lab1, t("принятую") + 0.5, 0.5);
        read("принятая разница", t("принятую") + 1.0, DUR, 0);

        // история остаётся: папка → archive/
        const arch = Kit.aside(S, { parent: s1, x: 1156, y: 560, w: 668, h: 190, tail: false,
          html: '<div class="cd"><div class="ttl">Архив</div><div class="m plain">openspec/changes/archive/</div><div class="sub">история изменения</div><div><span class="tg okc">' + CHECK + 'папка в архиве</span></div></div>' });
        const a2 = mkArrow(756, 428, 400, 262, "M6 14C200 14 190 244 372 244", "M352 226L374 244L350 258");
        draw(a2, t("сохраняет"), 1.1);
        rise(arch.el, t("историю") - 0.1, 0.6, 26);
        read("Архив openspec changes archive история изменения", t("историю") + 0.5, DUR, 0);

        // три условия по словам
        const steps = [
          { txt: "после слияния", at: t("после слияния"), kind: "slide" },
          { txt: "отдельная ветка", at: t("в отдельной"), kind: "pop" },
        ];
        steps.forEach((s, i) => {
          const c = Kit.aside(S, { parent: s1, x: 96, y: 485 + i * 70, w: 660, h: 60, tail: false,
            html: '<div class="st-i"><b>' + (i + 1) + '</b><span>' + s.txt + '</span></div>' });
          c.el.style.padding = "0 18px";
          c.el.style.borderRadius = "18px";
          if (s.kind === "slide") slide(c.el, -60, s.at, 0.55); else if (s.kind === "pop") pop(c.el, s.at, 0.55); else rise(c.el, s.at, 0.55, 26);
          read(s.txt, s.at + 0.55, DUR, 0);
        });

        // пропускать нельзя
        const T_SK = t("Пропускать");
        const skip = Kit.aside(S, { parent: s1, x: 96, y: 716, w: 660, h: 96, tail: false,
          html: '<div class="sk"><span class="tx">пропустить обновление<i class="strike"></i></span></div>' });
        skip.el.style.padding = "0 28px";
        tl.fromTo(skip.el, { autoAlpha: 0, scale: 1.06 }, { autoAlpha: 1, scale: 1, duration: 0.55, ease: E_OUT, immediateRender: false }, T_SK);
        tl.to(q(skip.el, ".strike"), { scaleX: 1, duration: 0.45, ease: "power2.out" }, t("нельзя"));
        read("пропустить обновление", T_SK + 0.55, DUR, 0);

        // аналитик сверяет: две галочки на карточках
        const an = Kit.aside(S, { parent: s1, x: 800, y: 716, w: 340, h: 96, tail: false,
          html: '<div class="an-i"><div class="l">Аналитик</div><div class="v">сверяет</div></div>' });
        an.el.style.padding = "10px 28px";
        pop(an.el, t("Аналитик"), 0.55);
        read("Аналитик сверяет", t("Аналитик") + 0.55, DUR, 0);
        const okSpec = q(spec.el, ".tg.okc"), okArch = q(arch.el, ".tg.okc");
        tl.to(spec.el, { height: 300, duration: 0.45, ease: E_OUT }, t("совпала") - 0.1);
        tl.to(arch.el, { height: 262, duration: 0.45, ease: E_OUT }, t("лежит") - 0.1);
        pop(okSpec, t("совпала"), 0.55);
        pop(okArch, t("лежит"), 0.55);
        read("= принятый договор", t("совпала") + 0.55, DUR, 0);
        read("папка в архиве", t("лежит") + 0.55, DUR, 0);
        tl.to(arch.el, { borderColor: tok("--k-ok"), duration: 0.5 }, t("в архиве"));

        // руками не правят
        const lk = q(spec.el, ".tg.lk");
        pop(lk, t("руками"), 0.55);
        read("руками не правят", t("руками") + 0.3, DUR, 0);

        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
