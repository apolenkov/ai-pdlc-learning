<template id="scene-01-template">
  <div data-composition-id="scene-01" data-width="1920" data-height="1080" data-duration="21.7">
    <style>
      [data-composition-id="scene-01"] .d1-abs { position: absolute; }
      [data-composition-id="scene-01"] .d1-card { top: 232px; width: 800px; height: 262px; padding: 24px 32px; }
      [data-composition-id="scene-01"] .d1-ttl { font-size: 46px; font-weight: 800; line-height: 1.15; letter-spacing: -0.01em; }
      [data-composition-id="scene-01"] .d1-mono { display: inline-block; margin-top: 14px; padding: 6px 16px; border-radius: 12px; background: var(--k-accent-tint); font-family: var(--k-font-mono); font-size: 34px; font-weight: 600; white-space: nowrap; }
      [data-composition-id="scene-01"] .d1-sub { margin-top: 14px; font-size: 36px; font-weight: 500; color: var(--k-text-2); line-height: 1.25; }
      [data-composition-id="scene-01"] .d1-chip { display: inline-block; margin-top: 18px; padding: 6px 20px; border-radius: 16px; border: 2px solid var(--k-text-2); font-size: 32px; font-weight: 600; color: var(--k-text); white-space: nowrap; }
      [data-composition-id="scene-01"] .d1-ne { left: 906px; top: 308px; width: 108px; height: 108px; }
      [data-composition-id="scene-01"] .d1-ind { left: 760px; top: 520px; width: 400px; text-align: center; font-size: 34px; font-weight: 600; color: var(--k-text-2); }
      [data-composition-id="scene-01"] .d1-kit { left: 96px; top: 536px; display: flex; align-items: center; gap: 16px; padding: 8px 24px 8px 18px; border-radius: 20px; border: 2px solid var(--k-text-2); background: var(--k-panel-2); font-size: 34px; font-weight: 600; white-space: nowrap; }
      [data-composition-id="scene-01"] .d1-kit svg { width: 44px; height: 44px; color: var(--k-text-2); flex: none; }
      [data-composition-id="scene-01"] .d1-spec { left: 96px; top: 652px; width: 1728px; height: 168px; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; }
      [data-composition-id="scene-01"] .d1-spec .ttl { font-size: 50px; font-weight: 800; letter-spacing: -0.01em; }
      [data-composition-id="scene-01"] .d1-spec .ttl small { display: block; margin-top: 6px; font-size: 32px; font-weight: 500; color: var(--k-text-2); letter-spacing: 0; }
      [data-composition-id="scene-01"] .d1-chips { display: flex; align-items: center; gap: 18px; }
      [data-composition-id="scene-01"] .d1-lock { display: inline-flex; align-items: center; gap: 14px; padding: 8px 24px 8px 18px; border-radius: 18px; border: 2px solid var(--k-text-2); font-size: 36px; font-weight: 700; white-space: nowrap; }
      [data-composition-id="scene-01"] .d1-lock svg { width: 38px; height: 38px; flex: none; }
      [data-composition-id="scene-01"] .d1-arch { padding: 8px 26px; border-radius: 18px; border: 2px solid var(--k-accent); background: var(--k-accent-tint); color: var(--k-accent-soft); font-size: 36px; font-weight: 800; white-space: nowrap; }
    </style>
    <script>
      (function () {
        const S = Kit.scene("01"), t = S.t, DUR = 21.7;
        // Count only fully revealed, stationary text; transitions do not count as reading time.
        const read = (text, at, off, reveal = 0.6) => {
          const needed = text.trim().split(/\s+/).filter((word) => /[\p{L}\p{N}]/u.test(word)).length / 3 + 1;
          if (off - at - reveal < needed - 1e-6) throw new Error(`Недостаточно времени для «${text}»`);
        };
        if (DUR - S.speechEnd < 1.5) throw new Error("Недостаточный хвост сцены");
        const hide = (...els) => els.forEach((el) => gsap.set(el, { autoAlpha: 0 }));
        const div = (cls, html, parent) => { const el = document.createElement("div"); el.className = cls; el.innerHTML = html; parent.appendChild(el); return el; };
        const LOCK = '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="18" width="26" height="18" rx="4"/><path d="M12 18v-5a8 8 0 0 1 16 0v5"/></svg>';
        const NE = '<svg class="d1-abs d1-ne" viewBox="0 0 126 126" fill="none" stroke="#eef0f3" stroke-width="9" stroke-linecap="round"><path pathLength="1" d="M26 48h74"/><path pathLength="1" d="M26 80h74"/><path pathLength="1" d="M82 20L44 106"/></svg>';
        const T0 = 2.0;   // the part title covers the first 2 s: nothing is visible before it

        Kit.header(S, { header: { mode: "parts", total: 7 }, chapter: "Вход и выход", step: 1, duration: DUR, parts: [{ n: 1, blank: true, at: 0 }] });

        const s1 = S.stage(); gsap.set(s1, { autoAlpha: 1 });

        /* ---- две карточки входа ---- */
        const c1 = div("k-card d1-abs d1-card", '<div class="d1-ttl">Принятое изменение</div><span class="d1-mono">limit-credit-amount</span><br><span class="d1-chip">форк требований</span>', s1);
        c1.style.left = "96px";
        const chip1 = c1.querySelector(".d1-chip"); hide(c1, chip1);
        S.tl.fromTo(c1, { autoAlpha: 0, x: -90 }, { autoAlpha: 1, x: 0, duration: 0.8, ease: "power3.out", immediateRender: false }, T0);
        Kit.popIn(S, chip1, t("форке"));
        read("Принятое изменение limit-credit-amount форк требований", T0, DUR);

        const c2 = div("k-card d1-abs d1-card", '<div class="d1-ttl">Версия сервиса</div><div class="d1-sub">от неё начнётся код</div>', s1);
        c2.style.left = "1024px"; c2.style.display = "flex"; c2.style.flexDirection = "column"; c2.style.justifyContent = "center"; hide(c2);
        S.tl.fromTo(c2, { autoAlpha: 0, y: 50, scale: 0.94 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(2)", immediateRender: false }, t("отдельная") - 0.05);
        read("Версия сервиса от неё начнётся код", t("отдельная"), DUR);

        /* ---- не равно: две независимые версии ---- */
        s1.insertAdjacentHTML("beforeend", NE);
        const ne = s1.querySelector(".d1-ne"); hide(ne);
        const T_NE = t("независимые");
        S.tl.set(ne, { autoAlpha: 1 }, T_NE);
        ne.querySelectorAll("path").forEach((p, i) => S.tl.fromTo(p, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, T_NE + i * 0.14));
        S.tl.to(ne, { scale: 1.18, transformOrigin: "50% 50%", duration: 0.25, ease: "power2.out" }, t("не путайте"));
        S.tl.to(ne, { scale: 1, duration: 0.4, ease: "power2.inOut" }, t("не путайте") + 0.25);
        const ind = div("d1-abs d1-ind", "независимые", s1); hide(ind);
        S.tl.fromTo(ind, { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, T_NE + 0.45);
        read("независимые", T_NE + 0.45, DUR);

        /* ---- нет своего изменения: комплект организатора ---- */
        const kit = div("d1-abs d1-kit", `${Kit.icons.folder}комплект организатора`, s1); hide(kit);
        S.tl.fromTo(kit, { autoAlpha: 0, y: 40, scale: 0.94 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(2)", immediateRender: false }, t("организатор") - 0.05);
        read("комплект организатора", t("организатор"), DUR);

        /* ---- главная спецификация: руками не правят, обновит архив ---- */
        const spec = div("k-card d1-abs d1-spec", `<div class="ttl">Главная спецификация</div><div class="d1-chips"><span class="d1-lock">${LOCK}руками не правят</span><span class="d1-arch">обновит архив</span></div>`, s1);
        const lk = spec.querySelector(".d1-lock"), ar = spec.querySelector(".d1-arch");
        hide(spec, lk, ar);
        S.tl.fromTo(spec, { autoAlpha: 0, x: -70 }, { autoAlpha: 1, x: 0, duration: 0.7, ease: "power3.out", immediateRender: false }, t("Главную") - 0.05);
        Kit.popIn(S, lk, t("руками"));
        S.tl.fromTo(ar, { autoAlpha: 0, scale: 0.7 }, { autoAlpha: 1, scale: 1, duration: 0.6, ease: "back.out(2)", immediateRender: false }, t("обновит"));
        S.tl.to(spec, { borderColor: Kit.token("--k-accent"), duration: 0.5 }, t("архив."));
        read("Главная спецификация руками не правят", t("Главную"), DUR);
        read("обновит архив", t("обновит"), DUR);

        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
