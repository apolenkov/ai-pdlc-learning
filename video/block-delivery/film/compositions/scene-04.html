<template id="scene-04-template">
  <div data-composition-id="scene-04" data-width="1920" data-height="1080" data-duration="24.5">
    <style>
      [data-composition-id="scene-04"] .w-hd { display: flex; align-items: center; justify-content: space-between; height: 56px; }
      [data-composition-id="scene-04"] .w-ttl { font-size: 40px; font-weight: 800; letter-spacing: -0.01em; }
      [data-composition-id="scene-04"] .w-lock { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 20px; border-radius: 16px; border: 2px solid var(--k-text-2); background: var(--k-panel-2); color: var(--k-text); font-size: 30px; font-weight: 700; white-space: nowrap; opacity: 0; }
      [data-composition-id="scene-04"] .w-lock svg { width: 30px; height: 30px; }
      [data-composition-id="scene-04"] .w-hist { margin-top: 22px; display: inline-flex; align-items: center; gap: 14px; height: 60px; padding: 0 22px; border-radius: 16px; background: var(--k-panel-2); border: 2px solid var(--k-line); font-size: 32px; font-weight: 600; color: var(--k-text); white-space: nowrap; opacity: 0; }
      [data-composition-id="scene-04"] .w-hist i { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--k-text-2); }
      [data-composition-id="scene-04"] .w-rc { margin-top: 34px; display: flex; align-items: center; gap: 12px; height: 64px; }
      [data-composition-id="scene-04"] .w-chip { display: flex; align-items: center; height: 60px; padding: 0 22px; border-radius: 16px; background: var(--k-panel-2); border: 2px solid var(--k-line); font-size: 32px; font-weight: 700; white-space: nowrap; opacity: 0; }
      [data-composition-id="scene-04"] .w-rc svg { flex: none; width: 70px; height: 30px; opacity: 0; }
      [data-composition-id="scene-04"] .f-row { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      [data-composition-id="scene-04"] .f-row .tx { font-size: 36px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
      [data-composition-id="scene-04"] .f-loc { flex: none; height: 52px; padding: 0 16px; display: flex; align-items: center; border-radius: 14px; background: var(--k-accent-tint); color: var(--k-accent-soft); font-size: 30px; font-weight: 700; white-space: nowrap; opacity: 0; }
      [data-composition-id="scene-04"] .o-row { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      [data-composition-id="scene-04"] .o-row .ttl { font-size: 38px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.15; }
      [data-composition-id="scene-04"] .o-row .sub { font-size: 32px; font-weight: 500; color: var(--k-text-2); line-height: 1.25; margin-top: 4px; }
      [data-composition-id="scene-04"] .o-who { flex: none; height: 56px; padding: 0 22px; display: flex; align-items: center; border-radius: 16px; border: 2px solid var(--k-text-2); background: var(--k-panel-2); color: var(--k-text); font-size: 32px; font-weight: 700; white-space: nowrap; opacity: 0; }
      [data-composition-id="scene-04"] .n-row { height: 100%; display: flex; align-items: center; justify-content: center; gap: 22px; }
      [data-composition-id="scene-04"] .n-row .c { display: flex; align-items: center; height: 60px; padding: 0 22px; border-radius: 16px; background: var(--k-panel-2); border: 2px solid var(--k-line); font-size: 32px; font-weight: 700; white-space: nowrap; opacity: 0; }
      [data-composition-id="scene-04"] .n-row svg { flex: none; width: 52px; height: 52px; color: var(--k-text); opacity: 0; }
      [data-composition-id="scene-04"] .sc-arrow { position: absolute; }
      [data-composition-id="scene-04"] .sc-arrow svg { display: block; width: 100%; height: 100%; overflow: visible; }
    </style>
    <script>
      (function () {
        const S = Kit.scene("04"), t = S.t, DUR = 24.5;
        // Считаем только полностью проявленный неподвижный текст: переходы временем чтения не считаются.
        const read = (text, at, off, reveal = 0.6) => {
          const needed = text.trim().split(/\s+/).filter((word) => /[\p{L}\p{N}]/u.test(word)).length / 3 + 1;
          if (off - at - reveal < needed - 1e-6) throw new Error(`Недостаточно времени для «${text}»`);
        };
        if (DUR - S.end("людей.") < 1.5) throw new Error("Недостаточный хвост сцены");
        const tok = Kit.token, tl = S.tl, q = (el, c) => el.querySelector(c);
        const E_OUT = tok("--k-ease-out");
        const crisp = (el, at, x = 0, y = 14, d = 0.5) => tl.fromTo(el, { autoAlpha: 0, x, y }, { autoAlpha: 1, x: 0, y: 0, duration: d, ease: E_OUT, immediateRender: false }, at);
        const pop = (el, at, d = 0.6) => tl.fromTo(el, { autoAlpha: 0, scale: 0.88 }, { autoAlpha: 1, scale: 1, duration: d, ease: "back.out(2)", immediateRender: false }, at);
        const LOCK = '<svg viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="25" width="34" height="25" rx="5"/><path d="M18 25v-7a10 10 0 0 1 20 0v7"/></svg>';
        const NEQ = '<svg viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><path d="M10 21H46M10 35H46M38 8L18 48"/></svg>';
        const LINK = '<svg viewBox="0 0 70 30" fill="none"><path class="ar" pathLength="1" d="M4 15H66M54 5L66 15L54 25M16 5L4 15L16 25" stroke="' + tok("--k-text-2") + '" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

        Kit.header(S, { header: { mode: "parts", total: 7 }, chapter: "Код проверяет другая модель", step: 4, duration: DUR,
          parts: [{ n: 1, blank: true, at: 0 }] });

        const s1 = S.stage(); gsap.set(s1, { autoAlpha: 1 });

        /* ---- слева: окно новой задачи (до 2.0 с — заставка части) ---- */
        const win = Kit.aside(S, { parent: s1, x: 96, y: 225, w: 820, h: 330, tail: false,
          html: '<div class="w-hd"><span class="w-ttl">Новая задача</span><span class="w-lock">' + LOCK + 'только чтение</span></div>' +
                '<div class="w-hist"><i></i>нет истории реализации</div>' +
                '<div class="w-rc"><span class="w-chip a">сценарий</span>' + LINK + '<span class="w-chip b">тест или проверка</span></div>' });
        crisp(win.el, 2.0);
        const hist = q(win.el, ".w-hist");
        tl.fromTo(hist, { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: E_OUT, immediateRender: false }, 2.2);
        read("Новая задача нет истории реализации", 2.2, DUR);
        const lock = q(win.el, ".w-lock");
        pop(lock, t("только"), 0.6);
        read("только чтение", t("только") + 0.6, DUR, 0);
        // сверка: сценарий — тест или проверка (слева въезжает, справа выезжает, посередине рисуется связь)
        const ca = q(win.el, ".w-chip.a"), cb = q(win.el, ".w-chip.b"), lk = q(win.el, ".w-rc svg");
        gsap.set(q(lk, ".ar"), { strokeDasharray: 1, strokeDashoffset: 1 });
        tl.fromTo(ca, { autoAlpha: 0, x: -50 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: E_OUT, immediateRender: false }, t("каждый"));
        tl.set(lk, { opacity: 1 }, t("с тестом") - 0.1);
        tl.to(q(lk, ".ar"), { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, t("с тестом") - 0.1);
        tl.fromTo(cb, { autoAlpha: 0, x: 50 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: E_OUT, immediateRender: false }, t("тестом"));
        read("каждый сценарий тест или проверка", t("тестом") + 0.6, DUR, 0);

        /* ---- справа: исходная задача — в неё вернётся исправление ---- */
        const orig = Kit.aside(S, { parent: s1, x: 980, y: 225, w: 844, h: 130, tail: false,
          html: '<div class="o-row"><div><div class="ttl">Исходная задача</div><div class="sub">с историей реализации</div></div><span class="o-who">разработчик</span></div>' });
        crisp(orig.el, 2.35, 60, 0);
        read("Исходная задача с историей реализации", 2.35, DUR);
        const who = q(orig.el, ".o-who");

        /* ---- три вида находок — по одной на своём слове ---- */
        const FY = [385, 505, 625];
        const kinds = ["код без требования", "требование без кода", "отметка без доказательства"];
        const fcards = kinds.map((k, i) => Kit.aside(S, { parent: s1, x: 980, y: FY[i], w: 844, h: 104, tail: false,
          html: '<div class="f-row"><span class="tx">' + k + '</span><span class="f-loc">файл · строка</span></div>' }));
        crisp(fcards[0].el, t("код без требования,") - 0.05, 70, 0, 0.6);                                   // въезд справа
        tl.fromTo(fcards[1].el, { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: E_OUT, immediateRender: false }, t("требования без кода") - 0.05);   // снизу
        // pop: непрозрачность за 0,2 с (к концу слова «задачи» карточка уже полностью видна), масштаб — отдельно
        tl.fromTo(fcards[2].el, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2, immediateRender: false }, t("закрытые задачи") - 0.25);
        tl.fromTo(fcards[2].el, { scale: 0.9 }, { scale: 1, duration: 0.5, ease: "back.out(2)", immediateRender: false }, t("закрытые задачи") - 0.25);
        read("код без требования", t("код без требования,") + 0.6, DUR, 0);
        read("требование без кода", t("требования без кода") + 0.6, DUR, 0);
        read("отметка без доказательства", t("закрытые задачи") + 0.3, DUR, 0);
        const locs = fcards.map((c) => q(c.el, ".f-loc"));
        [t("файлом"), t("файлом") + 0.3, t("строкой")].forEach((at, i) => pop(locs[i], at, 0.5));
        read("файл строка", t("строкой") + 0.5, DUR, 0);

        /* ---- исправление возвращается в исходную задачу ---- */
        const AT = t("Исправляет");
        const arr = document.createElement("div");
        arr.className = "sc-arrow"; arr.setAttribute("data-layout-allow-overlap", "");
        arr.style.left = "934px"; arr.style.top = "268px"; arr.style.width = "52px"; arr.style.height = "420px";
        arr.innerHTML = '<svg viewBox="0 0 52 420" fill="none"><path class="ln" pathLength="1" d="M46 409H18V22H34" stroke="' + tok("--k-accent") + '" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:1 2;stroke-dashoffset:1"/>' +
                      '<path class="hd" d="M24 8L40 22L24 36" stroke="' + tok("--k-accent") + '" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"/></svg>';
        s1.appendChild(arr);
        gsap.set(arr, { autoAlpha: 0 });
        tl.set(arr, { autoAlpha: 1 }, AT);
        tl.to(q(arr, ".ln"), { strokeDashoffset: 0, duration: 1.1, ease: "power2.inOut" }, AT);
        tl.to(q(arr, ".hd"), { opacity: 1, duration: 0.25 }, AT + 1.0);
        pop(who, t("разработчик"), 0.55);
        tl.to(orig.el, { borderColor: tok("--k-accent"), duration: 0.5 }, AT + 1.0);
        read("разработчик", t("разработчик") + 0.55, DUR, 0);

        /* ---- модель не заменяет людей ---- */
        const note = Kit.aside(S, { parent: s1, x: 96, y: 595, w: 820, h: 100, tail: false,
          html: '<div class="n-row"><span class="c m">проверка модели</span>' + NEQ + '<span class="c p">проверка людей</span></div>' });
        const nm = q(note.el, ".c.m"), np = q(note.el, ".c.p"), nq = q(note.el, "svg");
        note.el.style.padding = "18px 20px";
        tl.set(note.el, { autoAlpha: 1 }, t("Эта") - 0.05);
        tl.fromTo(nm, { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: E_OUT, immediateRender: false }, t("Эта"));
        pop(nq, t("не заменяет"), 0.5);
        tl.fromTo(np, { autoAlpha: 0, x: 40 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: E_OUT, immediateRender: false }, t("проверку людей"));
        read("проверка модели проверка людей", t("проверку людей") + 0.6, DUR, 0);

        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
