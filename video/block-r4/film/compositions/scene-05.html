<template id="scene-05-template">
  <div data-composition-id="scene-05" data-width="1920" data-height="1080" data-duration="35.9">
    <style>
      [data-composition-id="scene-05"] .pm { height: 100%; display: flex; flex-direction: column; gap: 22px; }
      [data-composition-id="scene-05"] .pm-bar { display: flex; align-items: center; justify-content: space-between; height: 52px; font-size: 34px; font-weight: 800; letter-spacing: -0.01em; }
      [data-composition-id="scene-05"] .pm-bar .dots { display: flex; gap: 10px; }
      [data-composition-id="scene-05"] .pm-bar .dots i { width: 16px; height: 16px; border-radius: 50%; background: var(--k-win-dot); }
      [data-composition-id="scene-05"] .pm-blk { position: relative; border: 2px solid var(--k-line); border-radius: 16px; background: var(--k-win); padding: 14px 26px 16px; opacity: 0; }
      [data-composition-id="scene-05"] .pm-lab { display: flex; align-items: center; gap: 18px; font-size: 38px; font-weight: 800; letter-spacing: -0.015em; color: var(--k-accent-soft); line-height: 1.2; }
      [data-composition-id="scene-05"] .pm-lab .n { flex: none; min-width: 52px; height: 52px; padding: 0 12px; border-radius: 14px; display: grid; place-items: center; background: var(--k-accent-tint); border: 2px solid var(--k-accent); font-size: 32px; color: var(--k-accent-soft); }
      [data-composition-id="scene-05"] .pm-ans { margin: 10px 0 0 70px; font-size: 38px; font-weight: 600; line-height: 1.25; opacity: 0; display: flex; align-items: baseline; gap: 16px; }
      [data-composition-id="scene-05"] .pm-ans::before { content: "↳"; color: var(--k-ok); font-weight: 800; }
      [data-composition-id="scene-05"] .pm-q { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin: 8px 0 0 70px; min-height: 64px; }
      [data-composition-id="scene-05"] .pm-q .q { font-size: 38px; font-weight: 600; line-height: 1.2; opacity: 0; }
      [data-composition-id="scene-05"] .pm-q .a { flex: none; min-width: 230px; text-align: center; padding: 6px 22px; border-radius: 14px; font-size: 34px; font-weight: 700; background: var(--k-ok-tint); border: 2px solid var(--k-ok); color: var(--k-ok); opacity: 0; white-space: nowrap; }
      [data-composition-id="scene-05"] .pm-hd { position: absolute; right: 26px; top: 18px; font-size: 30px; font-weight: 600; color: var(--k-text-2); opacity: 0; }
      [data-composition-id="scene-05"] .cmp2 { height: 100%; display: flex; flex-direction: column; gap: 16px; }
      [data-composition-id="scene-05"] .cmp2 .lab { font-size: 44px; font-weight: 800; letter-spacing: -0.015em; }
      [data-composition-id="scene-05"] .cmp2.was .lab { color: var(--k-accent-soft); }
      [data-composition-id="scene-05"] .cmp2.now .lab { color: var(--k-ok); }
      [data-composition-id="scene-05"] .ex { position: relative; display: flex; align-items: center; gap: 22px; height: 104px; padding: 0 24px; border-radius: 16px; border: 2px solid var(--k-line); background: var(--k-win); font-family: var(--k-font-mono); font-size: 44px; font-weight: 700; opacity: 0; }
      [data-composition-id="scene-05"] .ex .no { flex: none; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-family: var(--k-font-sans); font-size: 32px; font-weight: 700; background: var(--k-accent-tint); color: var(--k-accent-soft); }
      [data-composition-id="scene-05"] .ex .tx { transition: none; }
      [data-composition-id="scene-05"] .ex .strike { position: absolute; left: 96px; right: 24px; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; background: var(--k-accent); transform-origin: 0 50%; transform: scaleX(0); }
      [data-composition-id="scene-05"] .rp { margin-top: auto; font-size: 36px; font-weight: 700; color: var(--k-accent-soft); opacity: 0; }
      [data-composition-id="scene-05"] .inp { display: flex; gap: 16px; }
      [data-composition-id="scene-05"] .inp .ch { padding: 10px 24px; border-radius: 14px; border: 2px solid var(--k-info); background: var(--k-win); font-family: var(--k-font-mono); font-size: 46px; font-weight: 700; opacity: 0; white-space: nowrap; }
      [data-composition-id="scene-05"] .res { display: flex; flex-direction: column; gap: 12px; }
      [data-composition-id="scene-05"] .res .r { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; height: 84px; padding: 0 24px; align-items: center; border-radius: 16px; background: var(--k-ok-tint); border: 2px solid var(--k-ok); font-size: 40px; font-weight: 600; opacity: 0; }
      [data-composition-id="scene-05"] .res .r b { font-family: var(--k-font-mono); font-size: 48px; font-weight: 700; color: var(--k-ok); white-space: nowrap; }
      [data-composition-id="scene-05"] .arrow { position: absolute; width: 90px; height: 50px; opacity: 0; }
      [data-composition-id="scene-05"] .gate { height: 100%; display: flex; align-items: center; gap: 24px; font-size: 44px; font-weight: 800; letter-spacing: -0.015em; white-space: nowrap; }
      [data-composition-id="scene-05"] .gate svg { flex: none; width: 56px; height: 56px; }
    </style>
    <script>
      (function () {
        const S = Kit.scene("05"), t = S.t, DUR = 35.9;
        // Count only fully revealed, stationary text; transitions do not count as reading time.
        const read = (text, at, off, reveal = 0.5) => {
          const needed = text.trim().split(/\s+/).filter((word) => /[\p{L}\p{N}]/u.test(word)).length / 3 + 1;
          if (off - at - reveal < needed - 1e-6) throw new Error(`Недостаточно времени для «${text}»: ${(off - at - reveal).toFixed(2)} < ${needed.toFixed(2)}`);
        };
        if (DUR - S.speechEnd < 1.5) throw new Error("Недостаточный хвост сцены");
        const rev = (el, at, d = 0.45) => { gsap.set(el, { y: 14 }); S.tl.to(el, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, at); };

        Kit.header(S, { header: { mode: "parts", total: 8 }, chapter: "Вопросы модели", step: 5, duration: DUR,
          parts: [{ n: 1, blank: true, at: 0 }] });

        /* ---- План 1: панель модели, две реплики ---- */
        const T_OUT1 = t("Два ожидания") + 0.25;   // план 1 держим, чтобы третий вопрос успели прочитать
        const T_IN2 = T_OUT1 + 0.5;
        const s1 = S.stage(); gsap.set(s1, { autoAlpha: 1 });
        const panel = Kit.aside(S, { parent: s1, x: 96, y: 210, w: 1728, h: 600, tail: false,
          html: '<div class="pm">' +
            '<div class="pm-bar"><span>Панель модели</span><span class="dots"><i></i><i></i><i></i></span></div>' +
            '<div class="pm-blk b1"><div class="pm-lab"><span class="n">1</span><span>Сверка по файлам, без правок</span></div>' +
              '<div class="pm-ans">Ожидания ниже нового минимума: два — для 101 ₽</div></div>' +
            '<div class="pm-blk b2"><span class="pm-hd">ответ человека</span><div class="pm-lab"><span class="n">2</span><span>Вопросы</span></div>' +
              '<div class="pm-q"><span class="q">Границы входят?</span><span class="a">включены</span></div>' +
              '<div class="pm-q"><span class="q">Дробные суммы допустимы?</span><span class="a">допустимы</span></div>' +
              '<div class="pm-q"><span class="q">Ошибка очищает платёж, общую сумму и переплату?</span><span class="a">очищает</span></div></div>' +
          "</div>" });
        panel.show(t("попросите") - 0.2);
        const q = (sel) => panel.el.querySelector(sel);
        const b1 = q(".b1"), b2 = q(".b2");
        const T_B1 = t("сверить"), T_ANS = t("какие ожидания"), T_B2 = t("Потом");
        rev(b1, T_B1 - 0.1);
        rev(b1.querySelector(".pm-ans"), T_ANS);
        rev(b2, T_B2 - 0.1);
        S.tl.to(b2.querySelector(".pm-hd"), { opacity: 1, duration: 0.4 }, t("Границы") - 0.2);
        const qs = b2.querySelectorAll(".pm-q");
        const T_Q = [t("Границы"), t("Дробные"), t("Ошибка очищает")];
        const T_A = [S.end("входят?") + 0.3, S.end("допустимы?") + 0.3, t("общую") + 0.1];
        qs.forEach((row, i) => { rev(row.querySelector(".q"), T_Q[i]); S.tl.to(row.querySelector(".a"), { opacity: 1, duration: 0.4 }, T_A[i]); });
        // читаемость: вопросы и ответы человека видны до ухода плана
        read("Ошибка очищает платёж, общую сумму и переплату", T_Q[2], T_OUT1);
        read("Ожидания ниже нового минимума: два — для 101 ₽", T_ANS, T_OUT1);
        read("включены", T_A[0], T_OUT1); read("допустимы", T_A[1], T_OUT1); read("очищает", T_A[2], T_OUT1);

        /* ---- План 2: проблема -> цель ---- */
        const s2 = S.stage();
        const W = Kit.aside(S, { parent: s2, x: 96, y: 208, w: 650, h: 490, tail: false,
          html: '<div class="cmp2 was"><div class="lab">Проблема</div>' +
            '<div class="ex e1"><span class="no" data-layout-allow-occlusion>1</span><span class="tx" data-layout-allow-occlusion>101 ₽ → успех</span><i class="strike" data-layout-allow-occlusion></i></div>' +
            '<div class="ex e2"><span class="no" data-layout-allow-occlusion>2</span><span class="tx" data-layout-allow-occlusion>101 ₽ → успех</span><i class="strike" data-layout-allow-occlusion></i></div><div class="rp">оба заменяются новыми</div></div>' });
        W.el.style.borderColor = Kit.token("--k-accent");
        const N = Kit.aside(S, { parent: s2, x: 870, y: 208, w: 954, h: 490, tail: false,
          html: '<div class="cmp2 now"><div class="lab">Цель</div>' +
            '<div class="inp"><span class="ch c1">10 001 ₽</span><span class="ch c2">0%</span><span class="ch c3">2 месяца</span></div>' +
            '<div class="res"><div class="r r1"><span>платёж (последний округлён)</span><b>5 001 ₽</b></div><div class="r r2"><span>общая сумма</span><b>10 001 ₽</b></div><div class="r r3"><span>переплата</span><b>0 ₽</b></div></div></div>' });
        N.el.style.borderColor = Kit.token("--k-ok");
        const arr = document.createElement("div");
        arr.className = "arrow"; arr.style.left = "764px"; arr.style.top = "450px";
        arr.innerHTML = '<svg viewBox="0 0 56 30" width="90" height="50" fill="none"><path d="M3 15H49M39 5L50 15L39 25" stroke="' + Kit.token("--k-accent") + '" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        s2.appendChild(arr);

        const T_W = T_IN2 + 0.2;
        W.show(T_W);
        const wq = (sel) => W.el.querySelector(sel), nq = (sel) => N.el.querySelector(sel);
        rev(wq(".e1"), t("ста одного") - 0.2); rev(wq(".e2"), t("ста одного") + 0.4);
        const T_REP = t("заменяются");
        S.tl.to(arr, { opacity: 1, duration: 0.4 }, T_REP);
        ["e1", "e2"].forEach((c, i) => {
          S.tl.to(wq("." + c + " .strike"), { scaleX: 1, duration: 0.4, ease: "power2.out" }, T_REP + 0.1 + i * 0.25);
          S.tl.to(wq("." + c + " .tx"), { opacity: 0.45, duration: 0.4 }, T_REP + 0.1 + i * 0.25);
        });
        rev(wq(".rp"), T_REP + 0.5);
        N.show(t("новыми:") - 0.1);
        rev(nq(".c1"), t("десять тысяч один рубль")); rev(nq(".c2"), t("ноль процентов")); rev(nq(".c3"), t("два месяца"));
        rev(nq(".r1"), t("платёж пять")); rev(nq(".r2"), t("общая сумма")); rev(nq(".r3"), t("переплата ноль"));
        read("переплата 0 ₽", t("переплата ноль"), DUR); read("общая сумма 10 001 ₽", t("общая сумма"), DUR);

        /* ---- Подтверждение человеком ---- */
        const gate = Kit.aside(S, { parent: s2, x: 96, y: 714, w: 1728, h: 100, tail: false,
          html: '<div class="gate"><svg viewBox="0 0 24 24" fill="none" stroke="' + Kit.token("--k-ok") + '" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-7"/></svg><span>Решение — только после вашего подтверждения</span></div>' });
        gate.el.style.borderColor = Kit.token("--k-accent");
        const T_GATE = t("Решение");
        gate.show(T_GATE);
        read("Решение — только после вашего подтверждения", T_GATE, DUR);

        Kit.stageOut(S, s1, T_OUT1); Kit.stageIn(S, s2, T_IN2);
        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
