<template id="scene-05-template">
  <div data-hf-id="hf-jfn9" data-composition-id="scene-05" data-width="1920" data-height="1080" data-duration="26.6">
    <style>
      [data-composition-id="scene-05"] .pr-title { position: absolute; left: 96px; width: 1728px; top: 206px; font-size: 54px; font-weight: 700; color: var(--k-accent); }
      [data-composition-id="scene-05"] .pr-sub { position: absolute; left: 96px; width: 1728px; font-size: 40px; font-weight: 700; color: var(--k-accent-soft); }
      [data-composition-id="scene-05"] .pr-row { position: absolute; left: 96px; width: 1728px; display: grid; align-items: stretch; gap: 24px; }
      [data-composition-id="scene-05"] .pr-col { display: grid; gap: 14px; justify-items: stretch; align-content: start; }
      [data-composition-id="scene-05"] .pr-col > .k-aside, [data-composition-id="scene-05"] .pr-row > .k-aside { position: relative; }
      [data-composition-id="scene-05"] .pr-t { font-size: 44px; font-weight: 700; line-height: 1.15; }
      [data-composition-id="scene-05"] .pr-t span { color: var(--k-accent-soft); }
      [data-composition-id="scene-05"] .pr-c { font-size: 30px; line-height: 1.25; color: var(--k-text-2); margin-top: 8px; text-wrap: balance; }
      [data-composition-id="scene-05"] .pr-arr { align-self: center; text-align: center; font-size: 56px; font-weight: 300; color: var(--k-text-2); line-height: 1; }
      [data-composition-id="scene-05"] .pr-chips { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
      [data-composition-id="scene-05"] .pr-chip { padding: 8px 16px; border: 2px solid var(--k-line); border-radius: 14px; background: var(--k-panel-2); font-size: 30px; font-weight: 600; line-height: 1.2; white-space: nowrap; }
      [data-composition-id="scene-05"] .pr-ok { border-color: var(--k-ok); background: var(--k-ok-tint); }
      [data-composition-id="scene-05"] .pr-tag { position: absolute; left: 96px; top: 222px; }
      [data-composition-id="scene-05"] .pr-tree { font-family: var(--k-mono, ui-monospace, Menlo, monospace); font-size: 40px; line-height: 1.5; }
      [data-composition-id="scene-05"] .pr-tree div { white-space: pre; }
      [data-composition-id="scene-05"] .pr-tree .d { color: var(--k-text-2); }
      [data-composition-id="scene-05"] .sc-item { height: 100%; display: flex; align-items: center; gap: 28px; font-size: 44px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.15; }
      [data-composition-id="scene-05"] .sc-ok { flex: none; width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; color: var(--k-ok); border: 3px solid var(--k-ok); background: var(--k-ok-tint); }
      [data-composition-id="scene-05"] .sc-ok svg { width: 44px; height: 44px; opacity: 0; }
      [data-composition-id="scene-05"] .sc-next { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 32px; }
      [data-composition-id="scene-05"] .sc-next .lab { font-size: 36px; font-weight: 700; color: var(--k-accent-soft); white-space: nowrap; }
      [data-composition-id="scene-05"] .sc-next .nm { font-size: 58px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
      [data-composition-id="scene-05"] .sc-next svg { flex: none; width: 76px; height: 41px; }
    </style>
    <script>
      (function () {
        const S = Kit.scene("05"), t = S.t, DUR = 26.6;
        // Count only fully revealed, stationary text; transitions do not count as reading time.
        const read = (text, at, off, reveal = 0.6) => {
          const needed = text.trim().split(/\s+/).filter((word) => /[\p{L}\p{N}]/u.test(word)).length / 3 + 1;
          if (off - at - reveal < needed - 1e-6) throw new Error(`Недостаточно времени для «${text}»: ${(off - at - reveal).toFixed(1)} с, нужно ${needed.toFixed(1)}`);
        };
        if (DUR - S.speechEnd < 1.5) throw new Error("Недостаточный хвост сцены");
        const hide = (...els) => els.forEach((el) => gsap.set(el, { autoAlpha: 0 }));
        const div = (cls, html, parent) => { const el = document.createElement("div"); el.className = cls; el.innerHTML = html; parent.appendChild(el); return el; };
        const col = (p) => div("pr-col", "", p);
        const row = (p, top, cols) => { const r = div("pr-row", "", p); r.style.top = top + "px"; r.style.gridTemplateColumns = cols; return r; };
        const tile = (p, at, ttl, sub, off, cls) => {
          const a = Kit.aside(S, { parent: p, tail: false, html: '<div class="pr-t">' + ttl + "</div>" + (sub ? '<div class="pr-c">' + sub + "</div>" : "") });
          if (cls) a.el.classList.add(cls);
          a.show(at); read(ttl.replace(/<[^>]+>/g, "") + " " + (sub || ""), at, off);
          return a;
        };
        const arrow = (p, at, ch = "→") => { const a = div("pr-arr", ch, p); hide(a); Kit.popIn(S, a, at); return a; };
        const line = (cls, text, p, at, off) => { const e = div(cls, text, p); hide(e); Kit.popIn(S, e, at); read(text, at, off); return e; };

        Kit.header(S, { header: { mode: "parts", total: 5 }, chapter: "Контракт и запросы изменения", step: 5, duration: DUR, parts: [{ n: 1, blank: true, at: 0 }] });


        const s1 = S.stage(); gsap.set(s1, { autoAlpha: 1 });
        // Заставка t5 закрывает первые 2 с: всё, что звучит раньше, появляется сразу после неё.
        const AT = (w, n) => Math.max(2.1, t(w, n));
        const card = Kit.aside(S, { parent: s1, x: 96, y: 225, w: 1728, tail: false, html: '<div class="pr-t">Контракт задачи</div><div class="pr-chips" id="chips"></div>' });
        card.show(2.1);
        const chips = card.el.querySelector("#chips");
        [["Продукт", "продукт"], ["Запрос", "запрос"], ["Store и коммит требований", "store"], ["SHA каждого репозитория", "исходные коммиты"], ["Ветка", "ветку"], ["Приёмка", "приёмку"]].forEach(([txt, w], i) => {
          const c = div("pr-chip", txt, chips); hide(c); Kit.popIn(S, c, AT(w) + i * 0.05);
        });
        read("Контракт задачи Продукт Запрос Store и коммит требований SHA каждого репозитория Ветка Приёмка", 2.1, DUR);
        // Пустое обязательное поле останавливает подготовку.
        const empty = div("pr-sub", "Пустое поле — работа не подготовлена", s1);
        empty.style.top = "400px"; hide(empty);
        Kit.popIn(S, empty, t("Пустое обязательное"));
        read("Пустое поле — работа не подготовлена", t("Пустое обязательное"), t("Требования принимают"));
        S.tl.to(empty, { autoAlpha: 0, duration: 0.25 }, t("Требования принимают") - 0.05);
        // Три этапа: требования до кода; код и отдельный запрос статусов; архив после обоих слияний.
        const mr = row(s1, 470, "1fr 64px 1.25fr 64px 1fr");
        tile(mr, t("Требования принимают"), "Store: требования", "принимают до кода", DUR);
        arrow(mr, t("Код —") - 0.3);
        const impl = Kit.aside(S, { parent: mr, tail: false, html: '<div class="pr-t">Реализация</div><div class="pr-c" id="im1">web · api: MR кода</div><div class="pr-c" id="im2">Store: MR статусов tasks.md</div>' });
        impl.show(t("Код —"));
        const im1 = impl.el.querySelector("#im1"), im2 = impl.el.querySelector("#im2");
        hide(im1, im2); Kit.popIn(S, im1, t("Код —") + 0.25); Kit.popIn(S, im2, t("статусы задач"));
        read("Реализация web api MR кода", t("Код —"), DUR);
        read("Store MR статусов tasks.md", t("статусы задач"), DUR);
        arrow(mr, t("Архив —") - 0.3);
        tile(mr, t("Архив —"), "Store: архив", "после слияния кода и статусов", DUR);
        const rel = row(s1, 710, "1fr");
        tile(rel, t("Выпуск"), "Выпуск по каждому сервису", "подтверждаем отдельно", DUR, "pr-ok");


        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
