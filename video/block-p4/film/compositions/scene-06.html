<template id="scene-06-template">
  <div data-hf-id="hf-8lyj" data-composition-id="scene-06" data-width="1920" data-height="1080" data-duration="13.9">
    <style>
      [data-composition-id="scene-06"] .pr-title { position: absolute; left: 96px; width: 1728px; top: 206px; font-size: 54px; font-weight: 700; color: var(--k-accent); }
      [data-composition-id="scene-06"] .pr-sub { position: absolute; left: 96px; width: 1728px; font-size: 40px; font-weight: 700; color: var(--k-accent-soft); }
      [data-composition-id="scene-06"] .pr-row { position: absolute; left: 96px; width: 1728px; display: grid; align-items: stretch; gap: 24px; }
      [data-composition-id="scene-06"] .pr-col { display: grid; gap: 14px; justify-items: stretch; align-content: start; }
      [data-composition-id="scene-06"] .pr-col > .k-aside, [data-composition-id="scene-06"] .pr-row > .k-aside { position: relative; }
      [data-composition-id="scene-06"] .pr-t { font-size: 44px; font-weight: 700; line-height: 1.15; }
      [data-composition-id="scene-06"] .pr-t span { color: var(--k-accent-soft); }
      [data-composition-id="scene-06"] .pr-c { font-size: 30px; line-height: 1.25; color: var(--k-text-2); margin-top: 8px; }
      [data-composition-id="scene-06"] .pr-arr { align-self: center; text-align: center; font-size: 56px; font-weight: 300; color: var(--k-text-2); line-height: 1; }
      [data-composition-id="scene-06"] .pr-chips { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
      [data-composition-id="scene-06"] .pr-chip { padding: 8px 16px; border: 2px solid var(--k-line); border-radius: 14px; background: var(--k-panel-2); font-size: 30px; font-weight: 600; line-height: 1.2; white-space: nowrap; }

      [data-composition-id="scene-06"] .pr-tag { position: absolute; left: 96px; top: 222px; }
      [data-composition-id="scene-06"] .pr-tree { font-family: var(--k-mono, ui-monospace, Menlo, monospace); font-size: 40px; line-height: 1.5; }
      [data-composition-id="scene-06"] .pr-tree div { white-space: pre; }
      [data-composition-id="scene-06"] .pr-tree .d { color: var(--k-text-2); }
      [data-composition-id="scene-06"] .sc-item { height: 100%; display: flex; align-items: center; gap: 26px; font-size: 42px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.15; }
      [data-composition-id="scene-06"] .sc-ok { flex: none; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; color: var(--k-ok); border: 3px solid var(--k-ok); background: var(--k-ok-tint); }
      [data-composition-id="scene-06"] .sc-ok svg { width: 40px; height: 40px; opacity: 0; }
      [data-composition-id="scene-06"] .sc-next { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 32px; }
      [data-composition-id="scene-06"] .sc-next .lab { font-size: 36px; font-weight: 700; color: var(--k-accent-soft); white-space: nowrap; }
      [data-composition-id="scene-06"] .sc-next .nm { font-size: 58px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
      [data-composition-id="scene-06"] .sc-next svg { flex: none; width: 76px; height: 41px; }
    </style>
    <script>
      (function () {
        const S = Kit.scene("06"), t = S.t, DUR = 13.9;
        // Count only fully revealed, stationary text; transitions do not count as reading time.
        const read = (text, at, off, reveal = 0.6) => {
          const needed = text.trim().split(/\s+/).filter((word) => /[\p{L}\p{N}]/u.test(word)).length / 3 + 1;
          if (off - at - reveal < needed - 1e-6) throw new Error(`Недостаточно времени для «${text}»: ${(off - at - reveal).toFixed(1)} с, нужно ${needed.toFixed(1)}`);
        };
        if (DUR - S.speechEnd < 1.5) throw new Error("Недостаточный хвост сцены");
        const hide = (...els) => els.forEach((el) => gsap.set(el, { autoAlpha: 0 }));
        const div = (cls, html, parent) => { const el = document.createElement("div"); el.className = cls; el.innerHTML = html; parent.appendChild(el); return el; };
        const col = (p) => div("pr-col", "", p);
        const row = (p, top, cols) => { const r = div("pr-row", "", p); r.style.top = top + "px"; r.style.gridTemplateColumns = cols; return r; };
        const tile = (p, at, ttl, sub, off, cls) => {
          const a = Kit.aside(S, { parent: p, tail: false, html: '<div class="pr-t">' + ttl + "</div>" + (sub ? '<div class="pr-c">' + sub + "</div>" : "") });
          if (cls) a.el.classList.add(cls);
          a.show(at); read(ttl.replace(/<[^>]+>/g, "") + " " + (sub || ""), at, off);
          return a;
        };
        const arrow = (p, at, ch = "→") => { const a = div("pr-arr", ch, p); hide(a); Kit.popIn(S, a, at); return a; };
        const line = (cls, text, p, at, off) => { const e = div(cls, text, p); hide(e); Kit.popIn(S, e, at); read(text, at, off); return e; };

        Kit.header(S, { header: { mode: "parts", total: 5 }, chapter: "Что дальше", step: null, duration: DUR, parts: [{ n: 1, blank: true, at: 0 }] });


        const s1 = S.stage(); gsap.set(s1, { autoAlpha: 1 });
        // Ревью W3b P3-5: четыре пункта, как в речи (вход, требования, store, версия кода).
        [["Знаете, где вход в задачу", "вход"], ["Знаете, откуда брать требования", "откуда брать"], ["Подключаете store", "подключить"], ["Закрепляете SHA каждого сервиса", "закрепить"]].forEach(([txt, w], i) => {
          const at = i === 0 ? 0.3 : t(w) - 0.2;
          const r = Kit.aside(S, { parent: s1, x: 96, y: 222 + i * 104, w: 1100, h: 92, tail: false,
            html: '<div class="sc-item"><span class="sc-ok">' + Kit.icons.check + "</span><span>" + txt + "</span></div>" });
          r.show(at); S.tl.to(r.el.querySelector(".sc-ok svg"), { opacity: 1, duration: 0.3 }, t(w) + 0.4);
          read(txt, at, DUR);
        });
        Kit.sketch(S, { parent: s1, name: "merge", x: 1260, y: 205, w: 560, at: 0.5, dur: 2.6 });
        const T_NEXT = t("Дальше");
        const next = Kit.aside(S, { parent: s1, x: 96, y: 655, w: 1728, h: 160, tail: false,
          html: '<div class="sc-next"><div><div class="lab">Дальше</div><div class="nm">Требования в Git</div></div>' +
                '<svg viewBox="0 0 56 30" fill="none"><path d="M3 15H49M39 5L50 15L39 25" stroke="' + Kit.token("--k-accent") + '" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' });
        next.el.style.borderColor = Kit.token("--k-accent");
        next.show(T_NEXT);
        read("Дальше Требования в Git", T_NEXT, DUR);

        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
