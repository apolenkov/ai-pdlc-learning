<template id="scene-03-template">
  <div data-composition-id="scene-03" data-width="1920" data-height="1080" data-duration="20.1">
    <style>
      [data-composition-id="scene-03"] .br-row { position: absolute; left: 96px; width: 1728px; display: grid; grid-template-columns: 520px 1fr 460px 1fr 508px; align-items: stretch; }
      [data-composition-id="scene-03"] .br-row > .k-aside { position: relative; left: 0; top: 0; }
      [data-composition-id="scene-03"] .br-nodes { top: 214px; }
      [data-composition-id="scene-03"] .br-notes { top: 500px; }
      [data-composition-id="scene-03"] .br-t { font-size: 40px; font-weight: 700; line-height: 1.15; }
      [data-composition-id="scene-03"] .br-sub { font-size: 32px; line-height: 1.25; color: var(--k-text-2); margin-top: 8px; }
      [data-composition-id="scene-03"] .br-mono { display: inline-block; margin-top: 12px; font-family: var(--k-font-mono); font-size: 30px; font-weight: 500; line-height: 1.3; padding: 6px 14px; border-radius: 10px; background: var(--k-accent-tint); }
      [data-composition-id="scene-03"] .br-arr { align-self: center; text-align: center; font-size: 64px; font-weight: 300; color: var(--k-text-2); line-height: 1; }
      [data-composition-id="scene-03"] .br-note { font-size: 36px; font-weight: 700; line-height: 1.25; }
      [data-composition-id="scene-03"] .br-note small { display: block; font-size: 30px; font-weight: 500; color: var(--k-text-2); margin-top: 6px; }
      [data-composition-id="scene-03"] .br-lock { display: flex; align-items: center; gap: 14px; border-color: var(--k-accent); background: var(--k-accent-tint); }
      [data-composition-id="scene-03"] .br-lock svg { width: 52px; height: 52px; flex-shrink: 0; color: var(--k-accent-soft); }
      [data-composition-id="scene-03"] .br-guide { border-color: var(--k-info); }
      [data-composition-id="scene-03"] .br-mine { border-color: var(--k-ok); background: var(--k-ok-tint); }
      [data-composition-id="scene-03"] .br-next { position: absolute; left: 96px; top: 740px; width: 1728px; box-sizing: border-box; height: 96px; padding: 0 34px; display: flex; align-items: center; gap: 28px; border-color: var(--k-ok); background: var(--k-ok-tint); }
      [data-composition-id="scene-03"] .br-next .lab { font-size: 34px; font-weight: 700; color: var(--k-ok); }
      [data-composition-id="scene-03"] .br-next .txt { font-size: 46px; font-weight: 700; line-height: 1.1; }
    </style>
    <script>
      (function () {
        const S = Kit.scene("03"), t = S.t, DUR = 20.1;
        // Count only fully revealed, stationary text; transitions do not count as reading time.
        const read = (text, at, off, reveal = 0.6) => {
          const needed = text.trim().split(/\s+/).filter((word) => /[\p{L}\p{N}]/u.test(word)).length / 3 + 1;
          if (off - at - reveal < needed - 1e-6) throw new Error(`Недостаточно времени для «${text}»`);
        };
        if (DUR - S.speechEnd < 1.5) throw new Error("Недостаточный хвост сцены");
        const hide = (...els) => els.forEach((el) => gsap.set(el, { autoAlpha: 0 }));
        const div = (cls, html, parent) => { const el = document.createElement("div"); el.className = cls; el.innerHTML = html; parent.appendChild(el); return el; };
        const INFO = Kit.token("--k-info"), LINE = Kit.token("--k-line"), OK = Kit.token("--k-ok");
        const LOCK = '<svg viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="25" width="36" height="25" rx="5"/><path d="M18 25v-7a10 10 0 0 1 20 0v7"/><path d="M28 36v6"/></svg>';

        Kit.header(S, { header: { mode: "parts", total: 7 }, chapter: "Своя ветка", step: 3, duration: DUR, parts: [{ n: 1, blank: true, at: 0 }] });

        const s1 = S.stage(); gsap.set(s1, { autoAlpha: 1 });

        /* Three nodes are on screen from the first frame; the arrows are drawn as the narrator names the copy and the branch. */
        const nodes = div("br-row br-nodes", "", s1);
        const mk = (title, sub, mono) => {
          const n = Kit.aside(S, { parent: nodes, tail: false, html: `<div class="br-t">${title}</div><div class="br-sub">${sub}</div>${mono ? `<span class="br-mono">${mono}</span>` : ""}` });
          n.show(2.1); // the part title overlay covers the first 2 s
          return n.el;
        };
        const n1 = mk("Учебный репозиторий", "общий, для всех", "main");
        const a1 = div("br-arr", "→", nodes);
        const n2 = mk("Ваша копия", "форк — только ваш", "");
        const a2 = div("br-arr", "→", nodes);
        const n3 = mk("Личная ветка", "в вашей копии", "course/…/<br>stage-1-error-result");
        hide(a1, a2);
        const T_COPY = t("своей копии"), T_BR = t("личной");
        Kit.popIn(S, a1, Math.max(T_COPY, 2.1)); Kit.popIn(S, a2, Math.max(T_BR, 2.1));
        const hl = (el, on, off, col) => {
          S.tl.to(el, { borderColor: col || INFO, duration: 0.3 }, on);
          S.tl.to(el, { borderColor: LINE, duration: 0.3 }, off);
        };
        hl(n2, T_COPY, T_BR - 0.1);
        hl(n3, T_BR, t("общую") - 0.1);
        hl(n1, t("общую"), t("Как сделать") - 0.1, Kit.token("--k-accent"));

        /* Notes under the nodes. */
        const notes = div("br-row br-notes", "", s1);
        const note = (html, cls) => { const n = Kit.aside(S, { parent: notes, tail: false, html }); n.el.classList.add(cls); return n; };
        const noMain = note(`${LOCK}<div class="br-note">main не меняем</div>`, "br-lock");
        const guide = note('<div class="br-note">как сделать копию<small>Markdown, Git, GitLab</small></div>', "br-guide");
        const mine = note('<div class="br-note">всё, что вы напишете<small>лежит в вашей ветке</small></div>', "br-mine");
        // Grid columns keep each note under its node.
        noMain.el.style.gridColumn = "1"; guide.el.style.gridColumn = "3"; mine.el.style.gridColumn = "5";
        noMain.show(t("общую")); read("main не меняем", t("общую"), DUR);
        guide.show(t("Как сделать")); read("как сделать копию Markdown, Git, GitLab", t("Как сделать"), DUR);
        mine.show(t("всё, что")); read("всё, что вы напишете лежит в вашей ветке", t("всё, что"), DUR);

        /* The way on. */
        const next = Kit.aside(S, { parent: s1, x: 96, y: 722, w: 1728, tail: false, html: '<div class="lab">Дальше</div><div class="txt">от этой ветки начнётся «Проверяем и согласуем требования»</div>' });
        next.el.className += " br-next";
        next.show(t("от неё")); read("Дальше от этой ветки начнётся «Проверяем и согласуем требования»", t("от неё"), DUR);

        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
