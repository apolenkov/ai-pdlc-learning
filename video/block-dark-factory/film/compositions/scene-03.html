<template id="scene-03-template">
  <div data-composition-id="scene-03" data-width="1920" data-height="1080" data-duration="17.5">
    <style>
      [data-composition-id="scene-03"] .star { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--k-info); }
      [data-composition-id="scene-03"] .planet { position: absolute; width: 200px; height: 200px; border-radius: 50%; background: var(--k-panel-2); border: 3px solid var(--k-accent); box-shadow: 0 0 0 14px var(--k-glow); display: grid; place-items: center; align-content: center; gap: 4px; }
      [data-composition-id="scene-03"] .planet svg { width: 64px; height: 64px; }
      [data-composition-id="scene-03"] .planet b { font-size: 30px; font-weight: 700; }
      [data-composition-id="scene-03"] .arm { position: absolute; width: 0; height: 0; }
      [data-composition-id="scene-03"] .sat { position: absolute; width: 68px; height: 68px; margin: -34px 0 0 -34px; border-radius: 50%; background: var(--k-panel); border: 3px solid; display: grid; place-items: center; }
      [data-composition-id="scene-03"] .sat svg { width: 38px; height: 38px; }
      [data-composition-id="scene-03"] .lb { font-size: 30px; font-weight: 700; color: var(--k-accent-soft); }
      [data-composition-id="scene-03"] .lb.night { color: var(--k-info); }
      [data-composition-id="scene-03"] .tx { font-size: 34px; font-weight: 700; line-height: 1.2; margin-top: 4px; }
      [data-composition-id="scene-03"] .fh { display: flex; align-items: center; gap: 16px; font-size: 38px; font-weight: 800; }
      [data-composition-id="scene-03"] .fr { display: flex; align-items: center; gap: 16px; margin-top: 12px; padding: 8px 16px; border-radius: 14px; background: var(--k-panel-2); font-size: 30px; font-weight: 600; white-space: normal; }
      [data-composition-id="scene-03"] .fh svg, [data-composition-id="scene-03"] .fr svg { width: 40px; height: 40px; flex: none; }
      [data-composition-id="scene-03"] .fr b { font-weight: 800; }
    </style>
    <script>
      (function () {
        const S = Kit.scene("03"), t = S.t, DUR = 17.5;
        // Count only fully revealed, stationary text; transitions do not count as reading time.
        const read = (text, at, off, reveal = 0.6) => {
          const needed = text.trim().split(/\s+/).filter((word) => /[\p{L}\p{N}]/u.test(word)).length / 3 + 1;
          if (off - at - reveal < needed - 1e-6) throw new Error(`Недостаточно времени для «${text}»: ${(off - at - reveal).toFixed(1)} с, нужно ${needed.toFixed(1)}`);
        };
        if (DUR - S.speechEnd < 1.5) throw new Error("Недостаточный хвост сцены");
        const hide = (...els) => els.forEach((el) => gsap.set(el, { autoAlpha: 0 }));
        const div = (cls, html, parent) => { const el = document.createElement("div"); el.className = cls; el.innerHTML = html; parent.appendChild(el); return el; };
        const NS = "http://www.w3.org/2000/svg";
        const add = (svg, tag, attrs) => { const e = document.createElementNS(NS, tag); Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v)); svg.appendChild(e); return e; };
        const C = (n) => Kit.token("--k-" + n);
        const ic = (inner, col) => '<svg viewBox="0 0 56 56" fill="none" stroke="' + C(col) + '" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">' + inner + "</svg>";
        const TASK = '<rect x="10" y="8" width="36" height="42" rx="5"/><path d="M19 29l7 7 12-14"/>';
        const MERGE = '<circle cx="16" cy="12" r="5"/><circle cx="16" cy="44" r="5"/><circle cx="42" cy="32" r="5"/><path d="M16 17v22M16 17c0 14 26 4 26 10"/>';
        const SPEC = '<path d="M12 8h22l10 10v30H12z"/><path d="M33 8v11h11M19 30h18M19 38h12"/>';

        Kit.header(S, { duration: DUR, parts: [{ n: 1, blank: true, at: 0 }] });

        const s1 = S.stage(); gsap.set(s1, { autoAlpha: 1 });
        // звёзды: детерминированные позиции, мерцание через таймлайн
        let seed = 7;
        const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
        for (let i = 0; i < 46; i += 1) {
          const st = div("star", "", s1);
          st.style.left = 110 + rnd() * 720 + "px"; st.style.top = 210 + rnd() * 620 + "px";
          gsap.set(st, { opacity: 0.25 + rnd() * 0.35 });
          S.tl.to(st, { opacity: 0.85, duration: 0.8 + rnd(), yoyo: true, repeat: 5, ease: "sine.inOut" }, rnd() * 3);
        }

        const PX = 480, PY = 520, R = 230;
        const orbit = document.createElementNS(NS, "svg");
        orbit.setAttribute("style", "position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible");
        s1.appendChild(orbit);
        const ring = add(orbit, "circle", { cx: PX, cy: PY, r: R, fill: "none", stroke: C("line"), "stroke-width": 4, "stroke-dasharray": "10 12" });
        gsap.set(ring, { opacity: 0 });
        S.tl.to(ring, { opacity: 1, duration: 0.8 }, 0.6);

        const folder = '<svg viewBox="0 0 56 56"><path d="M5 14a4 4 0 0 1 4-4h12l5 6h21a4 4 0 0 1 4 4v24a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z" fill="' + C("accent") + '"/></svg>';
        const planet = div("planet", folder + "<b>Контекст</b>", s1);
        planet.style.left = PX - 100 + "px"; planet.style.top = PY - 100 + "px";
        hide(planet); Kit.popIn(S, planet, 0.1); read("Контекст", 0.1, DUR);

        // ракета: старт с контекста, выход на орбиту, облёт по часовой стрелке
        const arm = div("arm", "", s1);
        arm.style.left = PX + "px"; arm.style.top = PY + "px";
        const rocket = Kit.sketch(S, { parent: arm, name: "rocket", x: -134.4, y: -R - 110, w: 268.8, at: 0.1, dur: 0.6 });
        const flame = add(rocket.svg, "path", { d: "M306 350 Q320 398 334 350", stroke: C("accent"), "stroke-width": 7, fill: "none", "stroke-linecap": "round", opacity: 0 });
        S.tl.to(flame, { opacity: 1, duration: 0.2 }, 0.5);
        S.tl.to(flame, { scaleY: 0.55, svgOrigin: "320 350", duration: 0.14, yoyo: true, repeat: 121, ease: "sine.inOut" }, 0.6);
        gsap.set(rocket.el, { y: 100, transformOrigin: "50% 50%" });
        S.tl.to(rocket.el, { y: 0, rotation: 90, duration: 1.4, ease: "power2.inOut" }, 0.5);
        const T0 = 1.3, RATE = 45;   // градусов в секунду
        S.tl.fromTo(arm, { rotation: 0 }, { rotation: RATE * (DUR - T0), duration: DUR - T0, ease: "none", immediateRender: false }, T0);

        // находки остаются на орбите там, где их «сбросила» ракета
        const drop = (at, icon, col) => {
          const a = (RATE * (at - T0) * Math.PI) / 180;
          const sat = div("sat", ic(icon, col), s1);
          sat.style.left = PX + R * Math.sin(a) + "px"; sat.style.top = PY - R * Math.cos(a) + "px"; sat.style.borderColor = C(col);
          s1.insertBefore(sat, arm);
          gsap.set(sat, { autoAlpha: 0, scale: 0.4 });
          S.tl.to(sat, { autoAlpha: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, at);
        };
        drop(t("задачи"), TASK, "accent");
        drop(t("слияние"), MERGE, "ok");
        drop(t("спецификацию"), SPEC, "info");

        // справа: что делают агенты ночью и модели днём
        const c1 = Kit.aside(S, { parent: s1, x: 860, y: 230, w: 964, tail: false, html: '<div class="lb night">Каждую ночь</div><div class="tx">Агенты разбирают ошибки из Sentry и логи</div><div class="tx" id="p3-models">Модели проверяют код по техническим стандартам</div>' });
        c1.show(0.3); read("Каждую ночь Агенты разбирают ошибки из Sentry и логи", 0.3, DUR);
        const models = c1.el.querySelector("#p3-models"); hide(models); Kit.popIn(S, models, t("модели")); read(models.textContent, t("модели"), DUR);
        const c3 = Kit.aside(S, { parent: s1, x: 860, y: 460, w: 964, tail: false, html: '<div class="fh">' + ic(TASK, "accent") + "По находкам — задачи</div>" });
        c3.show(t("По находкам")); read("По находкам — задачи", t("По находкам"), DUR);
        [[MERGE, "ok", "<b>Можно:</b> запрос на слияние (Merge Request, MR)<br>с исправлением", "можно"], [SPEC, "info", "<b>Нельзя:</b> спецификация или задача для человека", "нельзя"]].forEach(([icon, col, html, w]) => {
          const r = div("fr", ic(icon, col) + "<span>" + html + "</span>", c3.el); hide(r); Kit.popIn(S, r, t(w)); read(r.textContent, t(w), DUR);
        });

        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
