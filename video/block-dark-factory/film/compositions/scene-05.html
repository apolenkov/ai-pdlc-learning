<template id="scene-05-template">
  <div data-composition-id="scene-05" data-width="1920" data-height="1080" data-duration="12.3">
    <style>
      [data-composition-id="scene-05"] .node { display: flex; align-items: center; justify-content: center; gap: 14px; height: 100%; font-size: 34px; font-weight: 700; white-space: nowrap; }
      [data-composition-id="scene-05"] .node svg { width: 40px; height: 40px; flex: none; }
      [data-composition-id="scene-05"] .loop { position: absolute; left: 900px; top: 470px; width: 120px; height: 120px; }
    </style>
    <script>
      (function () {
        const S = Kit.scene("05"), t = S.t, DUR = 12.3;
        // Count only fully revealed, stationary text; transitions do not count as reading time.
        const read = (text, at, off, reveal = 0.6) => {
          const needed = text.trim().split(/\s+/).filter((word) => /[\p{L}\p{N}]/u.test(word)).length / 3 + 1;
          if (off - at - reveal < needed - 1e-6) throw new Error(`Недостаточно времени для «${text}»: ${(off - at - reveal).toFixed(1)} с, нужно ${needed.toFixed(1)}`);
        };
        if (DUR - S.speechEnd < 1.5) throw new Error("Недостаточный хвост сцены");
        const NS = "http://www.w3.org/2000/svg";
        const add = (svg, tag, attrs) => { const e = document.createElementNS(NS, tag); Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v)); svg.appendChild(e); return e; };
        const C = (n) => Kit.token("--k-" + n);
        const ic = (inner, col) => '<svg viewBox="0 0 56 56" fill="none" stroke="' + C(col) + '" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">' + inner + "</svg>";

        Kit.header(S, { duration: DUR, parts: [{ n: 1, blank: true, at: 0 }] });

        const s1 = S.stage(); gsap.set(s1, { autoAlpha: 1 });
        const CX = 960, CY = 530, RX = 560, RY = 230;
        const pt = (deg) => [CX + RX * Math.cos((deg * Math.PI) / 180), CY + RY * Math.sin((deg * Math.PI) / 180)];
        const svg = document.createElementNS(NS, "svg");
        svg.setAttribute("style", "position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible");
        s1.appendChild(svg);
        const track = add(svg, "ellipse", { cx: CX, cy: CY, rx: RX, ry: RY, fill: "none", stroke: C("line"), "stroke-width": 4, "stroke-dasharray": "10 12" });
        gsap.set(track, { opacity: 0 }); S.tl.to(track, { opacity: 1, duration: 0.6 }, 0.2);

        // пройденный путь: дуга рисуется за кометой; комета идёт по точкам эллипса
        const comet = add(svg, "circle", { cx: pt(-90)[0], cy: pt(-90)[1], r: 13, fill: C("accent"), opacity: 0 });
        const halo = add(svg, "circle", { cx: pt(-90)[0], cy: pt(-90)[1], r: 26, fill: C("accent"), opacity: 0 });
        svg.insertBefore(halo, comet);
        const travel = (from, to, t0, t1) => {
          const arc = add(svg, "path", { d: "M" + pt(from).join(" ") + " A" + RX + " " + RY + " 0 " + (to - from > 180 ? 1 : 0) + " 1 " + pt(to).join(" "), fill: "none", stroke: C("accent"), "stroke-width": 5, pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": 1 });
          svg.insertBefore(arc, halo);
          S.tl.to(arc, { attr: { "stroke-dashoffset": 0 }, duration: t1 - t0, ease: "none" }, t0);
          const n = Math.max(2, Math.round((to - from) / 10));
          for (let i = 1; i <= n; i += 1) {
            const [x, y] = pt(from + ((to - from) * i) / n);
            S.tl.to([comet, halo], { attr: { cx: x, cy: y }, duration: (t1 - t0) / n, ease: "none" }, t0 + ((t1 - t0) * (i - 1)) / n);
          }
          return arc;
        };
        S.tl.to(comet, { opacity: 1, duration: 0.3 }, t("продукт")).to(halo, { opacity: 0.25, duration: 0.3 }, t("продукт"));

        // четыре точки петли
        const W = 600, H = 84;
        const nodes = [
          [-90, "Продукт даёт сигналы", "продукт", ic('<path d="M8 28h10l6-14 8 28 6-14h10"/>', "info")],
          [0, "Агенты готовят изменения", "агенты", ic('<path d="M10 46h28M18 46V36h12v10M24 36l12-20M36 16L18 6"/>', "accent")],
          [90, "Проверки: решает человек", "человек", ic('<circle cx="28" cy="16" r="9"/><path d="M10 50c0-12 8-20 18-20s18 8 18 20"/>', "ok")],
          [180, "Обучение: итоги в контекст", "итоги", ic('<path d="M10 40l12-12 8 8 16-16M36 20h10v10"/>', "ok")],
        ];
        nodes.forEach(([deg, txt, w, icon], i) => {
          const at = t(w);
          const [x, y] = pt(deg);
          const a = Kit.aside(S, { parent: s1, x: x - W / 2, y: y - H / 2, w: W, h: H, tail: false, html: '<div class="node">' + icon + "<span>" + txt + "</span></div>" });
          a.el.style.padding = "0 20px";
          a.show(at); read(txt, at, DUR);
          S.tl.to(a.el, { borderColor: C("accent"), duration: 0.25, yoyo: true, repeat: 1 }, at + 0.1);
        });
        travel(-90, 0, t("продукт") + 0.2, t("агенты"));
        travel(0, 90, t("агенты") + 0.2, t("человек"));
        travel(90, 180, t("человек") + 0.2, t("итоги"));
        travel(180, 270, t("итоги") + 0.2, t("петля", 2));
        // и петля идёт снова: ещё один круг
        S.tl.to(svg.querySelectorAll("path"), { opacity: 0.35, duration: 0.4 }, t("петля", 2));
        const MID = (t("петля", 2) + DUR) / 2;
        travel(270, 450, t("петля", 2) + 0.1, MID); travel(450, 630, MID, DUR - 0.3);

        const loop = document.createElement("div"); loop.className = "loop"; s1.appendChild(loop);
        loop.innerHTML = '<svg viewBox="0 0 120 120" fill="none" stroke="' + C("accent") + '" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M98 60a38 38 0 1 1-12-28"/><path d="M88 14v20H68"/></svg>';
        gsap.set(loop, { autoAlpha: 0 });
        Kit.popIn(S, loop, t("петля", 2));
        S.tl.to(loop, { rotation: 360, duration: DUR - t("петля", 2) - 0.2, ease: "none", transformOrigin: "50% 50%" }, t("петля", 2) + 0.2);

        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
