<template id="scene-03-template">
  <div data-composition-id="scene-03" data-width="1920" data-height="1080" data-duration="41.7">
    <style>
      [data-composition-id="scene-03"] .sc-sh { height: 100%; padding: 8px 18px; display: flex; flex-direction: column; gap: 3px; }
      [data-composition-id="scene-03"] .sc-sh .cap { font-size: 30px; font-weight: 800; margin-bottom: 2px; }
      [data-composition-id="scene-03"] .sc-sh .f { font-size: 22px; font-weight: 600; line-height: 1.2; }
      [data-composition-id="scene-03"] .sc-sh .f .k { color: var(--k-text-2); font-weight: 700; font-size: 20px; }
      [data-composition-id="scene-03"] .sc-sh .f .ok2 { color: var(--k-ok); font-weight: 700; }
      [data-composition-id="scene-03"] .sc-strip { height: 100%; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 800; color: var(--k-accent-soft); }
      [data-composition-id="scene-03"] .sc-tile { height: 100%; padding: 4px 22px; display: flex; flex-direction: column; gap: 2px; }
      [data-composition-id="scene-03"] .sc-tile .cap { font-size: 30px; font-weight: 800; display: flex; align-items: center; gap: 12px; }
      [data-composition-id="scene-03"] .sc-tile .cap .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--k-accent-tint); border: 2px solid var(--k-accent); color: var(--k-accent-soft); }
      [data-composition-id="scene-03"] .sc-tile .cap .ic svg { width: 21px; height: 21px; }
      [data-composition-id="scene-03"] .sc-tile .sub { font-size: 22px; font-weight: 600; color: var(--k-text-2); line-height: 1.2; }
      [data-composition-id="scene-03"] .sc-tile .tag { align-self: flex-start; margin-top: auto; font-size: 22px; font-weight: 700; padding: 2px 12px; border-radius: 11px; background: var(--k-panel-2); border: 2px solid var(--k-line); color: var(--k-text); }
      [data-composition-id="scene-03"] .sc-fin { height: 100%; display: flex; align-items: center; padding: 0 22px; font-size: 26px; font-weight: 700; line-height: 1.2; color: var(--k-text-2); }
      [data-composition-id="scene-03"] .sc-fin b { color: var(--k-text); }
    </style>
    <script>
      (function () {
        const S = Kit.scene("03"), t = S.t, DUR = 41.7;
        const read = (text, at, off, reveal = 0.6) => {
          const needed = text.trim().split(/\s+/).filter((word) => /[\p{L}\p{N}]/u.test(word)).length / 3 + 1;
          if (off - at - reveal < needed - 1e-6) throw new Error(`Недостаточно времени для «${text}»`);
        };
        if (DUR - S.speechEnd < 1.5) throw new Error("Недостаточный хвост сцены");
        const hide = (...els) => els.forEach((el) => gsap.set(el, { autoAlpha: 0 }));
        const ICON_GEAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3.4"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/></svg>';
        const ICON_EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>';

        Kit.header(S, { header: { mode: "parts", total: 3 }, chapter: "Шапка и две проверки", step: 3, duration: DUR,
          parts: [{ n: 1, blank: true, at: 0 }] });

        const s1 = S.stage(); gsap.set(s1, { autoAlpha: 1 });

        /* ---- слева: верх реального intent.md ---- */
        const ed = Kit.editor(S, { parent: s1, x: 96, y: 215, w: 1180, h: 596, crumb: "калькулятор · учебный пример", visible: false,
          tabs: [{ name: "intent.md", active: true }],
          lines: [
            "# Запись намерения",
            "",
            "Инициатор: представитель кредитного отдела",
            "Владелец решения: владелец продукта",
            "Помощник (аналитик): аналитик помогает",
            "Состояние: черновик",
            "Источник: письмо владельца продукта",
            "",
            "## План изменений",
          ] });
        ed.show(2.05);   // заставка части держится первые 2 с
        ed.caretOff(2.1);
        ed.reveal(0, 0, 2.05); // строка 2 пустая: reveal только заголовка (пустых целей нет)
        ed.reveal(2, 3, 2.05);
        ed.reveal(5, 6, 2.05); // строка 8 пустая: пропускаем
        const T_HELP = t("помощника-аналитика"), T_ST = t("состояние"), T_SRC = t("источник"), T_DRAFT = t("черновик"), T_OK = t("принят");
        ed.reveal(4, 4, T_HELP - 0.2); ed.mark(4, T_HELP, { tone: "accent" });
        ed.mark(5, T_ST, { tone: "accent" });
        ed.mark(6, T_SRC, { tone: "accent" });
        ed.mark(5, T_DRAFT, { tone: "accent" });
        /* «черновик» → «принят» только после одобрения */
        const st = document.createElement("span");
        st.textContent = "  → «принят»";
        st.style.cssText = "opacity:0;color:var(--k-ok);font-weight:700";
        ed.rows[5].tx.appendChild(st);
        S.tl.to(st, { opacity: 1, duration: 0.4 }, T_OK);
        read("Запись намерения Инициатор представитель кредитного отдела Владелец решения владелец продукта Состояние черновик Источник письмо владельца продукта", 2.05, DUR);
        read("Помощник аналитик аналитик помогает", T_HELP - 0.2, DUR);

        /* ---- справа: карточка шапки + две плитки проверок ---- */
        const sh = Kit.aside(S, { parent: s1, x: 1304, y: 215, w: 520, h: 200, tail: false,
          html: '<div class="sc-sh"><div class="cap">Шапка записи</div>' +
            '<div class="f"><span class="k">инициатор:</span> кредитный отдел</div>' +
            '<div class="f"><span class="k">владелец решения:</span> владелец продукта</div>' +
            '<div class="f"><span class="k">состояние:</span> черновик <span class="ok2 fin">→ принят</span></div>' +
            '<div class="f"><span class="k">источник:</span> письмо владельца продукта</div></div>' });
        const fin = sh.el.querySelector(".fin"); hide(fin);
        sh.show(2.1);
        S.tl.to(fin, { autoAlpha: 1, duration: 0.4 }, T_OK);
        read("Шапка записи инициатор представитель кредитного отдела владелец решения владелец продукта состояние черновик источник письмо владельца продукта", 2.1, DUR);

        const cnt = Kit.aside(S, { parent: s1, x: 1304, y: 421, w: 520, h: 40, tail: false,
          html: '<div class="sc-strip">проверок две</div>' });
        cnt.show(t("Проверок две"));
        read("проверок две", t("Проверок две"), DUR, 0);

        const t1 = Kit.aside(S, { parent: s1, x: 1304, y: 467, w: 520, h: 158, tail: false,
          html: '<div class="sc-tile"><div class="cap"><span class="ic">' + ICON_GEAR + '</span>Структура</div>' +
            '<div class="sub">все разделы есть · поля заполнены</div>' +
            '<span class="tag a1">автоматическая проверка формы</span></div>' });
        const t1tag = t1.el.querySelector(".a1"); hide(t1tag);
        t1.show(t("Структура"));
        Kit.popIn(S, t1tag, t("автоматическая проверка"));
        read("Структура все разделы есть поля заполнены", t("Структура"), DUR);
        read("автоматическая проверка формы", t("автоматическая проверка"), DUR, 0);

        const t2 = Kit.aside(S, { parent: s1, x: 1304, y: 633, w: 520, h: 172, tail: false,
          html: '<div class="sc-tile"><div class="cap"><span class="ic">' + ICON_EYE + '</span>Смысл</div>' +
            '<div class="sub">проблема без решения · границы и эффект проверяемы</div>' +
            '<span class="tag a2">проверяет человек</span></div>' });
        t2.show(t("Смысл проверяет человек"));
        read("Смысл проблема без решения границы и эффект проверяемы проверяет человек", t("Смысл проверяет человек"), DUR);

        /* «План изменений» — пока заголовок; полный разбор проверок — в шаге 4 */
        const T_PLAN = t("Раздел «План изменений»");
        ed.reveal(8, 8, T_PLAN); ed.mark(8, T_PLAN, { tone: "accent" });
        S.tl.to([t1.el, t2.el], { borderColor: Kit.token("--k-accent"), duration: 0.5, stagger: 0.1 }, t("Полный разбор"));
        read("План изменений", T_PLAN, DUR, 0);

        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
