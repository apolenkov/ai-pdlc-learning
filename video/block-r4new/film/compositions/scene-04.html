<template id="scene-04-template">
  <div data-composition-id="scene-04" data-width="1920" data-height="1080" data-duration="50.1">
    <style>
      [data-composition-id="scene-04"] .fold { color: var(--k-text-2); font-weight: 700; opacity: 0; }
      [data-composition-id="scene-04"] .qa { height: 100%; display: flex; flex-direction: column; align-items: stretch; gap: 0; }
      [data-composition-id="scene-04"] .qa-p { height: 84px; display: flex; align-items: center; gap: 20px; padding: 0 22px; border-radius: 16px; border: 2px solid var(--k-line); background: var(--k-win); font-size: 40px; font-weight: 800; letter-spacing: -0.01em; opacity: 0; }
      [data-composition-id="scene-04"] .qa-p .ic { flex: none; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 36px; font-weight: 800; }
      [data-composition-id="scene-04"] .qa-p .ic svg { width: 32px; height: 32px; }
      [data-composition-id="scene-04"] .qa-p.q .ic { background: rgba(124, 196, 255, 0.14); border: 3px solid var(--k-info); color: var(--k-info); }
      [data-composition-id="scene-04"] .qa-p.a .ic { background: var(--k-ok-tint); border: 3px solid var(--k-ok); color: var(--k-ok); }
      [data-composition-id="scene-04"] .qa-p.f { border-color: var(--k-accent); font-family: var(--k-font-mono); font-size: 40px; }
      [data-composition-id="scene-04"] .qa-p.f .ic { background: var(--k-accent-tint); border: 3px solid var(--k-accent); color: var(--k-accent-soft); }
      [data-composition-id="scene-04"] .qa-ar { height: 56px; display: grid; place-items: center; font-size: 44px; font-weight: 300; color: var(--k-text-2); line-height: 1; opacity: 0; }
      [data-composition-id="scene-04"] .tb { height: 100%; display: flex; flex-direction: column; }
      [data-composition-id="scene-04"] .tb-r { padding: 14px 0 16px; border-top: 2px solid var(--k-line); }
      [data-composition-id="scene-04"] .tb-r.r1 { border-top: 0; padding-top: 0; }
      [data-composition-id="scene-04"] .tb-r.r2, [data-composition-id="scene-04"] .tb-r.r3 { opacity: 0; }
      [data-composition-id="scene-04"] .tb .lab { font-size: 32px; font-weight: 600; color: var(--k-text-2); line-height: 1.2; opacity: 0; }
      [data-composition-id="scene-04"] .tb .val { font-size: 38px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.25; white-space: nowrap; }
      [data-composition-id="scene-04"] .tb .val i { display: inline-block; font-style: normal; opacity: 0; }
      [data-composition-id="scene-04"] .tb .val i:not([class]) { padding: 0 0.3em; color: var(--k-text-2); font-weight: 600; }
      [data-composition-id="scene-04"] .tb .sub { font-size: 34px; font-weight: 700; color: var(--k-accent-soft); line-height: 1.25; margin-top: 4px; opacity: 0; }
      [data-composition-id="scene-04"] .tb .res { font-size: 44px; font-weight: 800; letter-spacing: -0.01em; color: var(--k-ok); line-height: 1.25; opacity: 0; }
      [data-composition-id="scene-04"] .tb-note { align-self: flex-start; margin-top: 30px; padding: 8px 18px; border-radius: 14px; border: 2px dashed var(--k-accent); background: var(--k-accent-tint); color: var(--k-accent-soft); font-size: 32px; font-weight: 700; text-align: center; white-space: normal; opacity: 0; }
      [data-composition-id="scene-04"] .op { height: 100%; display: flex; flex-direction: column; gap: 10px; }
      [data-composition-id="scene-04"] .op-h { display: flex; align-items: center; gap: 18px; font-size: 44px; font-weight: 800; letter-spacing: -0.015em; color: var(--k-accent-soft); opacity: 0; }
      [data-composition-id="scene-04"] .op-h .ic { flex: none; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; border: 3px solid var(--k-accent); background: var(--k-accent-tint); font-size: 38px; font-weight: 800; color: var(--k-accent-soft); }
      [data-composition-id="scene-04"] .op-t { font-size: 38px; font-weight: 700; line-height: 1.2; opacity: 0; }
      [data-composition-id="scene-04"] .rs { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
      [data-composition-id="scene-04"] .rs .tag { align-self: flex-start; padding: 2px 16px; border-radius: 10px; font-family: var(--k-font-mono); font-size: 36px; font-weight: 800; opacity: 0; }
      [data-composition-id="scene-04"] .rs.add .tag { background: var(--k-ok-tint); border: 2px solid var(--k-ok); color: var(--k-ok); }
      [data-composition-id="scene-04"] .rs.tsk .tag { background: rgba(124, 196, 255, 0.14); border: 2px solid var(--k-info); color: var(--k-info); }
      [data-composition-id="scene-04"] .rs .tx { font-size: 34px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.2; white-space: nowrap; opacity: 0; }
    </style>
    <script>
      (function () {
        const S = Kit.scene("04"), t = S.t, DUR = 50.1;
        // Count only fully revealed, stationary text; transitions do not count as reading time.
        const read = (text, at, off, reveal = 0.5) => {
          const needed = text.trim().split(/\s+/).filter((word) => /[\p{L}\p{N}]/u.test(word)).length / 3 + 1;
          if (off - at - reveal < needed - 1e-6) throw new Error(`Недостаточно времени для «${text}»: ${(off - at - reveal).toFixed(2)} < ${needed.toFixed(2)}`);
        };
        if (DUR - S.speechEnd < 1.5) throw new Error("Недостаточный хвост сцены");
        const rev = (el, at, d = 0.45, from = { y: 14 }) => { gsap.set(el, from); S.tl.to(el, { opacity: 1, x: 0, y: 0, duration: d, ease: "power3.out" }, at); };
        const INFO = Kit.token("--k-info"), ACC = Kit.token("--k-accent"), OK = Kit.token("--k-ok");

        Kit.header(S, { header: { mode: "parts", total: 6 }, chapter: "Замысел и первое изменение", step: 4, duration: DUR,
          parts: [{ n: 1, blank: true, at: 0 }] });

        const s1 = S.stage(); gsap.set(s1, { autoAlpha: 1 });
        const sa1 = S.stage(); gsap.set(sa1, { autoAlpha: 1 });   // вопросы → ответы → файл
        const sa2 = S.stage(); gsap.set(sa2, { autoAlpha: 1 });   // таблица ответов
        const sb = S.stage(); gsap.set(sb, { autoAlpha: 1 });     // открытый вопрос и итог

        /* ---- Редактор: настоящий интент 0. Тела разделов свёрнуты (add: true), как в редакторе ---- */
        const BODY = [
          "Люди, которые выбирают кредит, хотят оценить ежемесячный платёж. Калькулятора ещё нет: чтобы оценить платёж, человеку приходится считать самостоятельно.",
          "Кредитный калькулятор: человек вводит сумму кредита, годовую ставку и срок в месяцах и получает ежемесячный платёж.",
          "Не вводим ограничения суммы и срока. Ничего не храним. Комиссии, страховки, график и досрочное погашение — за рамками первого изменения.",
          "При сумме 120 000 ₽, ставке 0% и сроке 12 месяцев платёж составит 10 000 ₽. При сумме 10 001 ₽, ставке 0% и сроке 2 месяца платёж составит 5 001 ₽. Платёж показываем в целых рублях.",
          "На первом изменении открытых вопросов нет.",
        ];
        const lines = [
          "# Замысел 0: нужен калькулятор ежемесячного платежа", "",
          "Автор: владелец продукта", "Владелец решения: владелец продукта", "Состояние: черновик", "Источник: запрос владельца продукта", "",
          "## Проблема", { t: BODY[0], add: true }, { t: "", add: true },
          "## Результат", { t: BODY[1], add: true }, { t: "", add: true },
          "## Границы", { t: BODY[2], add: true }, { t: "", add: true },
          "## Признаки успеха", { t: BODY[3], add: true }, { t: "", add: true },
          "## Открытые вопросы", { t: BODY[4], add: true },
        ];
        const T_ED = 1.2;
        // окно кода ниже границы субтитров не заходит: кегль и строка меньше, все двадцать строк умещаются без среза краем окна
        document.documentElement.style.setProperty("--k-fs-code", "26px"); document.documentElement.style.setProperty("--k-lh-code", "36px");
        const ed = Kit.editor(S, { parent: s1, x: 96, y: 192, w: 1020, h: 624, crumb: "intents", visible: false,
          tabs: [{ name: "intent-0-monthly-payment.md", active: true }], lines });
        ed.show(T_ED);
        ed.caretOff(T_ED);
        // пустые строки без символов: reveal() дал бы пустую цель GSAP, поэтому показываем только номер
        ed.rows.forEach((r, i) => (r.chars.length ? ed.reveal(i, i, T_ED + 0.5) : S.tl.set(r.no, { opacity: 1 }, T_ED + 0.5)));
        // прокрутка: строки лежат во внутреннем слое, окно кода обрезает
        const code = ed.el.querySelector(".k-ed-code");
        const inner = document.createElement("div");
        while (code.firstChild) inner.appendChild(code.firstChild);
        code.appendChild(inner);
        inner.setAttribute("data-layout-allow-occlusion", "");
        code.style.height = (624 - 56 - 52) + "px";
        code.setAttribute("data-layout-allow-overflow", "");
        code.setAttribute("data-layout-allow-caption-zone", "");   // свёрнутый текст раздела внутри окна обрезан им (окно кончается на y 816)   // свёрнутые строки и прокрутка выходят за окно кода намеренно
        const HEAD = [7, 10, 13, 16, 19];
        HEAD.forEach((i) => {
          const f = document.createElement("span"); f.className = "fold"; f.textContent = " …";
          ed.rows[i].tx.appendChild(f); ed.rows[i].fold = f;
          S.tl.to(f, { opacity: 1, duration: 0.3 }, T_ED + 0.5);
        });
        const unfold = (i, at, d = 0.7) => S.tl.to(ed.rows[i].row, { height: ed.rows[i].h, duration: d, ease: "power2.out" }, at);
        read("Автор владелец продукта Владелец решения владелец продукта Состояние черновик Источник запрос владельца продукта", T_ED + 0.5, DUR, 0.6);

        // шапка (4 строки), затем пять разделов — на словах диктора
        const T_HDR = t("шапка");
        [2, 3, 4, 5].forEach((i) => ed.mark(i, T_HDR, { off: t("и пять частей") + 0.9 }));
        const SECT = [[7, t("проблема")], [10, t("результат")], [13, t("границы")], [16, t("признаки успеха")], [19, t("открытые вопросы")]];
        SECT.forEach(([i, at]) => ed.mark(i, at, { off: S.end("открытые вопросы") + 1.3 }));

        // «Признаки успеха» раскрываются, когда звучат те же числа
        const T_SC = t("Сто двадцать") - 0.5;
        S.tl.to(inner, { y: -216, duration: 0.9, ease: "power2.inOut" }, T_SC);
        unfold(17, T_SC + 0.3); unfold(18, T_SC + 0.3);
        for (let i = 0; i < 6; i++) S.tl.set(ed.rows[i].row, { autoAlpha: 0 }, T_SC + 1.0);   // уехавшие вверх строки уже обрезаны окном
        S.tl.to(ed.rows[16].fold, { opacity: 0, duration: 0.2 }, T_SC + 0.3);
        ed.mark(16, T_SC + 1.2, { off: t("Это ответы") - 0.2 });
        // открытые вопросы: подсветка раздела, пока звучит правило
        ed.mark(19, t("вопрос остаётся"), {});

        /* ---- Модель задаёт вопросы → ответы владельца продукта → proposal.md ---- */
        const T_Q = t("Модель"), T_A = t("ответы"), T_F = t("в предложение");
        const T_G1_OUT = T_F + 2.0;
        const G1X = 1140, G1W = 684, G1Y = 250;
        const g1 = Kit.aside(S, { parent: sa1, x: G1X, y: G1Y, w: G1W, h: 404, tail: false,
          html: '<div class="qa">' +
            '<div class="qa-p q"><span class="ic">?</span><span>вопросы модели</span></div><div class="qa-ar">↓</div>' +
            '<div class="qa-p a"><span class="ic">' + Kit.icons.check + '</span><span>ответы владельца продукта</span></div><div class="qa-ar">↓</div>' +
            '<div class="qa-p f"><span class="ic">' + Kit.icons.file + '</span><span>proposal.md</span></div></div>' });
        g1.el.style.cssText += ";background:none;border:0;box-shadow:none;padding:0";
        g1.el.setAttribute("data-layout-allow-overflow", ""); // рамки нет: щуп проверки рамок выступает за бокс
        g1.show(T_Q - 0.1);
        const gq = (s) => g1.el.querySelectorAll(s);
        const [pq, pa, pf] = gq(".qa-p"), [ar1, ar2] = gq(".qa-ar");
        rev(pq, T_Q + 0.2, 0.45, { y: 14 });
        rev(ar1, T_A - 0.3); rev(pa, T_A, 0.45, { x: -30 });
        rev(ar2, T_F - 0.3); rev(pf, T_F, 0.45, { x: -30 });
        read("вопросы модели", T_Q + 0.2, T_G1_OUT); read("ответы владельца продукта", T_A, T_G1_OUT); read("proposal.md", T_F, T_G1_OUT);
        Kit.stageOut(S, sa1, T_G1_OUT);

        /* ---- Таблица ответов владельца продукта: числа появляются по мере диктовки ---- */
        const T_TB = T_G1_OUT + 0.62;
        const tb = Kit.aside(S, { parent: sa2, x: 1140, y: 192, w: 684, h: 560, tail: false,
          html: '<div class="tb">' +
            '<div class="tb-r r1"><div class="lab">начальные значения</div><div class="val"><i class="a">3 000 000 ₽</i><i>·</i><i class="b">16%</i><i>·</i><i class="c">240 мес</i></div><div class="sub">платёж — целые рубли</div></div>' +
            '<div class="tb-r r2"><div class="val"><i class="a">120 000 ₽</i><i>/</i><i class="b">0%</i><i>/</i><i class="c">12 мес</i></div><div class="res">→ 10 000 ₽</div></div>' +
            '<div class="tb-r r3"><div class="val"><i class="a">10 001 ₽</i><i>/</i><i class="b">0%</i><i>/</i><i class="c">2 мес</i></div><div class="res">→ 5 001 ₽ · последний платёж округлён</div></div>' +
            '<div class="tb-note">ответы владельца продукта, не наблюдения</div></div>' });
        tb.el.style.cssText += ";background:none;border:0;box-shadow:none;padding:0 6px";
        tb.el.setAttribute("data-layout-allow-overflow", ""); // рамки нет: щуп проверки рамок выступает за бокс
        tb.show(T_TB);
        const tq = (s) => tb.el.querySelector(s);
        const T_TB_OUT = t("Если владелец") + 1.0;
        const sp = (row, k, at) => { const el = tq(".r" + row + " .val ." + k); rev(el, at, 0.4, { y: 10 }); return el; };
        const sep = (row, at) => tb.el.querySelectorAll(".r" + row + " .val i:not([class])").forEach((el, n) => rev(el, at[n], 0.3, { y: 0 }));
        rev(tq(".r1 .lab"), T_TB + 0.1);
        sp(1, "a", t("три миллиона")); sp(1, "b", t("шестнадцать")); sp(1, "c", t("двести сорок")); sep(1, [t("шестнадцать"), t("двести сорок")]);
        rev(tq(".r1 .sub"), t("платёж"));
        S.tl.to(tq(".r2"), { opacity: 1, duration: 0.3 }, t("Сто двадцать") - 0.05);
        S.tl.to(tq(".r3"), { opacity: 1, duration: 0.3 }, t("Десять тысяч один") - 0.05);
        sp(2, "a", t("Сто двадцать")); sp(2, "b", t("ноль")); sp(2, "c", t("двенадцать")); sep(2, [t("ноль"), t("двенадцать")]);
        rev(tq(".r2 .res"), t("десять тысяч"));
        sp(3, "a", t("Десять тысяч один")); sp(3, "b", t("ноль", 2)); sp(3, "c", t("два месяца")); sep(3, [t("ноль", 2), t("два месяца")]);
        rev(tq(".r3 .res"), t("пять тысяч"));
        rev(tq(".tb-note"), t("Это ответы"));
        read("начальные значения 3 000 000 ₽ 16% 240 мес", T_TB + 0.1, T_TB_OUT); read("платёж — целые рубли", t("платёж"), T_TB_OUT);
        read("120 000 ₽ 0% 12 мес 10 000 ₽", t("десять тысяч"), T_TB_OUT); read("10 001 ₽ 0% 2 мес 5 001 ₽", t("пять тысяч"), T_TB_OUT);
        read("ответы владельца продукта, не наблюдения", t("Это ответы"), T_TB_OUT);
        Kit.stageOut(S, sa2, T_TB_OUT);

        /* ---- Открытый вопрос и итог ---- */
        const T_OP = t("вопрос остаётся");
        const op = Kit.aside(S, { parent: sb, x: 1140, y: 192, w: 684, h: 196, tail: false,
          html: '<div class="op"><div class="op-h"><span class="ic">?</span><span>открытый вопрос</span></div><div class="op-t">модель не решает сама</div></div>' });
        op.el.style.borderColor = ACC;
        op.show(T_OP - 0.1);
        rev(op.el.querySelector(".op-h"), T_OP); rev(op.el.querySelector(".op-t"), t("модель не решает"));
        read("открытый вопрос", T_OP, DUR); read("модель не решает сама", t("модель не решает"), DUR);

        const T_ADD = t("только добавленные");
        const add = Kit.aside(S, { parent: sb, x: 1140, y: 410, w: 684, h: 190, tail: false,
          html: '<div class="rs add"><span class="tag">ADDED</span><span class="tx">только добавленные требования</span></div>' });
        add.el.style.borderColor = OK;
        add.show(T_ADD - 0.1);
        rev(add.el.querySelector(".tag"), T_ADD + 0.1, 0.4, { x: -24 }); rev(add.el.querySelector(".tx"), T_ADD + 0.2);
        read("ADDED только добавленные требования", T_ADD + 0.1, DUR);

        const T_TSK = t("задачи реализации");
        const tsk = Kit.aside(S, { parent: sb, x: 1140, y: 626, w: 684, h: 190, tail: false,
          html: '<div class="rs tsk"><span class="tag">tasks.md</span><span class="tx">задачи реализации открыты</span></div>' });
        tsk.el.style.borderColor = INFO;
        tsk.show(T_TSK - 0.1);
        rev(tsk.el.querySelector(".tag"), T_TSK + 0.1, 0.4, { x: -24 }); rev(tsk.el.querySelector(".tx"), T_TSK + 0.2);
        read("tasks.md задачи реализации открыты", T_TSK + 0.1, DUR);

        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
