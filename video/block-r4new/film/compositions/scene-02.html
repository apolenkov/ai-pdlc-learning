<template id="scene-02-template">
  <div data-composition-id="scene-02" data-width="1920" data-height="1080" data-duration="22">
    <style>
      [data-composition-id="scene-02"] .ch-card { box-sizing: border-box; padding: 0 26px; display: flex; flex-direction: column; justify-content: center; }
      [data-composition-id="scene-02"] .ch-t { font-size: 40px; font-weight: 800; line-height: 1.15; }
      [data-composition-id="scene-02"] .ch-s { font-size: 30px; font-weight: 500; line-height: 1.25; color: var(--k-text-2); margin-top: 8px; }
      [data-composition-id="scene-02"] .ch-s.cm { font-family: var(--k-font-mono); color: var(--k-accent-soft); }
      [data-composition-id="scene-02"] .ch-ar { position: absolute; top: 292px; width: 80px; text-align: center; font-size: 56px; font-weight: 300; color: var(--k-text-2); line-height: 1; }
      [data-composition-id="scene-02"] .ch-gh { position: absolute; top: 206px; width: 372px; height: 230px; box-sizing: border-box; display: grid; place-items: center; border: 3px dashed var(--k-win-dot); border-radius: var(--k-r-card); font-size: 30px; font-weight: 600; color: var(--k-text-2); }
      [data-composition-id="scene-02"] .nx { box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; border-color: #ff8a8a; background: rgba(255, 138, 138, 0.12); font-size: 34px; font-weight: 700; color: #ff8a8a; }
      [data-composition-id="scene-02"] .ck { box-sizing: border-box; padding: 20px 28px; }
      [data-composition-id="scene-02"] .ck-h { font-size: 40px; font-weight: 800; line-height: 1.1; color: var(--k-accent-soft); }
      [data-composition-id="scene-02"] .ck-r { display: flex; align-items: center; gap: 18px; height: 70px; margin-top: 12px; padding: 0 22px; border: 3px solid var(--k-ok); border-radius: 14px; background: var(--k-ok-tint); font-size: 38px; font-weight: 700; line-height: 1.1; }
      [data-composition-id="scene-02"] .ck-r svg { width: 40px; height: 40px; color: var(--k-ok); flex-shrink: 0; }
      [data-composition-id="scene-02"] .ck-r .m { font-family: var(--k-font-mono); font-weight: 600; color: var(--k-accent-soft); }
      [data-composition-id="scene-02"] .mn { box-sizing: border-box; padding: 0 30px; display: flex; flex-direction: column; justify-content: center; }
      [data-composition-id="scene-02"] .mn-c { font-size: 32px; font-weight: 600; color: var(--k-text-2); line-height: 1.2; }
      [data-composition-id="scene-02"] .mn-r { display: flex; align-items: center; gap: 26px; margin-top: 14px; }
      [data-composition-id="scene-02"] .mn-b { font-family: var(--k-font-mono); font-size: 64px; font-weight: 700; line-height: 1.1; }
      [data-composition-id="scene-02"] .mn-k { display: flex; align-items: center; gap: 12px; padding: 8px 20px; border: 3px solid var(--k-info); border-radius: 14px; color: var(--k-info); font-size: 36px; font-weight: 700; line-height: 1.1; white-space: nowrap; }
      [data-composition-id="scene-02"] .mn-k svg { width: 34px; height: 34px; }
    </style>
    <script>
      (function () {
        const S = Kit.scene("02"), t = S.t, DUR = 22;
        // Count only fully revealed, stationary text; transitions do not count as reading time.
        const read = (text, at, off, reveal = 0.6) => {
          const needed = text.trim().split(/\s+/).filter((word) => /[\p{L}\p{N}]/u.test(word)).length / 3 + 1;
          if (off - at - reveal < needed - 1e-6) throw new Error(`Недостаточно времени для «${text}»`);
        };
        if (DUR - S.speechEnd < 1.5) throw new Error("Недостаточный хвост сцены");
        const hide = (...els) => els.forEach((el) => gsap.set(el, { autoAlpha: 0 }));
        const div = (cls, html, parent) => { const el = document.createElement("div"); el.className = cls; el.innerHTML = html; parent.appendChild(el); return el; };
        const INFO = Kit.token("--k-info"), LINE = Kit.token("--k-line"), ACC = Kit.token("--k-accent");
        const LOCK = '<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="12" width="18" height="12" rx="3"/><path d="M9 12V9a5 5 0 0 1 10 0v3"/></svg>';
        const TICK = '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21l8 8 16-17"/></svg>';

        Kit.header(S, { header: { mode: "parts", total: 6 }, chapter: "Пустой репозиторий и копия", step: 2, duration: DUR, parts: [{ n: 1, blank: true, at: 0 }] });

        const s1 = S.stage(); gsap.set(s1, { autoAlpha: 1 });

        /* Top: the chain. Card 4 has a dashed slot from the moment the editor is opened. */
        const X = (i) => 96 + i * 452;
        const C = [
          { t: "Пустой репозиторий", s: "выдал организатор", at: 0.1 },   // первые 2 с закрыты заставкой части
          { t: "Ваш форк", s: "ваша копия на сервере", at: t("свой") },
          { t: "Копия на компьютере", s: "открыта в редакторе", at: t("скопируйте"), sAt: t("откройте") },
          { t: "Личная ветка", s: "course/&lt;LOGIN&gt;/<wbr>stage-4-new", mono: true, at: t("Работайте") + 0.1 },
        ];
        const T_CHECK = t("Проверьте");
        const cards = C.map((c, i) => {
          const a = Kit.aside(S, { parent: s1, x: X(i), y: 206, w: 372, h: 230, tail: false, html:
            `<div class="ch-t">${c.t}</div><div class="ch-s${c.mono ? " cm" : ""}">${c.s}</div>` });
          a.el.classList.add("ch-card");
          a.show(c.at);
          const sub = a.el.querySelector(".ch-s");
          if (c.sAt) { hide(sub); Kit.popIn(S, sub, c.sAt); read(c.s, c.sAt, DUR); }
          read(c.t, c.at, DUR); if (!c.sAt) read(sub.textContent, c.at, DUR);
          const arAt = i === 3 ? t("откройте") + 0.1 : c.at - 0.25;
          if (i) { const ar = div("ch-ar", "→", s1); ar.style.left = (X(i) - 80) + "px"; hide(ar); Kit.popIn(S, ar, arAt); }
          return a;
        });
        const gh = div("ch-gh", "будет создана", s1); gh.style.left = X(3) + "px"; hide(gh);
        Kit.popIn(S, gh, t("откройте") + 0.1);
        S.tl.set(gh, { autoAlpha: 0 }, C[3].at);

        const hl = (el, on, off, col) => {
          S.tl.to(el, { borderColor: col || INFO, duration: 0.3 }, on);
          S.tl.to(el, { borderColor: LINE, duration: 0.3 }, off);
        };
        hl(cards[0].el, 0.1, t("Сделайте") - 0.1);
        hl(cards[1].el, C[1].at, t("скопируйте") - 0.1);
        hl(cards[2].el, C[2].at, T_CHECK - 0.1);
        S.tl.to(cards[3].el, { borderColor: ACC, duration: 0.4 }, C[3].at + 0.5);

        /* An invented address is not allowed. */
        const nx = Kit.aside(S, { parent: s1, x: 96, y: 462, w: 640, h: 70, tail: false, html: "выдуманный адрес — нельзя" });
        nx.el.classList.add("nx"); nx.show(t("выдуманный"));
        read("выдуманный адрес нельзя", t("выдуманный"), DUR);

        /* Bottom left: the two checks on «Проверьте». */
        const ck = Kit.aside(S, { parent: s1, x: 96, y: 556, w: 1728, h: 262, tail: false, html:
          '<div class="ck-h">Проверьте</div>' +
          `<div class="ck-r">${TICK}<span><span class="m">origin</span> → ваш форк</span></div>` +
          `<div class="ck-r">${TICK}<span>Source Control: изменений нет</span></div>` });
        ck.el.classList.add("ck");
        const rows = Array.from(ck.el.querySelectorAll(".ck-r")); hide(...rows);
        ck.show(T_CHECK);
        Kit.popIn(S, rows[0], t("адрес «ориджин")); Kit.popIn(S, rows[1], t("сорс"));
        read("Проверьте", T_CHECK, DUR);
        read("origin ваш форк", t("адрес «ориджин"), DUR);
        read("Source Control изменений нет", t("сорс"), DUR);

        /* Bottom right: the shared main branch is protected. */
        const mn = Kit.aside(S, { parent: s1, x: 1140, y: 556, w: 684, h: 262, tail: false, html:
          '<div class="mn-c">Общая главная ветка</div>' +
          `<div class="mn-r"><div class="mn-b">main</div><div class="mn-k">${LOCK}защищена</div></div>` });
        mn.el.classList.add("mn");
        const key = mn.el.querySelector(".mn-k"); hide(key);
        // the check panel is full width until the main branch is named, then it makes room
        S.tl.to(ck.el, { width: 1000, duration: 0.5, ease: "power2.inOut" }, t("общая") - 0.55);
        mn.show(t("общая")); Kit.popIn(S, key, t("защищена"));
        S.tl.fromTo(mn.el, { x: 90 }, { x: 0, duration: 0.7, ease: "power3.out", immediateRender: false }, t("общая"));
        read("Общая главная ветка main", t("общая"), DUR);
        read("защищена", t("защищена"), DUR);

        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
