<template id="scene-00-template">
  <div data-composition-id="scene-00" data-width="1920" data-height="1080" data-duration="25.6">
    <style>
      [data-composition-id="scene-00"] .sc-plate { display: inline-block; margin-top: 46px; font-size: 36px; font-weight: 600; padding: 10px 30px; border-radius: 18px; border: 2px solid var(--k-line); color: var(--k-text-2); }
      [data-composition-id="scene-00"] .sc-plate b { color: var(--k-text); font-weight: 700; }
      [data-composition-id="scene-00"] .sc-doc { height: 100%; padding: 16px 26px; display: flex; flex-direction: column; gap: 8px; position: relative; }
      [data-composition-id="scene-00"] .sc-doc .cap { font-size: 32px; font-weight: 800; display: flex; align-items: center; gap: 14px; }
      [data-composition-id="scene-00"] .sc-doc .tag { font-size: 26px; font-weight: 700; padding: 3px 14px; border-radius: 12px; border: 2px solid var(--k-line); color: var(--k-text-2); }
      [data-composition-id="scene-00"] .sc-doc .secs { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 2px; }
      [data-composition-id="scene-00"] .sc-doc .s { font-size: 26px; font-weight: 600; padding: 5px 15px; border-radius: 12px; background: var(--k-ok-tint); border: 2px solid var(--k-ok); white-space: nowrap; }
      [data-composition-id="scene-00"] .sc-stamp { position: absolute; right: 22px; bottom: 16px; font-size: 26px; font-weight: 800; padding: 5px 16px; border-radius: 14px; border: 3px dashed var(--k-accent); color: var(--k-accent-soft); transform: rotate(-4deg); }
      [data-composition-id="scene-00"] .sc-flow { height: 100%; padding: 12px 26px; display: flex; flex-direction: column; gap: 8px; }
      [data-composition-id="scene-00"] .sc-flow .cap { font-size: 29px; font-weight: 800; margin-bottom: 2px; }
      [data-composition-id="scene-00"] .sc-flow .st { display: flex; align-items: center; gap: 14px; font-size: 28px; font-weight: 700; padding: 8px 16px; border-radius: 13px; background: var(--k-panel-2); }
      [data-composition-id="scene-00"] .sc-flow .st .n { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--k-accent-tint); border: 2px solid var(--k-accent); color: var(--k-accent-soft); font-size: 23px; font-weight: 800; }
      [data-composition-id="scene-00"] .sc-flow .st.out { background: var(--k-accent-tint); border: 2px solid var(--k-accent); }
      [data-composition-id="scene-00"] .sc-diff { height: 100%; display: flex; align-items: center; gap: 26px; padding: 0 30px; }
      [data-composition-id="scene-00"] .sc-diff .cell { flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 10px 20px; border-radius: 14px; background: var(--k-panel-2); }
      [data-composition-id="scene-00"] .sc-diff .cell .k { font-size: 30px; font-weight: 800; }
      [data-composition-id="scene-00"] .sc-diff .cell .v { font-size: 27px; font-weight: 600; color: var(--k-text-2); }
      [data-composition-id="scene-00"] .sc-diff .lab { flex: none; font-size: 28px; font-weight: 800; color: var(--k-text-2); }

      [data-composition-id="scene-00"] .poster-cover { position:absolute; inset:0; display:grid; place-items:center; background:#F4F1E8; background-image:linear-gradient(#e9e3d7 1px,transparent 1px),linear-gradient(90deg,#e9e3d7 1px,transparent 1px); background-size:64px 64px; }
      [data-composition-id="scene-00"] .poster-card { position:relative; width:1792px; height:952px; overflow:hidden; box-sizing:border-box; border:2px solid #dedbcf; border-radius:36px; background:#FCFAF7; }
      [data-composition-id="scene-00"] .poster-copy { position:absolute; left:64px; top:82px; z-index:1; width:1020px; color:#1D3028; }
      [data-composition-id="scene-00"] .poster-kicker { color:#1C624B; font-size:34px; font-weight:800; letter-spacing:.025em; text-transform:uppercase; }
      [data-composition-id="scene-00"] .poster-rule { width:120px; height:7px; margin-top:23px; border-radius:4px; background:#9A6500; }
      [data-composition-id="scene-00"] .poster-heading { margin-top:94px; font-size:102px; font-weight:800; line-height:1.03; letter-spacing:-.025em; }
      [data-composition-id="scene-00"] .poster-sub { margin-top:27px; color:#1C624B; font-size:52px; font-weight:700; line-height:1.18; }
      [data-composition-id="scene-00"] .poster-prev { position:absolute; left:64px; bottom:380px; z-index:1; max-width:1020px; color:#1D3028; font-size:34px; font-weight:600; }
      [data-composition-id="scene-00"] .poster-prev b { color:#1C624B; }
      [data-composition-id="scene-00"] .poster-art { position:absolute; right:65px; top:240px; width:700px; }
      [data-composition-id="scene-00"] .poster-art svg { width:100%; height:auto; }
    </style>
    <script>
      (function () {
        const S = Kit.scene("00"), t = S.t, DUR = 25.6;
        const read = (text, at, off, reveal = 0.6) => {
          const needed = text.trim().split(/\s+/).filter((word) => /[\p{L}\p{N}]/u.test(word)).length / 3 + 1;
          if (off - at - reveal < needed - 1e-6) throw new Error(`Недостаточно времени для «${text}»`);
        };
        if (DUR - S.speechEnd < 1.5) throw new Error("Недостаточный хвост сцены");
        const hide = (...els) => els.forEach((el) => gsap.set(el, { autoAlpha: 0 }));

        Kit.header(S, { header: { mode: "parts", total: 3 }, chapter: "Полный — ещё не принятый", step: null, mode: "intro", duration: DUR,
          parts: [{ n: 1, blank: true, at: 0 }] });

        /* Открывающий титул + плашка «Перед этим» */
        const sT = S.stage(); sT.style.zIndex = "55"; gsap.set(sT, { autoAlpha: 1 });
        S.root.querySelectorAll(".k-header, .k-header *, .k-part, .k-part *").forEach((el) => el.setAttribute("data-layout-allow-occlusion", ""));
        const cover = document.createElement("div");
        cover.className = "poster-cover";
        cover.innerHTML = '<div class="poster-card"><div class="poster-copy"><div class="poster-kicker">Шаг 4</div><div class="poster-rule"></div><div class="poster-heading">Намерение и план</div><div class="poster-sub">Проверка и одобрение</div></div><div class="poster-prev"><b>Перед этим</b> посмотрите «План изменений»</div><div class="poster-art"></div></div>';
        const art = cover.querySelector(".poster-art");
        art.innerHTML = window.SKETCHES["ch-computer"];
        art.querySelectorAll("path").forEach((path) => {
          const colors = { "#eef0f3": "#1D3028", "#8e96a3": "#84938A", "#a3a9b4": "#84938A", "#ff7a59": "#9A6500", "#3ccf91": "#1C624B" };
          path.setAttribute("stroke", colors[path.getAttribute("stroke")] || "#1D3028");
          path.style.strokeDasharray = "none";
          path.style.strokeDashoffset = "0";
        });
        sT.appendChild(cover);
        const T_OPEN = t("Черновик записи полон");
        S.tl.to(sT, { autoAlpha: 0, duration: 0.4, ease: "none" }, T_OPEN - 0.4);

        const s1 = S.stage();
        S.tl.set(s1, { autoAlpha: 1 }, T_OPEN - 0.05);

        /* Полная запись: все разделы заполнены, но ещё не принята */
        const doc = Kit.aside(S, { parent: s1, x: 96, y: 225, w: 720, h: 325, tail: false,
          html: '<div class="sc-doc"><div class="cap">Запись намерения <span class="tag">черновик</span></div>' +
            '<div class="secs"><span class="s">проблема</span><span class="s">результат</span><span class="s">признаки успеха</span>' +
            '<span class="s">границы</span><span class="s">открытые вопросы</span><span class="s">план изменений</span><span class="s">риски</span></div>' +
            '<div class="sc-stamp">ещё не принят</div></div>' });
        const secs = doc.el.querySelectorAll(".s"), stamp = doc.el.querySelector(".sc-stamp");
        hide(...secs, stamp);
        doc.show(T_OPEN);
        S.tl.to(secs, { autoAlpha: 1, duration: 0.35, stagger: 0.12 }, t("разделы заполнены"));
        Kit.popIn(S, stamp, t("ещё не принят"));
        read("Запись намерения черновик проблема результат признаки успеха границы открытые вопросы план изменений риски", T_OPEN, DUR);
        read("ещё не принят", t("ещё не принят"), DUR, 0);

        /* Три события → вход курса анализа */
        const fl = Kit.aside(S, { parent: s1, x: 856, y: 225, w: 560, h: 325, tail: false,
          html: '<div class="sc-flow"><div class="cap">Этот ролик</div>' +
            '<div class="st f1"><span class="n">1</span>две проверки</div>' +
            '<div class="st f2"><span class="n">2</span>одно одобрение</div>' +
            '<div class="st f3"><span class="n">3</span>запись передачи</div>' +
            '<div class="st out f4"><span class="n">→</span>вход курса анализа</div></div>' });
        const fels = [".f1", ".f2", ".f3", ".f4"].map((c) => fl.el.querySelector(c));
        hide(...fels);
        fl.show(t("Этот ролик"));
        Kit.popIn(S, fels[0], t("две проверки"));
        Kit.popIn(S, fels[1], t("одно одобрение"));
        Kit.popIn(S, fels[2], t("запись передачи"));
        Kit.popIn(S, fels[3], t("входом курса анализа"));
        read("Этот ролик две проверки одно одобрение запись передачи вход курса анализа", t("Этот ролик"), DUR);

        /* Скетч: ветка и слияние */
        Kit.sketch(S, { parent: s1, name: "merge", x: 1460, y: 235, w: 360, at: T_OPEN + 0.2, dur: 2.8 });

        /* Разница проверок */
        const df = Kit.aside(S, { parent: s1, x: 96, y: 575, w: 1728, h: 110, tail: false,
          html: '<div class="sc-diff"><span class="lab">разница простая:</span>' +
            '<div class="cell d1"><span class="k">автоматическая проверка</span><span class="v">видит форму</span></div>' +
            '<div class="cell d2"><span class="k">человек</span><span class="v">видит смысл</span></div></div>' });
        const dc = [".d1", ".d2"].map((c) => df.el.querySelector(c));
        hide(...dc);
        df.show(t("автоматическая проверка") - 0.3);
        Kit.popIn(S, dc[0], t("автоматическая проверка"));
        Kit.popIn(S, dc[1], t("человек"));
        read("разница простая автоматическая проверка видит форму человек видит смысл", t("автоматическая проверка") - 0.3, DUR);
        S.tl.to(df.el, { borderColor: Kit.token("--k-accent"), duration: 0.5 }, t("Начинаем с разницы"));

        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
