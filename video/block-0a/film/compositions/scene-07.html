<template id="scene-07-template">
  <div data-composition-id="scene-07" data-width="1920" data-height="1080" data-duration="11.7">
    <style>
      [data-composition-id="scene-07"] .sc-panel { position: absolute; left: 1304px; width: 520px; height: 240px; }
      [data-composition-id="scene-07"] .sc-sum { position: absolute; left: 1304px; top: 712px; width: 520px; display: flex; align-items: center; gap: 20px; padding: 16px 26px; border: 2px solid var(--k-ok); border-radius: 24px; background: var(--k-ok-tint); color: var(--k-ok); font-size: 36px; font-weight: 700; line-height: 1.15; }
      [data-composition-id="scene-07"] .sc-sum svg { flex: none; width: 48px; height: 48px; }
    </style>
    <!-- запись: производная scene-07-merge.retimed.mp4 (assets/rec/retime-scene-07.py: ход 1x, без вырезов); data-start — число из скрипта.
         Терминал внизу записи (там команда с fast-forward) камерой за кадром. -->
    <video id="rec-merge" class="clip" src="assets/rec/scene-07-merge.retimed.mp4" muted playsinline data-start="0.89" data-duration="10.81"></video>
    <script>
      (function () {
        const S = Kit.scene("07");
        const t = S.t;
        const R = Kit.layout;
        const DUR = 11.7;
        const NAT = { w: 1920, h: 1080 };
        const WIN = { x: 96, y: 186, w: 1180, h: 635 };

        Kit.header(S, { duration: DUR });

        /* слева: запись; камера держит только верх окна (документ), терминал не попадает в кадр */
        const scr = Kit.screen(S, { parent: S.root, natural: NAT, ...WIN, alt: "Кадр VS Code: строка границы в intent.md до и после объединения",
          video: { el: "#rec-merge", start: 0.89, duration: 10.81, poster: "assets/rec/scene-07-merge.retimed.first.png" },
          camera: [{ t: 0, cx: 970, cy: 265, scale: 1.7, dur: 0, protect: [{ x: 440, y: 75, w: 1060, h: 380 }] }] });   // все строки документа целиком
        scr.show(0, true);

        /* справа: два исхода одной ветки */
        const GX = R.rightX + 24, LW = 472;
        const panel = (y, at, slide) => {
          const p = document.createElement("div"); p.className = "k-card sc-panel"; p.style.top = y + "px"; S.root.appendChild(p);
          gsap.set(p, { autoAlpha: 0 });
          if (slide) S.tl.fromTo(p, { x: 90, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.7, ease: "power3.out", immediateRender: false }, at);
          else Kit.popIn(S, p, at);
          return p;
        };
        const lanes = (feat) => [{ id: "main", label: "main", color: "var(--k-git-main)", y: 40 }, { id: "feat", label: "ветка", color: feat, y: 160 }];

        // 1. подошёл: ветка возвращается в main (стрелка Merge, затем точка в main)
        const tP1 = 1.95, tMerge = t("Мёрдж");
        const p1 = panel(190, tP1, true);
        const g1 = Kit.gitGraph(S, { parent: S.root, x: GX, y: 214, w: LW, h: 200, labelW: 110, colW: 80, lanes: lanes("var(--k-git-feature)"),
          commits: [
            { id: "c1", lane: "main", col: 0, at: tP1 + 0.3 }, { id: "c2", lane: "main", col: 1, at: tP1 + 0.45 },
            { id: "f1", lane: "feat", col: 1.6, at: tP1 + 0.6 }, { id: "f2", lane: "feat", col: 2.4, at: tP1 + 0.75 },
            { id: "m", lane: "main", col: 2.75, at: t("изменения") } ],
          edges: [
            { from: "c1", to: "c2", at: tP1 + 0.4, color: "var(--k-git-main)" },
            { from: "c2", to: "f1", at: tP1 + 0.55, color: "var(--k-git-feature)" },
            { from: "f1", to: "f2", at: tP1 + 0.7, color: "var(--k-git-feature)" },
            { from: "c2", to: "m", at: t("изменения") + 0.05, color: "var(--k-git-main)" } ],
          arrows: [{ from: { id: "f2" }, to: { id: "m" }, label: "Merge", at: tMerge, color: "var(--k-ok)" }] });
        gsap.set(g1.svg, { autoAlpha: 0 }); S.tl.set(g1.svg, { autoAlpha: 1 }, tP1);

        // 2. не подошёл: та же ветка серая, стрелки нет, main прежний
        const tNo = t("Не подошёл");
        panel(450, tNo, false);
        const g2 = Kit.gitGraph(S, { parent: S.root, x: GX, y: 474, w: LW, h: 200, labelW: 110, colW: 80, lanes: lanes("var(--k-text-2)"),
          commits: [
            { id: "c1", lane: "main", col: 0, at: tNo + 0.3 }, { id: "c2", lane: "main", col: 1, at: tNo + 0.4 },
            { id: "f1", lane: "feat", col: 1.6, at: tNo + 0.55 }, { id: "f2", lane: "feat", col: 2.4, at: tNo + 0.65 } ],
          edges: [
            { from: "c1", to: "c2", at: tNo + 0.35, color: "var(--k-git-main)" },
            { from: "c2", to: "f1", at: tNo + 0.5, color: "var(--k-text-2)" },
            { from: "f1", to: "f2", at: tNo + 0.6, color: "var(--k-text-2)" } ] });
        gsap.set(g2.svg, { autoAlpha: 0 }); S.tl.set(g2.svg, { autoAlpha: 1 }, tNo);

        S.tl.to([p1, g1.svg], { opacity: 0.4, duration: 0.4, ease: "power2.out" }, tNo); // первый исход гаснет, когда речь о втором

        // итог одной строкой: main цел
        const sum = document.createElement("div");
        sum.className = "sc-sum";
        sum.innerHTML = '<svg viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 29l12 12 24-26"/></svg><span>main цел</span>';
        S.root.appendChild(sum);
        gsap.set(sum, { autoAlpha: 0 });
        Kit.popIn(S, sum, t("основной") + 0.15);

        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
