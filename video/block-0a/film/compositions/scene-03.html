<template id="scene-03-template">
  <div data-composition-id="scene-03" data-width="1920" data-height="1080" data-duration="20.6">
    <style>
      [data-composition-id="scene-03"] .sc-mono { display: inline-block; font-family: var(--k-font-mono); font-size: 40px; font-weight: 700; padding: 6px 16px; border-radius: 12px; background: var(--k-accent-tint); color: var(--k-accent-soft); }
      [data-composition-id="scene-03"] .sc-cap2 { margin-top: 12px; font-size: var(--k-fs-label); font-weight: 500; color: var(--k-text-2); line-height: 1.3; }
      [data-composition-id="scene-03"] .sc-neq { font-size: 72px; font-weight: 700; line-height: 1; text-align: center; color: var(--k-accent-soft); }
      [data-composition-id="scene-03"] .sc-quote { font-size: 40px; font-weight: 700; line-height: 1.25; letter-spacing: -0.01em; }
      [data-composition-id="scene-03"] .sc-done { display: flex; align-items: center; gap: 18px; font-size: 38px; font-weight: 700; letter-spacing: -0.01em; color: var(--k-ok); }
      [data-composition-id="scene-03"] .sc-done i { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--k-ok); }
    </style>
    <!-- записи: производные scene-03-*.v3.retimed.mp4 (assets/rec/retime-scene-03.py печатает data-start и длительность; kit сверяет числа с video.start/duration).
         data-duration больше длины файла: после конца записи держится последний кадр, пока окно на экране. -->
    <video id="rec-init" class="clip" src="assets/rec/scene-03-init.v3.retimed.mp4" muted playsinline data-start="0.85" data-duration="10.0"></video>
    <video id="rec-commit" class="clip" src="assets/rec/scene-03-commit.v3.retimed.mp4" muted playsinline data-start="9.11" data-duration="11.97"></video>
    <script>
      (function () {
        const S = Kit.scene("03");
        const t = S.t;
        const R = Kit.layout;                          // правая колонка: R.rightX, R.rightW
        const NAT = { w: 1920, h: 1080 };
        const DUR = 20.6;
        // текст на экране держится не меньше слов/3 + 1 с
        const rd = (txt, a, b) => { const w = txt.trim().split(/\s+/).length; if (b - a < w / 3 + 1 - 1e-6) throw new Error(`текст «${txt}» на экране ${(b - a).toFixed(1)} с, нужно ${(w / 3 + 1).toFixed(1)} с`); };
        // курсор стоит над целью 1 с до клика: перед каждым кликом путевая точка (её пульсы убираются)
        const HOVER = 1.0;
        const withHover = (cl) => { const out = [], wp = []; cl.forEach((c) => { wp.push(out.length); out.push({ t: c.t - HOVER, x: c.x, y: c.y }); out.push(c); }); return { out, wp }; };
        const noPulse = (scr, hv) => { const pu = scr.layer.querySelectorAll(".k-pulse"); hv.wp.forEach((i) => { pu[2 * i].remove(); pu[2 * i + 1].remove(); }); };
        Kit.header(S, { duration: DUR });

        const s2 = S.stage(); gsap.set(s2, { autoAlpha: 1 });
        const T2 = t("Запись") - 0.4;                    // окно записи Commit входит поверх окна Initialize (то же место)

        /* кадр 1: Source Control и Initialize Repository (под заставкой окно уже стоит; клики — вывод retime-scene-03.py) */
        const hvA = withHover([{ t: 1.15, x: 37, y: 205, label: "Source Control" }, { t: 2.8, x: 370, y: 228, label: "Initialize Repository" }]);
        const scrA = Kit.screen(S, { parent: s2, natural: NAT, h: 581, alt: "VS Code: Source Control, кнопка Initialize Repository",
          video: { el: "#rec-init", start: 0.85, duration: 10.0, poster: "assets/rec/scene-03-init.v3.retimed.first.png", clicks: hvA.out },
          from: { x: 37, y: 205 } });
        { // камера стоит на кнопках с первого кадра сцены (повторяет расчёт Kit.screen для cx 330, cy 262, масштаб 2,1)
          const k = scrA.b * 2.1;
          gsap.set(scrA.layer, { scale: k, x: Math.min(0, Math.max(scrA.vw - k * NAT.w, scrA.vw / 2 - k * 330)), y: Math.min(0, Math.max(scrA.vh - k * NAT.h, scrA.vh / 2 - k * 262)) });
        }
        noPulse(scrA, hvA);
        scrA.layer.setAttribute("data-layout-allow-overflow", "");
        scrA.show(0, true);
        scrA.hide(T2 + 0.6);

        /* кадр 2: Stage, сообщение, Commit */
        const hvB = withHover([{ t: 1.79, x: 609, y: 292, label: "Stage" }, { t: 3.84, x: 382, y: 163, label: "Message" }, { t: 7.49, x: 363, y: 219, label: "Commit" }]);
        const scrB = Kit.screen(S, { parent: s2, natural: NAT, h: 581, alt: "VS Code: Stage, сообщение, Commit",
          video: { el: "#rec-commit", start: 9.11, duration: 11.97, poster: "assets/rec/scene-03-commit.v3.retimed.first.png", clicks: hvB.out },
          from: { x: 609, y: 292 },
          camera: [{ t: T2 - 0.6, cx: 400, cy: 230, scale: 2.4, dur: 0.4 }] });
        noPulse(scrB, hvB);
        scrB.layer.setAttribute("data-layout-allow-overflow", "");
        scrB.show(T2);

        /* правая колонка: по одной карточке, прежняя гаснет до появления новой */
        const card = (o, y, at, off) => { const a = Kit.aside(S, Object.assign({ parent: s2, x: R.rightX, y, w: R.rightW, tail: false }, o)); a.show(at); if (off != null) a.hide(off); return a; };
        // .git: служебная история, пока пустая
        card({ html: `<div class="sc-mono">.git</div><div class="sc-cap2">история, пока пустая</div>` }, 300, t("Появится"), S.end("пустая") + 0.05);
        rd(".git история, пока пустая", t("Появится"), S.end("пустая") + 0.05);
        // сохранить файл ≠ записать версию
        const keys = `<div class="k-keys"><div class="k-cap">Ctrl/Cmd</div><span class="k-plus">+</span><div class="k-cap">S</div></div><div class="sc-cap2">файл</div>`;
        const T_PAIR_OFF = t("действия") + 0.35;
        card({ html: keys }, 270, t("Сохранить"), T_PAIR_OFF);
        const neq = document.createElement("div"); neq.className = "sc-neq"; neq.textContent = "≠";
        neq.style.cssText = `position:absolute;left:${R.rightX}px;top:468px;width:${R.rightW}px;`; s2.appendChild(neq); gsap.set(neq, { autoAlpha: 0 });
        Kit.popIn(S, neq, t("разные") - 0.2); Kit.popOut(S, neq, T_PAIR_OFF);
        card({ html: `<div class="sc-mono">Commit</div><div class="sc-cap2">версия</div>` }, 560, t("записать"), T_PAIR_OFF);
        rd("Ctrl/Cmd+S файл ≠ Commit версия", t("Сохранить"), T_PAIR_OFF);
        // Commit: запись версии
        card({ title: "Commit", text: "запись версии" }, 300, t("Запись"), t("Напишите") - 0.2);
        rd("Commit запись версии", t("Запись"), t("Напишите") - 0.2);
        // причина версии
        const T_REASON_OFF = t("Теперь") - 0.15;
        card({ title: "Причина версии" }, 270, t("Напишите"), T_REASON_OFF);
        card({ html: `<div class="sc-quote">«Первая версия intent»</div>` }, 410, t("Первая"), T_REASON_OFF);
        rd("«Первая версия intent»", t("Первая"), T_REASON_OFF);
        // результат: одна запись в истории, зелёным
        const done = Kit.aside(S, { parent: s2, x: R.rightX, y: 300, w: R.rightW, tail: false, html: `<div class="sc-done"><i></i><span>Первая версия intent</span></div>` });
        done.show(t("Теперь"));
        rd("Первая версия intent", t("Теперь"), DUR);

        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
