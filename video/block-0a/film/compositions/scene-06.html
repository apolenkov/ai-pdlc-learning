<template id="scene-06-template">
  <div data-composition-id="scene-06" data-width="1920" data-height="1080" data-duration="16.3">
    <style>
      [data-composition-id="scene-06"] .sc-panel { position: absolute; left: 1304px; top: 200px; width: 520px; height: 300px; }
    </style>
    <!-- записи: производные scene-06-branch.retimed.mp4 и scene-06-switch.retimed.mp4 (assets/rec/retime-scene-06.py: ход 1x, держит кадр между действиями, без вырезов).
         data-start — числа из скрипта; после конца файла держится последний кадр. -->
    <video id="rec-branch" class="clip" src="assets/rec/scene-06-branch.retimed.mp4" muted playsinline data-start="3.10" data-duration="10.2"></video>
    <video id="rec-switch" class="clip" src="assets/rec/scene-06-switch.retimed.mp4" muted playsinline data-start="11.96" data-duration="4.4"></video>
    <script>
      (function () {
        const S = Kit.scene("06");
        const t = S.t;
        const R = Kit.layout;
        const DUR = 16.3;
        const NAT = { w: 1920, h: 1080 };
        const HOVER = 0.8;   // курсор задерживается над целью до нажатия
        const withHover = (cl) => { const out = [], wp = []; cl.forEach((c) => { wp.push(out.length); out.push({ t: c.t - HOVER, x: c.x, y: c.y }); out.push(c); }); return { out, wp }; };
        const noPulse = (scr, hv) => { const pu = scr.layer.querySelectorAll(".k-pulse"); hv.wp.forEach((i) => { pu[2 * i].remove(); pu[2 * i + 1].remove(); }); };
        const WIN = { x: 96, y: 186, w: 1180, h: 635 };
        // текст intent.md в записи: x 440..1500, y 40..455 (с выпадающим списком веток сверху)
        const DOC = { cx: 970, cy: 250, scale: 1.7, protect: [{ x: 440, y: 40, w: 1060, h: 415 }] };

        Kit.header(S, { duration: DUR });

        /* моменты сцены */
        const T_SW1 = 3.2;            // конец плана 1: вопрос про границу (после «текст?»)
        const T_SW2 = 12.3;           // конец записи создания ветки (правка напечатана)
        const T_EDIT = t("Правьте");  // клик по строке с границей

        /* ---- план 1: вопрос — какая строка документа меняется ---- */
        const s1 = S.stage(); gsap.set(s1, { autoAlpha: 1 });
        const ed = Kit.editor(S, { parent: s1, x: WIN.x, y: WIN.y, w: WIN.w, crumb: "intent.md", tabs: [{ name: "intent.md", active: true }],
          lines: ["## Границы", "- Меняется только выгрузка в продукте A.", "- Продукт В не затронут.", "- Пустой результат выгружается файлом только с заголовками столбцов."] });
        ed.show(1.95); ed.reveal(0, 3, 1.95); ed.mark(3, 2.25);

        /* ---- план 2: запись создания ветки ---- */
        const s2 = S.stage();
        const hvA = withHover([
          { t: 1.13, x: 80, y: 1061, label: "main" },
          { t: 2.78, x: 961, y: 97, label: "Create new branch" },
          { t: 7.3, x: 1576, y: 324 },
        ]);
        const scrA = Kit.screen(S, { parent: s2, natural: NAT, ...WIN, alt: "Кадр VS Code: переключатель веток в строке состояния, Create new branch, правка строки",
          video: { el: "#rec-branch", start: 3.10, duration: 10.2, poster: "assets/rec/scene-06-branch.retimed.first.png", clicks: hvA.out },
          from: { x: 300, y: 900 },
          camera: [
            // один план на весь документ: строки целиком, список веток над ним тоже в кадре (ревью Opus: срезанные строки)
            { t: 0, ...DOC, dur: 0 },
          ] });
        noPulse(scrA, hvA);
        scrA.show(T_SW1 + 0.5);

        /* ---- план 3: возвращаемся на main, прежний текст на месте ---- */
        const s3 = S.stage();
        const hvB = withHover([
          { t: 1.14, x: 121, y: 1061, label: "Branch" },
          { t: 2.76, x: 961, y: 190, label: "main" },
        ]);
        const scrB = Kit.screen(S, { parent: s3, natural: NAT, ...WIN, alt: "Кадр VS Code: переключение на main, прежняя строка границы",
          video: { el: "#rec-switch", start: 11.96, duration: 4.4, poster: "assets/rec/scene-06-switch.retimed.first.png", clicks: hvB.out },
          from: { x: 300, y: 900 },
          camera: [
            { t: 0, ...DOC, dur: 0 },
          ] });
        noPulse(scrB, hvB);
        scrB.show(T_SW2 + 0.5);

        Kit.stageOut(S, s1, T_SW1); Kit.stageIn(S, s2, T_SW1 + 0.5);
        Kit.stageOut(S, s2, T_SW2); Kit.stageIn(S, s3, T_SW2 + 0.5);

        /* ---- справа: линия main и ответвление (схема не меняется между планами) ---- */
        const panel = document.createElement("div");
        panel.className = "k-card sc-panel";
        S.root.appendChild(panel);
        gsap.set(panel, { autoAlpha: 0 });
        const tPanel = t("основной");
        S.tl.fromTo(panel, { x: 90, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.7, ease: "power3.out", immediateRender: false }, tPanel);

        const GX = R.rightX + 24, GY = 232;
        const g = Kit.gitGraph(S, { parent: S.root, x: GX, y: GY, w: 472, h: 240, labelW: 110, colW: 80,
          lanes: [{ id: "main", label: "main", color: "var(--k-git-main)", y: 60 }, { id: "feat", label: "ветка", color: "var(--k-git-feature)", y: 180 }],
          commits: [
            { id: "c1", lane: "main", col: 0, at: tPanel + 0.35 },
            { id: "c2", lane: "main", col: 1, at: tPanel + 0.65 },
            { id: "f1", lane: "feat", col: 2, at: t("линию") + 0.35 },
            { id: "f2", lane: "feat", col: 3, at: t("сохраняйте") } ],
          edges: [
            { from: "c1", to: "c2", at: tPanel + 0.5, color: "var(--k-git-main)" },
            { from: "c2", to: "f1", at: t("отдельную") + 0.3, color: "var(--k-git-feature)" },
            { from: "f1", to: "f2", at: t("сохраняйте") - 0.1, color: "var(--k-git-feature)" } ] });

        gsap.set(g.svg, { autoAlpha: 0 });
        S.tl.set(g.svg, { autoAlpha: 1 }, tPanel);
        // main не меняется: кольцо на последней точке main и замок на конце линии
        const NS = "http://www.w3.org/2000/svg";
        const mkSvg = (tag, attrs) => { const e = document.createElementNS(NS, tag); Object.keys(attrs).forEach((k) => e.setAttribute(k, attrs[k])); g.svg.appendChild(e); return e; };
        const P2 = g.pos.c2;
        const ring = mkSvg("circle", { cx: P2.x, cy: P2.y, r: 17, fill: "none", stroke: "var(--k-git-main)", "stroke-width": 4 });
        gsap.set(ring, { opacity: 0 });
        S.tl.fromTo(ring, { opacity: 0.95, attr: { r: 17 } }, { opacity: 0, attr: { r: 40 }, duration: 0.9, ease: "power2.out", immediateRender: false }, t("мэйн"));
        const LX = 442, LY = P2.y;
        const lock = mkSvg("g", {});
        [["rect", { x: LX - 15, y: LY - 4, width: 30, height: 24, rx: 5, fill: "var(--k-panel)", stroke: "var(--k-git-main)", "stroke-width": 4 }],
         ["path", { d: `M${LX - 9} ${LY - 4}v-8a9 9 0 0 1 18 0v8`, fill: "none", stroke: "var(--k-git-main)", "stroke-width": 4, "stroke-linecap": "round" }]]
          .forEach(([tag, a]) => { const e = document.createElementNS(NS, tag); Object.keys(a).forEach((k) => e.setAttribute(k, a[k])); lock.appendChild(e); });
        gsap.set(lock, { opacity: 0 });
        const tLock = t("она не меняется");
        S.tl.fromTo(lock, { opacity: 0, scale: 0.3, svgOrigin: `${LX} ${LY}` }, { opacity: 1, scale: 1, svgOrigin: `${LX} ${LY}`, duration: 0.5, ease: "back.out(2)", immediateRender: false }, tLock);
        // main по-прежнему цел: замок вздрагивает, когда на main виден прежний текст
        S.tl.fromTo(lock, { scale: 1, svgOrigin: `${LX} ${LY}` }, { scale: 1.3, svgOrigin: `${LX} ${LY}`, duration: 0.25, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, 15.35);

        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
