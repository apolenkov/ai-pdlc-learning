<template id="scene-05-template">
  <div data-composition-id="scene-05" data-width="1920" data-height="1080" data-duration="11.7">
    <script>
      (function () {
        const L = Long.begin("05"), { S, tl, el, show, hide, at, t, DUR } = L;
        // сцена 5 · Справка · камера Y 1380 (s 1,1) → полоса PDLC; финальный кадр держится до конца
        const { R } = PageWin;
        const W = PageWin.begin(L, { cam: { Y: 1380, s: 1.1 }, spot: R.help });
        const HDR = [1380, R.help.y + 48], C = R.helpCards;
        W.call("Справка", { to: HDR, side: "center", at: t("справка"), until: t("маркдаун") - 0.25 });
        const STEPS = [["маркдаун", "Git с нуля"], ["роли", "Роли"], ["глоссарий", "Глоссарий"], ["ресурсы", "Ресурсы"]];
        const T = STEPS.map(([w]) => t(w)), go = t("Начните");
        STEPS.forEach(([, label], i) => {
          const until = (T[i + 1] ?? go) - 0.2;
          W.ring(C[i], T[i], until);
          W.call(label, { to: HDR, side: "center", at: T[i] + 0.05, until: until - 0.05 });
        });
        // «начните с карты этапов и найдите свой»: назад к полосе, первый этап пульсирует
        W.moveCam(go, 1.3, { Y: 200, s: 1.15 }, "power3.inOut");
        W.hopSpot(R.sdlc, go, go + 1.1);
        W.call("Найдите свой этап", { to: [1420, R.sdlc.y + 32], side: "center", at: go + 1.2 });
        W.ring(R.nodes[0], go + 1.3, null, "round");
        const pulse = W.ring(PageWin.grow(R.nodes[0], 6), go + 1.6, DUR - 0.6, "round");
        tl.to(pulse, { scale: 1.15, autoAlpha: 0, duration: 0.6, ease: "power1.out", transformOrigin: "50% 50%" }, go + 1.9);
        L.fin();
      })();
    </script>
  </div>
</template>
