<template id="scene-10-template">
  <div data-composition-id="scene-10" data-width="1920" data-height="1080" data-duration="29.2">
    <script>
      (function () {
        const L = Long.begin("10"), { S, tl, el, show, hide, at, t, DUR } = L;
        const T = Team.use(L);
        T.title("Путь к <span>самостоятельности</span>");
        T.plates([["Не по календарю, а по готовности", 0.4], ["Решение владельца метода", t("Выход из") - 0.1, "acc"], ["Итоговая встреча — решение о тираже", t("Итоговая") - 0.1, "info"]]);
        const M = [
          ["Старт", "Согласуем условия и фиксируем исходный уровень", t("Старт"), "info"],
          ["Первые задачи", "Проходим реальные задачи с коучем и проверяем выходы этапов", t("Первые"), "info"],
          ["Выход из сопровождения", "После аудита и отдельного решения владельца метода", t("Выход из"), "acc"],
          ["Итоговая встреча", "Решение о тираже по результатам и аудитам", t("Итоговая"), "info"],
          ["Проверки после выхода", "Подтверждают решение; если результат не удержан, решение пересматриваем", t("Проверки"), "ok"],
        ];
        const PITCH = 1728 / 5;
        const nodes = M.map(([h, , w, tone], i) => {
          const cx = 96 + PITCH * (i + 0.5);
          const n = el("tm-node " + tone, '<div class="c">' + (i + 1) + "</div>"); n.style.left = cx - 114 + "px"; n.style.top = "250px";
          T.show(n, 0.4 + 0.15 * i, cx);
          if (i < 4) { const b = el("tm-bar", null); b.style.left = cx + 56 + "px"; b.style.width = PITCH - 112 + "px"; b.style.top = "292px"; T.fadeIn(b, 0.5 + 0.15 * i, 0); }
          return n;
        });
        const cards = M.map(([h, s, w, tone], i) => {
          const x = 96 + i * (324 + 27);
          return T.card({ x, y: 400, w: 324, hgt: 470, tone, html: "<h4 style=\"font-size:30px\">" + h + "</h4><p style=\"font-size:28px\">" + s + "</p>" }, w - 0.1);
        });
        L.focus(cards, M.map((m) => m[2]), DUR - 1.4, { color: "acc" });
        L.fin();
      })();
    </script>
  </div>
</template>
