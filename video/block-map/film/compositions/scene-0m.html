<template id="scene-0m-template">
  <div data-composition-id="scene-0m" data-width="1920" data-height="1080" data-duration="17.3">
    <style>
      [data-composition-id="scene-0m"] .greeting { width: 100%; height: 100%; padding: 160px 160px 270px; display: flex; flex-direction: column; gap: 28px; color: var(--k-text); font-family: var(--k-font-sans); }
      [data-composition-id="scene-0m"] .greeting-team { color: var(--k-accent-soft); font-size: 38px; font-weight: 600; }
      [data-composition-id="scene-0m"] h1 { max-width: 1560px; font-size: 88px; line-height: 1.14; letter-spacing: -0.025em; font-weight: 800; }
      [data-composition-id="scene-0m"] .greeting-route { display: flex; gap: 28px; margin-top: 48px; }
      [data-composition-id="scene-0m"] .greeting-part { flex: 1; display: flex; align-items: center; gap: 18px; border-top: 3px solid var(--k-line); padding-top: 24px; font-size: 40px; font-weight: 650; }
      [data-composition-id="scene-0m"] .greeting-dot { width: 18px; height: 18px; border: 3px solid var(--k-accent); border-radius: 50%; flex: none; }
    </style>
    <div class="greeting">
      <div class="greeting-team">Команда развития процессов AI PDLC</div>
      <h1>Учебный маршрут анализа CustomDev</h1>
      <div class="greeting-route">
        <div class="greeting-part"><span class="greeting-dot"></span>Подготовка</div>
        <div class="greeting-part"><span class="greeting-dot"></span>Практика</div>
        <div class="greeting-part"><span class="greeting-dot"></span>Разработка</div>
      </div>
    </div>
    <script>
      (function () {
        const S = Kit.scene("0m"), t = S.t, DUR = 17.3;
        // The title, team and date are readable from frame zero; only route groups enter on speech.
        S.root.querySelectorAll(".greeting-part").forEach((part, i) => {
          gsap.set(part, { autoAlpha: 0 });
          S.tl.to(part, { autoAlpha: 1, duration: 0.4, ease: "sine.out" }, t(["подготовка", "практика", "разработка"][i]));
        });
        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
