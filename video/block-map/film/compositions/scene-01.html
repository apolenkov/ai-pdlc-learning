<template id="scene-01-template">
  <div data-composition-id="scene-01" data-width="1920" data-height="1080" data-duration="22.2">
    <style>
      [data-composition-id="scene-01"] .sc-mark { position: absolute; box-sizing: border-box; border: 3px solid var(--k-accent); border-radius: 10px; pointer-events: none; }
    </style>
    <script>
      (function () {
        const S = Kit.scene("01"), t = S.t, DUR = 22.2;
        if (DUR - S.speechEnd < 1.5) throw new Error("Недостаточный хвост сцены");

        Kit.header(S, { header: { mode: "parts", total: 5 }, chapter: "Что на карте", step: 1, duration: DUR, parts: [{ n: 1, blank: true, at: 0 }] });

        const s1 = S.stage(); gsap.set(s1, { autoAlpha: 1 });
        // Screenshot geometry: work/boxes.json; full first rows between neighbouring card borders.
        const CARD = { x: 736, y: 1224, w: 449, h: 290 };
        const FACTS = { gain: { x: 798, y: 1292, w: 371, h: 60 }, before: { x: 798, y: 1356, w: 371, h: 39 },
                        who: { x: 798, y: 1441, w: 371, h: 60 }, film: { x: 1107, y: 1237, w: 64, h: 24 } };
        const PREP = { cx: 960, cy: 1354, scale: 1.36 };
        const ROW = { cx: 960, cy: 1369, scale: 2.2 }; // одна карточка крупно: поля читаются
        const PRACTICE = { cx: 960, cy: 1979, scale: 1.36 };
        const DEV = { cx: 960, cy: 2800, scale: 1.36 };
        const GROUPS = [
          { x: 277, y: 1194, w: 131, h: 22 },
          { x: 277, y: 1808, w: 119, h: 22 },
          { x: 277, y: 2729, w: 119, h: 22 },
        ];
        const T_ROW = t("Каждая карточка");
        const scr = Kit.screen(S, { parent: s1, x: 60, y: 200, w: 1800, h: 790, natural: { w: 1920, h: 3200 },
          src: "assets/page/map.png", alt: "Карта курса: группы «Подготовка», «Шаги курса» и «Разработка»",
          camera: [
            { t: 0, ...PREP, dur: 0, protect: [{ x: 271, y: 1190, w: 1378, h: 330 }] },
            { t: t("Шаги курса —") - 1, ...PRACTICE, dur: 1, ease: "sine.inOut", protect: [{ x: 271, y: 1808, w: 1378, h: 342 }] },
            { t: t("Разработка —") - 1, ...DEV, dur: 1, ease: "sine.inOut", protect: [{ x: 271, y: 2725, w: 1378, h: 330 }] },
            { t: T_ROW, ...ROW, dur: 1, ease: "sine.inOut", protect: [CARD] },
          ] });
        scr.show(0, true);

        const mark = (r, at, soft, padTop = 4, padBottom = padTop) => {
          const el = document.createElement("div"); el.className = "sc-mark";
          Object.assign(el.style, { left: r.x - 6 + "px", top: r.y - padTop + "px", width: r.w + 12 + "px", height: r.h + padTop + padBottom + "px" });
          if (soft) el.style.borderColor = Kit.token("--k-accent-soft");
          scr.layer.appendChild(el); gsap.set(el, { autoAlpha: 0 });
          S.tl.to(el, { autoAlpha: 1, duration: 0.5, ease: "sine.out" }, at);
          return el;
        };
        [["Подготовка идёт", t("Шаги курса —") - 1],
         ["Шаги курса —", t("Разработка —") - 1], ["Разработка —", T_ROW]].forEach(([word, off], i) => {
          const el = mark(GROUPS[i], t(word), false);
          S.tl.to(el, { autoAlpha: 0, duration: 0.2 }, off - 0.2);
        });
        mark(CARD, t("один гайд"), true);
        const order = [["gain", "что вы получите"], ["before", "что пройти раньше"], ["who", "для кого"], ["film", "сколько длится ролик"]];
        order.forEach(([k, w], i) => {
          const el = mark(FACTS[k], t(w) - 0.1, false, k === "before" ? 2 : 4, k === "gain" ? 2 : 4);
          const next = order[i + 1];
          if (next) S.tl.to(el, { opacity: 0, duration: 0.4 }, t(next[1]) - 0.1);
        });

        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
