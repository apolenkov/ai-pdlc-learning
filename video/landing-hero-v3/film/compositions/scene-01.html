<template id="scene-01-template">
  <div data-composition-id="scene-01" data-width="1920" data-height="1080" data-duration="9.5">
    <style>
      [data-composition-id="scene-01"] .h-h { position: absolute; left: 96px; top: 226px; width: 1180px; font-size: 84px; font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; }
      [data-composition-id="scene-01"] .h-rule { position: absolute; left: 96px; top: 470px; width: 132px; height: 6px; border-radius: 3px; background: var(--k-accent); }
    </style>
    <script>
      (function () {
        const S = Kit.scene("01"), DUR = 9.5;
        const tt = (w, d) => { try { return S.t(w); } catch (e) { return d; } };
        const el = (cls, html, x, y, w) => { const e = document.createElement("div"); e.className = cls; e.innerHTML = html; e.style.left = x + "px"; e.style.top = y + "px"; if (w) e.style.width = w + "px"; S.root.appendChild(e); return e; };
        const show = (e, at) => { (Array.isArray(e) ? e : [e]).forEach((x) => { gsap.set(x, { autoAlpha: 0 }); S.tl.fromTo(x, { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, at); }); };
        // Светлая карточка «Главная · AI PDLC» с названием команды — она же постер плеера; уходит к 3,3 с.
        People.poster(S, { kicker: "Главная · AI PDLC", title: "Команда развития процессов AI PDLC", sketch: { name: "intro-idea", x: 1010, y: 270, w: 760 }, until: 2.6, fade: 0.7 });
        // Тёмная сцена: подпись «Команда развития процессов AI PDLC»; человек за столом (intro-idea).
        const h = el("h-h", "Команда развития<br>процессов AI PDLC", 96, 226, 1180); show(h, 3.4);
        const r = el("h-rule", "", 96, 470); show(r, 3.45);
        const sk = Kit.sketch(S, { name: "intro-idea", x: 1010, y: 270, w: 760, at: tt("Помогаем", 3.52), dur: 2.9 });
        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
