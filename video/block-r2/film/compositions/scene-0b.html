<template id="scene-0b-template">
  <div data-composition-id="scene-0b" data-width="1920" data-height="1080" data-duration="25.9">
    <style>
      [data-composition-id="scene-0b"] .rb-tile { padding: 0; overflow: hidden; border-style: dashed; border-color: var(--k-seg-off-fg); background-color: rgba(0, 0, 0, 0); box-shadow: none; }
      [data-composition-id="scene-0b"] .rb-cont { position: absolute; inset: 0; padding: 22px 26px 24px; display: flex; flex-direction: column; gap: 12px; }
      [data-composition-id="scene-0b"] .rb-top { display: flex; align-items: center; justify-content: space-between; }
      [data-composition-id="scene-0b"] .rb-who { font-size: 30px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--k-text-2); }
      [data-composition-id="scene-0b"] .rb-ic { width: 52px; height: 52px; color: var(--k-text-2); }
      [data-composition-id="scene-0b"] .rb-ic svg { width: 100%; height: 100%; display: block; }
      [data-composition-id="scene-0b"] .rb-t { font-size: 46px; font-weight: 800; line-height: 1.1; letter-spacing: -0.01em; }
      [data-composition-id="scene-0b"] .rb-sub { font-size: 30px; font-weight: 500; line-height: 1.25; color: var(--k-text-2); }
      [data-composition-id="scene-0b"] .rb-chip { align-self: flex-start; padding: 8px 18px; border-radius: 16px; font-size: 30px; font-weight: 600; line-height: 1.25; border: 2px solid var(--k-line); }
      [data-composition-id="scene-0b"] .rb-chip.warm { border-color: var(--k-accent); background: var(--k-accent-tint); color: var(--k-accent-soft); }
      [data-composition-id="scene-0b"] .rb-chip.info { border-color: var(--k-text-2); color: var(--k-text-2); border-style: dashed; }
      [data-composition-id="scene-0b"] .rb-dots { display: flex; gap: 12px; margin-top: 6px; }
      [data-composition-id="scene-0b"] .rb-dot { width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--k-text-2); font-size: 28px; font-weight: 700; line-height: 46px; text-align: center; color: var(--k-text); }
      [data-composition-id="scene-0b"] .rb-marks { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
      [data-composition-id="scene-0b"] .rb-mk { width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--k-text-2); color: var(--k-text-2); display: flex; align-items: center; justify-content: center; }
      [data-composition-id="scene-0b"] .rb-mk svg { width: 30px; height: 30px; }
      [data-composition-id="scene-0b"] .rb-mkl { font-size: 30px; font-weight: 600; margin-left: 8px; }
      [data-composition-id="scene-0b"] .rb-arr { position: absolute; width: 69px; top: 410px; text-align: center; font-size: 60px; font-weight: 300; line-height: 1; color: var(--k-text-2); }
      [data-composition-id="scene-0b"] .rb-plaque { padding: 0 34px; display: flex; align-items: center; gap: 30px; white-space: nowrap; }
      [data-composition-id="scene-0b"] .rb-pl { font-size: 38px; font-weight: 600; color: var(--k-text-2); }
      [data-composition-id="scene-0b"] .rb-btn { font-family: var(--k-font-mono); font-size: 42px; font-weight: 700; padding: 6px 22px; border-radius: 14px; background: var(--k-accent-tint); border: 2px solid var(--k-accent); }
      [data-composition-id="scene-0b"] .rb-ok { font-size: 46px; font-weight: 800; color: var(--k-ok); }
    </style>
    <script>
      (function () {
        const S = Kit.scene("0b"), t = S.t, DUR = 25.9;
        // Count only fully revealed, stationary text; transitions do not count as reading time.
        const read = (text, at, off, reveal = 0.6) => {
          const needed = text.trim().split(/\s+/).filter((word) => /[\p{L}\p{N}]/u.test(word)).length / 3 + 1;
          if (off - at - reveal < needed - 1e-6) throw new Error(`Недостаточно времени для «${text}»`);
        };
        if (DUR - S.speechEnd < 1.5) throw new Error("Недостаточный хвост сцены");
        const hide = (...els) => els.forEach((el) => gsap.set(el, { autoAlpha: 0 }));
        const div = (cls, html, parent) => { const el = document.createElement("div"); el.className = cls; el.innerHTML = html; parent.appendChild(el); return el; };
        const PANEL = Kit.token("--k-panel"), WARM = Kit.token("--k-accent-tint"), ACC = Kit.token("--k-accent"), OK = Kit.token("--k-ok"), OKT = Kit.token("--k-ok-tint"), SHADOW = Kit.token("--k-shadow-card"), LINE = Kit.token("--k-line");
        const CHECK = '<svg viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 29l12 12 24-26"/></svg>';

        Kit.header(S, { header: { mode: "parts", total: 7 }, chapter: "Как меняется работа", step: null, mode: "intro", duration: DUR, parts: [{ n: 1, blank: true, at: 0 }] });

        const s1 = S.stage(); gsap.set(s1, { autoAlpha: 1 });
        const X = [96, 695, 1294], W = 530, Y = 260, H = 360;
        const tiles = [
          `<div class="rb-top"><span class="rb-who">Модель</span><span class="rb-ic">${Kit.icons.file}</span></div><div class="rb-t">Черновик модели</div><div class="rb-chip warm">быстро, но уверенно ошибается</div>`,
          `<div class="rb-top"><span class="rb-who">Вы</span><span class="rb-ic">${Kit.icons.check}</span></div><div class="rb-t">Пять вопросов</div><div class="rb-dots">${[1, 2, 3, 4, 5].map((n) => `<span class="rb-dot">${n}</span>`).join("")}</div>`,
          `<div class="rb-top"><span class="rb-who">Люди</span><span class="rb-ic">${Kit.icons.merge}</span></div><div class="rb-t">Запрос на слияние</div><div class="rb-sub">Merge Request · MR</div><div class="rb-marks"><span class="rb-mk">${CHECK}</span><span class="rb-mk">${CHECK}</span><span class="rb-mk">${CHECK}</span><span class="rb-mkl">одобрение людей</span></div><div class="rb-chip info">модель одобрить не может</div>`,
        ];
        const slotAt = [t("проверка"), t("идёт"), t("порядку")];
        const fillAt = [t("Модель готовит"), t("Вы проверяете"), t("правки") - 0.1];   // the third tile is in place before "Merge Request" is said
        const els = tiles.map((html, i) => {
          const a = Kit.aside(S, { parent: s1, x: X[i], y: Y, w: W, h: H, tail: false, html: `<div class="rb-cont">${html}</div>` });
          a.el.classList.add("rb-tile");
          const cont = a.el.querySelector(".rb-cont");
          gsap.set(cont, { autoAlpha: 0 });
          a.show(slotAt[i]);                                   // an empty slot first: the order is the point
          S.tl.set(a.el, { borderStyle: "solid", boxShadow: SHADOW }, fillAt[i]);
          S.tl.to(a.el, { backgroundColor: PANEL, borderColor: LINE, duration: 0.5 }, fillAt[i]);
          return { a, cont };
        });
        // three different ways in: slide, pop, blur-scale
        S.tl.fromTo(els[0].cont, { autoAlpha: 0, x: -70 }, { autoAlpha: 1, x: 0, duration: 0.7, ease: "power3.out", immediateRender: false }, fillAt[0] + 0.1);
        S.tl.fromTo(els[1].cont, { autoAlpha: 0, y: 40, scale: 0.94 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(2)", immediateRender: false }, fillAt[1] + 0.1);
        S.tl.fromTo(els[2].cont, { autoAlpha: 0, scale: 1.06, filter: "blur(14px)" }, { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out", immediateRender: false }, fillAt[2] + 0.1);

        // sub-parts of each tile arrive on their own phrase
        const q = (i, sel) => els[i].cont.querySelector(sel), qa = (i, sel) => Array.from(els[i].cont.querySelectorAll(sel));
        const T_CHIP = t("быстро,"), T_WARM = t("ошибается");
        hide(q(0, ".rb-chip")); Kit.popIn(S, q(0, ".rb-chip"), T_CHIP);
        S.tl.to(els[0].a.el, { borderColor: ACC, backgroundColor: WARM, duration: 0.6 }, T_WARM);
        const dots = qa(1, ".rb-dot"); hide(...dots);
        dots.forEach((d, i) => Kit.popIn(S, d, t("пяти") + i * 0.13, 0.45));
        const sub3 = q(2, ".rb-sub"), marks = qa(2, ".rb-mk"), mkl = q(2, ".rb-mkl"), badge = q(2, ".rb-chip");
        hide(sub3, ...marks, mkl, badge);
        Kit.popIn(S, sub3, t("запрос") - 0.05);
        marks.forEach((m, i) => Kit.popIn(S, m, t("оставляют") + i * 0.16, 0.45));
        Kit.popIn(S, mkl, t("одобрение") + 0.1);
        Kit.popIn(S, badge, t("а модель"));

        // arrows between the tiles
        [[626, t("Вы проверяете") - 0.1], [1225, t("Затем")]].forEach(([x, at]) => {
          const ar = div("rb-arr", "→", s1); ar.style.left = x + "px"; hide(ar);
          S.tl.fromTo(ar, { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, at);
        });

        // the plan for this guide: one rule, one accepted version
        const T_PL = t("одном правиле") - 0.1, T_BTN = t("кнопка"), T_ARR = t("закончите"), T_RES = t("принятой");
        const pl = Kit.aside(S, { parent: s1, x: 96, y: 690, w: 1728, h: 110, tail: false,
          html: '<div class="rb-plaque"><span class="rb-pl">Ваш пример</span><span class="rb-btn">Сбросить</span><span class="rb-pl rb-pa">→</span><span class="rb-ok">принято</span></div>' });
        const pBtn = pl.el.querySelector(".rb-btn"), pArr = pl.el.querySelector(".rb-pa"), pOk = pl.el.querySelector(".rb-ok");
        hide(pBtn, pArr, pOk);
        pl.show(T_PL);
        Kit.popIn(S, pBtn, T_BTN);
        Kit.popIn(S, pArr, T_ARR, 0.5);
        Kit.popIn(S, pOk, T_RES);
        S.tl.to(pl.el, { borderColor: OK, duration: 0.5 }, T_RES);

        // "ready": the accepted version turns the people tile green
        S.tl.to(els[2].a.el, { borderColor: OK, backgroundColor: OKT, duration: 0.6 }, T_RES);
        S.tl.to(marks, { borderColor: OK, color: OK, duration: 0.5, stagger: 0.1 }, T_RES);

        read("Модель Черновик модели быстро, но уверенно ошибается", fillAt[0] + 0.1, DUR);
        read("Вы Пять вопросов", fillAt[1] + 0.1, DUR);
        read("Люди Запрос на слияние Merge Request MR одобрение людей модель одобрить не может", t("одобрение") + 0.1, DUR);
        read("Ваш пример Сбросить принято", T_PL, DUR);

        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
