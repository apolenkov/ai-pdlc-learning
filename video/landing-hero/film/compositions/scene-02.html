<template id="scene-02-template">
  <div data-composition-id="scene-02" data-width="1920" data-height="1080" data-duration="10.8">
    <style>
      [data-composition-id="scene-02"] .h-h { position: absolute; left: 96px; top: 64px; width: 1728px; font-size: 58px; font-weight: 800; }
      [data-composition-id="scene-02"] .h-card { position: absolute; padding: 28px 34px; border: 2px solid var(--k-line); border-radius: 26px; background: var(--k-panel); }
      [data-composition-id="scene-02"] .h-card b { color: var(--k-text); }
      [data-composition-id="scene-02"] .h-t { font-size: 48px; font-weight: 800; }
      [data-composition-id="scene-02"] .h-d { margin-top: 14px; font-size: 36px; line-height: 1.35; color: var(--k-text-2); }
      [data-composition-id="scene-02"] .h-chip { position: absolute; padding: 18px 32px; border: 2px solid var(--k-line); border-radius: 22px; background: var(--k-panel-2); font-size: 42px; font-weight: 700; }
      [data-composition-id="scene-02"] .h-line { position: absolute; font-size: 44px; font-weight: 800; }
      [data-composition-id="scene-02"] .h-line span { color: var(--k-ok); }
      [data-composition-id="scene-02"] .h-nd { width: 76px; height: 76px; margin: 0 auto; border-radius: 50%; border: 4px solid var(--k-ok); display: grid; place-items: center; font-size: 34px; font-weight: 800; background: var(--k-panel); }
      [data-composition-id="scene-02"] .h-nm { margin-top: 14px; font-size: 28px; font-weight: 700; }
    </style>
    <script>
      (function () {
        const S = Kit.scene("02"), DUR = 10.8;
        const tt = (w, d) => { try { return S.t(w); } catch (e) { return d; } };
        const pic = (n, x, y, w, at, dur) => Kit.sketch(S, { name: n, x, y, w, at, dur: dur || 2.4 });
        const el = (cls, html, x, y, w) => { const e = document.createElement("div"); e.className = cls; e.innerHTML = html; e.style.left = x + "px"; e.style.top = y + "px"; if (w) e.style.width = w + "px"; S.root.appendChild(e); return e; };
        const show = (e, at) => { (Array.isArray(e) ? e : [e]).forEach((x) => { gsap.set(x, { autoAlpha: 0 }); S.tl.fromTo(x, { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, at); }); };
        const head = (txt, at) => { const h = el("h-h", txt, 96, 64); show(h, at == null ? 0.1 : at); return h; };
        head("Карта семи этапов");
        const names = ["Намерение", "Анализ", "Архитектура", "Реализация", "Тестирование", "Выпуск", "Наблюдение"];
        const roles = ["решает", "подтверждает", "утверждает", "принимает", "проверяет", "допускает", "наблюдает"];
        const PITCH = 1728 / 7, cx = (i) => 96 + PITCH * (i + 0.5);
        const rl = el("", "", 96, 395, 1728); rl.style.height = "8px"; rl.style.background = "var(--k-line)"; rl.style.borderRadius = "4px"; rl.style.position = "absolute"; show(rl, 0.4);
        const stops = [], rolesEl = [], icons = [];
        names.forEach((nm, i) => {
          const s = el("h-stop", '<div class="h-nd">' + (i + 1) + '</div><div class="h-nm">' + nm + "</div>", cx(i) - 110, 360, 220); s.style.position = "absolute"; s.style.textAlign = "center"; stops.push(s); show(s, 0.5 + i * 0.12);
          const r = el("h-role", roles[i], cx(i) - 110, 520, 220); r.style.position = "absolute"; r.style.textAlign = "center"; r.style.fontSize = "28px"; r.style.fontWeight = "800"; r.style.color = "var(--k-accent-soft)"; rolesEl.push(r); show(r, 0.9 + i * 0.1);
          { const ic = el("h-ic", People.robotIcon(40), cx(i) - 20, 290); ic.style.position = "absolute"; icons.push(ic); show(ic, 1.2 + i * 0.1); }
        });
        const ln = el("h-line", "Агент готовит, <span>человек решает</span>", 96, 700, 1000); show(ln, tt("Агент", 12));
        pic("pair-analyst", 1380, 640, 420, tt("Агент", 12), 3);
        People.focus(S, [stops[0], stops[6], rolesEl, icons.concat([ln])], [tt("намерения", 2), tt("наблюдения", 5), tt("Под каждым", 8), tt("Агент", 12)], DUR - 1.0);
        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
