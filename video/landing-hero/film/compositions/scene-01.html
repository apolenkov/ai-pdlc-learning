<template id="scene-01-template">
  <div data-composition-id="scene-01" data-width="1920" data-height="1080" data-duration="8.7">
    <style>
      [data-composition-id="scene-01"] .h-h { position: absolute; left: 96px; top: 64px; width: 1728px; font-size: 58px; font-weight: 800; }
      [data-composition-id="scene-01"] .h-card { position: absolute; padding: 28px 34px; border: 2px solid var(--k-line); border-radius: 26px; background: var(--k-panel); }
      [data-composition-id="scene-01"] .h-card b { color: var(--k-text); }
      [data-composition-id="scene-01"] .h-t { font-size: 48px; font-weight: 800; }
      [data-composition-id="scene-01"] .h-d { margin-top: 14px; font-size: 36px; line-height: 1.35; color: var(--k-text-2); }
      [data-composition-id="scene-01"] .h-chip { position: absolute; padding: 18px 32px; border: 2px solid var(--k-line); border-radius: 22px; background: var(--k-panel-2); font-size: 42px; font-weight: 700; }
      [data-composition-id="scene-01"] .h-line { position: absolute; font-size: 44px; font-weight: 800; }
      [data-composition-id="scene-01"] .h-line span { color: var(--k-ok); }
    </style>
    <script>
      (function () {
        const S = Kit.scene("01"), DUR = 8.7;
        const tt = (w, d) => { try { return S.t(w); } catch (e) { return d; } };
        const pic = (n, x, y, w, at, dur) => Kit.sketch(S, { name: n, x, y, w, at, dur: dur || 2.4 });
        const el = (cls, html, x, y, w) => { const e = document.createElement("div"); e.className = cls; e.innerHTML = html; e.style.left = x + "px"; e.style.top = y + "px"; if (w) e.style.width = w + "px"; S.root.appendChild(e); return e; };
        const show = (e, at) => { (Array.isArray(e) ? e : [e]).forEach((x) => { gsap.set(x, { autoAlpha: 0 }); S.tl.fromTo(x, { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, at); }); };
        const head = (txt, at) => { const h = el("h-h", txt, 96, 64); show(h, at == null ? 0.1 : at); return h; };
        // под светлой карточкой (0–2,6 с) тёмных блоков нет
        const h1 = el("h-line", "Один маршрут", 96, 230, 1000); h1.style.fontSize = "120px"; h1.style.lineHeight = "1.05"; show(h1, 2.7);
        const sub1 = el("h-line", "<span>от намерения до результата</span>", 96, 400, 1000); sub1.style.fontSize = "56px"; show(sub1, 2.9);
        pic("intro-idea", 1180, 170, 640, 2.8, 3);
        const rail = el("h-rail", "", 96, 770, 1728); rail.style.height = "6px"; rail.style.background = "var(--k-line)"; rail.style.borderRadius = "3px"; rail.style.position = "absolute"; show(rail, 3);
        const dots = []; for (let i = 0; i < 7; i++) { const d = el("h-dot", "", 96 + (1728 / 6) * i - 14, 757, 28); d.style.height = "28px"; d.style.borderRadius = "50%"; d.style.border = "4px solid var(--k-ok)"; d.style.background = "var(--k-bg)"; d.style.position = "absolute"; show(d, 3.2 + i * 0.25); dots.push(d); }
        const c1 = el("h-chip", "что здесь", 96, 860); show(c1, 3.3);
        const c2 = el("h-chip", "как пользоваться", 400, 860); show(c2, 3.5);
        People.poster(S, { kicker: "Главная · AI PDLC", title: "Зачем эта страница", lead: "Один маршрут — от намерения до результата", sketch: { name: "intro-idea", x: 1000, y: 270, w: 780 } });
        People.focus(S, [[rail].concat(dots), c1, c2], [Math.max(tt("маршрут", 3.3), 3.1), Math.max(tt("Что здесь", 6), 3.8), Math.max(tt("как этим", 8), 4.4)], DUR - 1.0);
        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
