<template id="scene-04-template">
  <div data-composition-id="scene-04" data-width="1920" data-height="1080" data-duration="8.6">
    <style>
      [data-composition-id="scene-04"] .h-h { position: absolute; left: 96px; top: 64px; width: 1728px; font-size: 58px; font-weight: 800; }
      [data-composition-id="scene-04"] .h-card { position: absolute; padding: 28px 34px; border: 2px solid var(--k-line); border-radius: 26px; background: var(--k-panel); }
      [data-composition-id="scene-04"] .h-card b { color: var(--k-text); }
      [data-composition-id="scene-04"] .h-t { font-size: 48px; font-weight: 800; }
      [data-composition-id="scene-04"] .h-d { margin-top: 14px; font-size: 36px; line-height: 1.35; color: var(--k-text-2); }
      [data-composition-id="scene-04"] .h-chip { position: absolute; padding: 18px 32px; border: 2px solid var(--k-line); border-radius: 22px; background: var(--k-panel-2); font-size: 42px; font-weight: 700; }
      [data-composition-id="scene-04"] .h-line { position: absolute; font-size: 44px; font-weight: 800; }
      [data-composition-id="scene-04"] .h-line span { color: var(--k-ok); }
    </style>
    <script>
      (function () {
        const S = Kit.scene("04"), DUR = 8.6;
        const tt = (w, d) => { try { return S.t(w); } catch (e) { return d; } };
        const pic = (n, x, y, w, at, dur) => Kit.sketch(S, { name: n, x, y, w, at, dur: dur || 2.4 });
        const el = (cls, html, x, y, w) => { const e = document.createElement("div"); e.className = cls; e.innerHTML = html; e.style.left = x + "px"; e.style.top = y + "px"; if (w) e.style.width = w + "px"; S.root.appendChild(e); return e; };
        const show = (e, at) => { (Array.isArray(e) ? e : [e]).forEach((x) => { gsap.set(x, { autoAlpha: 0 }); S.tl.fromTo(x, { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, at); }); };
        const head = (txt, at) => { const h = el("h-h", txt, 96, 64); show(h, at == null ? 0.1 : at); return h; };
        head("Среда и команды");
        const pe = el("h-card", '<div class="h-t">Среда и контуры</div>', 96, 220, 1000); pe.style.height = "430px"; show(pe, 0.5);
        const e1 = el("h-chip", "Шкалы зрелости", 134, 340); const e2 = el("h-chip", "Контуры", 560, 340); const e3 = el("h-chip", "Логи через Grafana", 134, 470);
        const pt = el("h-card", '<div class="h-t">Команды и поддержка</div>', 1140, 220, 684); pt.style.height = "430px"; show(pt, tt("команды", 7));
        const t1 = el("h-chip", "Атлас команд и продуктов", 1174, 340); t1.style.width = "560px"; t1.style.whiteSpace = "normal"; 
        [e1, e2, e3].forEach((e, i) => show(e, tt(["шкалы", "контуры", "логи"][i], 1 + i)));
        show(t1, tt("атлас", 9));
        pic("pair-start", 96, 690, 440, 2, 3);
        pic("team-done", 1330, 650, 420, 4.5, 3);
        People.focus(S, [e1, e2, e3, t1], [tt("шкалы", 1), tt("контуры", 2), tt("логи", 3), tt("атлас", 9)], DUR - 1.0);
        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
