<template id="scene-05-template">
  <div data-composition-id="scene-05" data-width="1920" data-height="1080" data-duration="8.8">
    <style>
      [data-composition-id="scene-05"] .h-h { position: absolute; left: 96px; top: 64px; width: 1728px; font-size: 58px; font-weight: 800; }
      [data-composition-id="scene-05"] .h-card { position: absolute; padding: 28px 34px; border: 2px solid var(--k-line); border-radius: 26px; background: var(--k-panel); }
      [data-composition-id="scene-05"] .h-card b { color: var(--k-text); }
      [data-composition-id="scene-05"] .h-t { font-size: 48px; font-weight: 800; }
      [data-composition-id="scene-05"] .h-d { margin-top: 14px; font-size: 36px; line-height: 1.35; color: var(--k-text-2); }
      [data-composition-id="scene-05"] .h-chip { position: absolute; padding: 18px 32px; border: 2px solid var(--k-line); border-radius: 22px; background: var(--k-panel-2); font-size: 42px; font-weight: 700; }
      [data-composition-id="scene-05"] .h-line { position: absolute; font-size: 44px; font-weight: 800; }
      [data-composition-id="scene-05"] .h-line span { color: var(--k-ok); }
    </style>
    <script>
      (function () {
        const S = Kit.scene("05"), DUR = 8.8;
        const tt = (w, d) => { try { return S.t(w); } catch (e) { return d; } };
        const pic = (n, x, y, w, at, dur) => Kit.sketch(S, { name: n, x, y, w, at, dur: dur || 2.4 });
        const el = (cls, html, x, y, w) => { const e = document.createElement("div"); e.className = cls; e.innerHTML = html; e.style.left = x + "px"; e.style.top = y + "px"; if (w) e.style.width = w + "px"; S.root.appendChild(e); return e; };
        const show = (e, at) => { (Array.isArray(e) ? e : [e]).forEach((x) => { gsap.set(x, { autoAlpha: 0 }); S.tl.fromTo(x, { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, at); }); };
        const head = (txt, at) => { const h = el("h-h", txt, 96, 64); show(h, at == null ? 0.1 : at); return h; };
        head("Команда развития");
        const card = el("h-card", '<div class="h-t" style="font-size:54px">Команда развития процессов AI PDLC</div><div class="h-d" style="font-size:40px">помогает командам <b>перейти на метод</b></div>', 96, 220, 1040); card.style.borderColor = "var(--k-ok)"; card.style.padding = "40px 44px"; show(card, 0.5);
        const stp = ["аудит продукта", "план изменений", "обучение по ролям"].map((t, i) => { const c = el("h-chip", t, 96 + i * 570, 640); show(c, tt(["аудит", "план изменений", "учит"][i], 4 + i)); return c; });
        [0, 1].forEach((i) => { const a = el("h-line", "→", 96 + (i + 1) * 570 - 78, 644); a.style.color = "var(--k-ok)"; show(a, tt(["план изменений", "учит"][i], 5 + i)); });
        pic("merge", 1230, 150, 560, 2, 3);
        pic("roles-6", 96, 850, 1728, 3.5, 3);
        People.focus(S, [card].concat(stp), [tt("команда развития", 0.6), tt("аудит", 4), tt("план изменений", 5.5), tt("учит", 7)], DUR - 1.0);
        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
