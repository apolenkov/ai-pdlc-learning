<template id="scene-03-template">
  <div data-composition-id="scene-03" data-width="1920" data-height="1080" data-duration="20">
    <style>
      [data-composition-id="scene-03"] .ov-h { position: absolute; left: 96px; top: 64px; width: 1728px; font-size: 58px; font-weight: 800; }
      [data-composition-id="scene-03"] .ov-h span { color: var(--k-accent-soft); }
      [data-composition-id="scene-03"] .repo-wrap { position: absolute; left: 96px; top: 200px; width: 900px; }
      [data-composition-id="scene-03"] .repo-folder { padding: 26px 32px 30px; border: 2px solid var(--k-line); border-radius: 28px; background: var(--k-panel); }
      [data-composition-id="scene-03"] .repo-title { font-size: 30px; font-weight: 700; color: var(--k-text-2); margin-bottom: 16px; }
      [data-composition-id="scene-03"] .repo-title b { color: var(--k-text); font-weight: 800; }
      [data-composition-id="scene-03"] .repo-file { display: flex; align-items: center; gap: 16px; padding: 13px 20px; border-radius: 14px; background: var(--k-panel-2); font-size: 30px; font-weight: 600; color: var(--k-text-2); margin-bottom: 10px; }
      [data-composition-id="scene-03"] .repo-file:last-child { margin-bottom: 0; }
      [data-composition-id="scene-03"] .repo-file .ic { width: 30px; height: 30px; }
      [data-composition-id="scene-03"] .repo-file .rl { margin-left: auto; font-size: 24px; font-weight: 600; color: var(--k-text-2); }
      [data-composition-id="scene-03"] .repo-file.hl { background: var(--k-accent-tint); color: var(--k-text); border: 1px solid var(--k-accent); }
      [data-composition-id="scene-03"] .agent { position: absolute; right: -160px; top: 40px; width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; background: var(--k-panel); border: 3px solid var(--k-ok); font-size: 48px; color: var(--k-ok); box-shadow: var(--k-shadow-ring); }
      [data-composition-id="scene-03"] .agent-line { position: absolute; right: -48px; top: 96px; width: 80px; height: 0; border-top: 3px solid var(--k-ok); }
      [data-composition-id="scene-03"] .mcp { position: absolute; right: 96px; top: 300px; width: 320px; padding: 22px 26px; border: 2px dashed var(--k-line); border-radius: 22px; background: var(--k-panel); }
      [data-composition-id="scene-03"] .mcp-title { font-size: 26px; font-weight: 700; color: var(--k-text-2); }
      [data-composition-id="scene-03"] .mcp-note { margin-top: 8px; font-size: 22px; color: var(--k-text-2); line-height: 1.3; }
      [data-composition-id="scene-03"] .meter { position: absolute; right: 96px; top: 500px; width: 674px; }
      [data-composition-id="scene-03"] .meter-label { font-size: 28px; font-weight: 700; color: var(--k-text-2); margin-bottom: 10px; }
      [data-composition-id="scene-03"] .meter-bar { position: relative; height: 18px; border-radius: 9px; background: var(--k-panel-2); border: 1px solid var(--k-line); overflow: hidden; }
      [data-composition-id="scene-03"] .meter-fill { position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: var(--k-ok); }
      [data-composition-id="scene-03"] .meter-val { margin-top: 8px; font-size: 28px; font-weight: 800; color: var(--k-ok); text-align: right; }
    </style>
    <script>
      (function () {
        const S = Kit.scene("03"), DUR = 20;
        const h = document.createElement("div"); h.className = "ov-h";
        h.innerHTML = 'Агенту есть <span>за что зацепиться</span>'; S.root.appendChild(h);
        S.tl.fromTo(h, { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, 0.1);

        const wrap = document.createElement("div"); wrap.className = "repo-wrap"; S.root.appendChild(wrap);
        const folder = document.createElement("div"); folder.className = "repo-folder"; wrap.appendChild(folder);
        folder.innerHTML = '<div class="repo-title">📁 <b>product</b></div>';
        const files = [
          ["intent.md", "намерение", "замысел продукта"],
          ["spec.md", "спецификация", "что делаем"],
          ["ADR/", "решения", "почему так"],
          ["tests/", "тесты", "что проверить"],
          ["AGENTS.md", "правила", "как работать"],
        ];
        const fileEls = [];
        files.forEach(([name, word, role]) => {
          const el = document.createElement("div"); el.className = "repo-file";
          el.innerHTML = '<span class="ic">📄</span><span>' + name + '</span><span class="rl">' + role + "</span>";
          folder.appendChild(el); fileEls.push(el);
          const at = Math.min(S.t(word), DUR - 4);
          S.tl.fromTo(el, { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, at - 0.35);
        });

        const agent = document.createElement("div"); agent.className = "agent"; agent.innerHTML = People.robotIcon(56); wrap.appendChild(agent);
        const line = document.createElement("div"); line.className = "agent-line"; wrap.appendChild(line);
        S.tl.fromTo([agent, line], { autoAlpha: 0, scale: 0.8 }, { autoAlpha: 1, scale: 1, duration: 0.5, ease: "back.out(2)", immediateRender: false }, Math.min(S.t("агент"), DUR - 4));

        const mcp = document.createElement("div"); mcp.className = "mcp"; S.root.appendChild(mcp);
        mcp.innerHTML = '<div class="mcp-title">🔗 MCP</div><div class="mcp-note">внешние системы — пунктиром, если нужно</div>';
        S.tl.fromTo(mcp, { autoAlpha: 0, x: 20 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, Math.min(S.t("MCP"), DUR - 3));

        const meter = document.createElement("div"); meter.className = "meter"; S.root.appendChild(meter);
        meter.innerHTML = '<div class="meter-label">Агент работает на файлах рядом с кодом</div><div class="meter-bar"><div class="meter-fill"></div></div><div class="meter-val">0 %</div>';
        const fill = meter.querySelector(".meter-fill");
        const val = meter.querySelector(".meter-val");
        S.tl.fromTo(meter, { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, Math.min(S.t("зацепиться"), DUR - 3));
        S.tl.to(fill, { width: "100%", duration: 1.2, ease: "power2.inOut" }, Math.min(S.t("работает"), DUR - 2.4));
        S.tl.to({ v: 0 }, { v: 100, duration: 1.2, ease: "power2.inOut", onUpdate: function () { val.textContent = Math.round(this.targets()[0].v) + " %"; } }, Math.min(S.t("работает"), DUR - 2.4));

        const tt = (w, d) => { try { return S.t(w); } catch (e) { return d; } }, pic = (n, x, y, w, at, dur) => Kit.sketch(S, { name: n, x, y, w, at, dur: dur || 2.4 });
        pic("pair-analyst", 1250, 680, 440, 2.5, 3);
        People.focus(S, fileEls, files.map(([n, w], i) => tt(w, 1 + i)), tt("зацепиться", 12));
        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
