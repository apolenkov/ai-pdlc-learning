<template id="scene-02-template">
  <div data-composition-id="scene-02" data-width="1920" data-height="1080" data-duration="12.6">
    <style>
      [data-composition-id="scene-02"] .ov-h { position: absolute; left: 96px; top: 64px; width: 1728px; font-size: 58px; font-weight: 800; }
      [data-composition-id="scene-02"] .ov-h span { color: var(--k-text-2); font-weight: 600; }
      [data-composition-id="scene-02"] .ov-rail { position: absolute; left: 96px; top: 420px; width: 1728px; height: 120px; }
      [data-composition-id="scene-02"] .ov-link { position: absolute; top: 56px; height: 8px; background: var(--k-line); border-radius: 4px; }
      [data-composition-id="scene-02"] .ov-stop { position: absolute; top: 0; width: 228px; text-align: center; }
      [data-composition-id="scene-02"] .ov-node { margin: 0 auto; width: 80px; height: 80px; border-radius: 50%; display: grid; place-items: center; font-size: 34px; font-weight: 800; background: var(--k-panel-2); border: 4px solid var(--k-line); color: var(--k-text-2); }
      [data-composition-id="scene-02"] .ov-lab { margin-top: 16px; font-size: 26px; font-weight: 600; line-height: 1.25; color: var(--k-text); }
      [data-composition-id="scene-02"] .ov-chip { position: absolute; top: 258px; padding: 10px 18px; border: 2px solid var(--k-line); border-radius: 14px; background: var(--k-panel-2); font-size: 24px; font-weight: 600; color: var(--k-text-2); white-space: nowrap; }
      [data-composition-id="scene-02"] .ov-agent { position: absolute; right: 96px; top: 180px; display: grid; place-items: center; width: 112px; height: 112px; border-radius: 50%; background: var(--k-panel-2); border: 3px dashed var(--k-line); font-size: 48px; color: var(--k-text-2); }
      [data-composition-id="scene-02"] .ov-agent-line { position: absolute; right: 208px; top: 236px; width: 520px; height: 0; border-top: 3px dashed var(--k-line); }
      [data-composition-id="scene-02"] .ov-agent-x { position: absolute; right: 208px; top: 224px; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--k-panel-2); border: 2px solid var(--k-line); font-size: 18px; color: var(--k-text-2); }
      [data-composition-id="scene-02"] .ov-sub { position: absolute; left: 96px; top: 700px; width: 1728px; font-size: 44px; font-weight: 700; line-height: 1.3; color: var(--k-text-2); }
    </style>
    <script>
      (function () {
        const S = Kit.scene("02"), DUR = 12.6;
        const h = document.createElement("div"); h.className = "ov-h";
        h.innerHTML = 'Как было <span>· контекст в письмах и головах</span>'; S.root.appendChild(h);
        S.tl.fromTo(h, { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, 0.1);
        const rail = document.createElement("div"); rail.className = "ov-rail"; S.root.appendChild(rail);
        const names = ["Намерение", "Анализ", "Архитектура", "Реализация", "Тестирование", "Выпуск", "Наблюдение"];
        const W = 1728, pitch = W / 7, cx = (i) => pitch * (i + 0.5);
        names.forEach((n, i) => {
          if (i < 6) {
            const link = document.createElement("div"); link.className = "ov-link";
            link.style.left = (cx(i) + 48) + "px"; link.style.width = (pitch - 96) + "px";
            rail.appendChild(link);
            S.tl.fromTo(link, { autoAlpha: 0, scaleX: 0.6 }, { autoAlpha: 1, scaleX: 1.15, duration: 0.6, ease: "power2.inOut", immediateRender: false }, 0.2);
          }
          const stop = document.createElement("div"); stop.className = "ov-stop";
          stop.style.left = (cx(i) - 114) + "px";
          stop.innerHTML = '<div class="ov-node">👤</div><div class="ov-lab">' + n + "</div>";
          rail.appendChild(stop);
          S.tl.fromTo(stop, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, immediateRender: false }, 0.1 + i * 0.08);
        });
        const chips = [["письмо", "письма"], ["встреча", "шаблоны", -0.5], ["Confluence", "шаблоны"], ["регресс руками", "согласований"]];
        chips.forEach(([label, word, shift], i) => {
          const el = document.createElement("div"); el.className = "ov-chip"; el.textContent = label;
          S.root.appendChild(el);
          let at = 0.5 + i * 0.5;
          try { at = Math.min(S.t(word) + (shift || 0), DUR - 2.2); } catch {}
          S.tl.fromTo(el, { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, at);
        });
        // центрируем чипы после рендера по ширине ячейки
        const rendered = S.root.querySelectorAll(".ov-chip");
        rendered.forEach((el, i) => { el.style.left = (96 + pitch * (i + 0.5) - el.offsetWidth / 2) + "px"; });
        const agent = document.createElement("div"); agent.className = "ov-agent"; agent.innerHTML = People.robotIcon(56); S.root.appendChild(agent);
        const line = document.createElement("div"); line.className = "ov-agent-line"; S.root.appendChild(line);
        const xmark = document.createElement("div"); xmark.className = "ov-agent-x"; xmark.textContent = "✕"; S.root.appendChild(xmark);
        S.tl.fromTo([agent, line, xmark], { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, Math.min(S.t("агенту"), DUR - 2));
        const sub = document.createElement("div"); sub.className = "ov-sub";
        sub.textContent = "Контекст лежал в письмах и головах — искать приходилось";
        S.root.appendChild(sub);
        S.tl.fromTo(sub, { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, Math.min(S.t("головах"), DUR - 1.6));
        const tt = (w, d) => { try { return S.t(w); } catch (e) { return d; } }, pic = (n, x, y, w, at, dur) => Kit.sketch(S, { name: n, x, y, w, at, dur: dur || 2.4 });
        pic("was-apart", 1300, 690, 480, tt("письм", 1.5), 3);
        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
