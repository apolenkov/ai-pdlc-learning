<template id="scene-01-template">
  <div data-composition-id="scene-01" data-width="1920" data-height="1080" data-duration="9.8">
    <style>
      [data-composition-id="scene-01"] .ov-h { position: absolute; left: 96px; top: 64px; width: 1728px; font-size: 58px; font-weight: 800; letter-spacing: -0.02em; }
      [data-composition-id="scene-01"] .ov-rail { position: absolute; left: 96px; top: 380px; width: 1728px; height: 120px; }
      [data-composition-id="scene-01"] .ov-link { position: absolute; top: 56px; height: 8px; background: var(--k-line); border-radius: 4px; }
      [data-composition-id="scene-01"] .ov-stop { position: absolute; top: 0; width: 228px; text-align: center; }
      [data-composition-id="scene-01"] .ov-node { margin: 0 auto; width: 80px; height: 80px; border-radius: 50%; display: grid; place-items: center; font-size: 34px; font-weight: 800; background: var(--k-panel-2); border: 4px solid var(--k-line); color: var(--k-text-2); }
      [data-composition-id="scene-01"] .ov-lab { margin-top: 16px; font-size: 26px; font-weight: 600; line-height: 1.25; color: var(--k-text); }
      [data-composition-id="scene-01"] .ov-sub { position: absolute; left: 96px; top: 700px; width: 1728px; font-size: 44px; font-weight: 700; line-height: 1.3; }
      [data-composition-id="scene-01"] .ov-sub span { color: var(--k-accent-soft); }
    </style>
    <script>
      (function () {
        const S = Kit.scene("01"), DUR = 9.8;
        const stages = ["Намерение", "Анализ", "Архитектура", "Реализация", "Тестирование", "Выпуск", "Наблюдение"];
        const short = ["Намерение", "Анализ", "Архитектура", "Реализация", "Тестиро\u00adвание", "Выпуск", "Наблюдение"];
        const rail = document.createElement("div"); rail.className = "ov-rail"; S.root.appendChild(rail); const stopEls = [];
        const h = document.createElement("div"); h.className = "ov-h"; h.textContent = "Семь этапов PDLC"; S.root.appendChild(h);
        S.tl.fromTo(h, { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, 2.7);
        const W = 1728, pitch = W / 7, cx = (i) => pitch * (i + 0.5);
        stages.forEach((name, i) => {
          if (i < 6) {
            const link = document.createElement("div"); link.className = "ov-link";
            link.style.left = (cx(i) + 48) + "px"; link.style.width = (pitch - 96) + "px";
            rail.appendChild(link);
            S.tl.fromTo(link, { autoAlpha: 0, scaleX: 0 }, { autoAlpha: 1, scaleX: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, Math.max(Math.min(S.t(name), DUR - 1), 2.7));
          }
          const stop = document.createElement("div"); stop.className = "ov-stop";
          stop.style.left = (cx(i) - 114) + "px";
          stop.innerHTML = '<div class="ov-node">' + (i + 1) + '</div><div class="ov-lab">' + short[i] + "</div>";
          rail.appendChild(stop); stopEls.push(stop);
          S.tl.fromTo(stop, { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, Math.max(Math.min(S.t(name), DUR - 1), 2.7));
        });
        const sub = document.createElement("div"); sub.className = "ov-sub";
        sub.innerHTML = "От замысла продукта — <span>к результату и обратной связи</span>";
        S.root.appendChild(sub);
        S.tl.fromTo(sub, { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, Math.min(S.t("наблюдение"), DUR - 1.6));
        const tt = (w, d) => { try { return S.t(w); } catch (e) { return d; } }, pic = (n, x, y, w, at, dur) => Kit.sketch(S, { name: n, x, y, w, at, dur: dur || 2.4 });
        gsap.set([h, sub].concat([...rail.querySelectorAll(".ov-stop, .ov-link")]), { autoAlpha: 0 }); // под светлой карточкой тёмных блоков нет
        People.poster(S, { kicker: "Было → стало · AI PDLC", title: "Что меняется с ИИ-агентами", lead: "Как было и как стало", sketch: { name: "was-apart", x: 1000, y: 270, w: 780 } });
        pic("thinking", 1400, 700, 330, 3);
        People.focus(S, stopEls, stages.map((n, i) => Math.max(tt(n, 3 + i), 2.7 + i * 0.1)), DUR - 1.2);
        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
