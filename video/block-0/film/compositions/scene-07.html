<template id="scene-07-template">
  <div data-composition-id="scene-07" data-width="1920" data-height="1080" data-duration="22.6">
    <style>
      [data-composition-id="scene-07"] .sc-abs { position: absolute; }
      [data-composition-id="scene-07"] .sc-ver { padding: 20px 26px; height: 440px; }
      [data-composition-id="scene-07"] .sc-ver-h { display: flex; align-items: center; gap: 16px; height: 48px; }
      [data-composition-id="scene-07"] .sc-ver-h svg { flex: 0 0 36px; width: 36px; height: 36px; color: var(--k-info); }
      [data-composition-id="scene-07"] .sc-cap { display: grid; flex: 1 1 auto; font-size: 30px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
      [data-composition-id="scene-07"] .sc-cap > span { grid-area: 1 / 1; }
      [data-composition-id="scene-07"] .sc-ex { flex: 0 0 auto; padding: 2px 16px 4px; border: 2px dashed var(--k-text-2); border-radius: 999px; font-size: 28px; font-weight: 600; line-height: 1.25; color: var(--k-text-2); }
      [data-composition-id="scene-07"] .sc-md { margin-top: 18px; font-family: var(--k-font-mono); font-size: 28px; line-height: 38px; white-space: pre; color: var(--k-text); }
      [data-composition-id="scene-07"] .sc-md .h { color: var(--k-code-head); }
      [data-composition-id="scene-07"] .sc-md .add { display: block; margin: 4px -14px 0; padding: 4px 14px; border-left: 4px solid var(--k-diff-add-bar); border-radius: 8px; background: var(--k-diff-add-bg); }
      [data-composition-id="scene-07"] .sc-old { position: absolute; left: 26px; bottom: 18px; padding: 2px 16px 4px; border: 2px solid var(--k-accent-soft); background: var(--k-panel); border-radius: 12px; font-size: 30px; font-weight: 600; line-height: 1.25; color: var(--k-text); }
      [data-composition-id="scene-07"] .sc-cur { border-color: var(--k-ok); }
      [data-composition-id="scene-07"] .sc-lbl { font-size: 30px; font-weight: 600; line-height: 1.25; text-align: center; color: var(--k-text); }
      [data-composition-id="scene-07"] .sc-tile { height: 104px; padding: 0 30px 0 26px; gap: 16px; }
      [data-composition-id="scene-07"] .sc-tile svg { width: 44px; height: 44px; color: var(--k-info); flex: 0 0 44px; }
      [data-composition-id="scene-07"] .sc-keep .tail path { stroke: var(--k-info); }
      [data-composition-id="scene-07"] .sc-keep .ttl { font-size: 38px; }
      [data-composition-id="scene-07"] .sc-keep .sub { font-size: 30px; color: var(--k-text); }
      [data-composition-id="scene-07"] .sc-task .ttl { font-size: 44px; }
      [data-composition-id="scene-07"] .sc-task .sc-li { margin-top: 10px; font-size: 32px; line-height: 1.3; color: var(--k-text); }
      [data-composition-id="scene-07"] .sc-task .sc-li:first-of-type { margin-top: 14px; }
    </style>
    <script>
      (function () {
        const S = Kit.scene("07"), t = S.t, DUR = 22.6;
        // Count only fully revealed, stationary text; transitions do not count as reading time.
        const read = (text, at, off, reveal = 0.6) => {
          const needed = text.trim().split(/\s+/).filter((word) => /[\p{L}\p{N}]/u.test(word)).length / 3 + 1;
          if (off - at - reveal < needed - 1e-6) throw new Error(`Недостаточно времени для «${text}»`);
        };
        const mk = (parent, cls, html) => { const e = document.createElement("div"); e.className = cls; e.innerHTML = html || ""; parent.appendChild(e); return e; };
        const fade = (el, at, dur = 0.45) => {
          gsap.set(el, { autoAlpha: 0 });
          S.tl.fromTo(el, { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: dur, ease: "power2.out", immediateRender: false }, at);
        };
        const T_GIT = t("в системе Git") - 0.1;
        const T_KEEP = t("запоминает");
        const T_WHY = t("видно");
        const T_CLAR = t("уточнения");
        const T_V2 = t("версия два") - 0.3;
        const T_V1 = t("версия один");
        const T_HIST = t("в истории") - 0.15;
        const T_TASK = t("Задача");
        const T_JIRA = t("в Jira");
        const T_STATUS = t("статус");
        const T_DISC = t("обсуждение");
        const T_LINK = t("ссылка");
        const T_DOC = t("документом");
        if (DUR - S.speechEnd < 1.5) throw new Error("Недостаточный хвост сцены");

        // The state caption would repeat the header, so it stays blank.
        Kit.header(S, { header: { mode: "parts", total: 9 }, chapter: "Версии и источники", step: 7, duration: DUR, parts: [{ n: 1, blank: true, at: 0 }] });

        const s1 = S.stage(); gsap.set(s1, { autoAlpha: 1 });
        const CY = 380;
        const head = (caps) => `<div class="sc-ver-h">${Kit.icons.file}<div class="sc-cap">${caps}</div><span class="sc-ex">пример</span></div>`;
        const md = (extra) => `<div class="sc-md"><span class="h">## Границы</span>\n- Меняется только выгрузка\n  в продукте A.\n- Продукт B не затронут.${extra || ""}</div>`;

        /* The accepted version is on screen from the first frame: it is what the voice starts with. */
        const v1 = Kit.aside(S, { parent: s1, x: 96, y: CY, w: 520, tail: false,
          html: head("<span class='a'>принятая версия</span><span class='b'>версия 1</span>") + md() + '<div class="sc-old">в истории</div>' });
        v1.el.classList.add("sc-ver"); gsap.set(v1.el, { autoAlpha: 1 });
        const capA = v1.el.querySelector(".a"), capB = v1.el.querySelector(".b"), oldTag = v1.el.querySelector(".sc-old");
        gsap.set([capB, oldTag], { autoAlpha: 0 });
        S.tl.to(capA, { autoAlpha: 0, duration: 0.3 }, T_V1);
        S.tl.fromTo(capB, { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, T_V1 + 0.1);
        fade(oldTag, T_HIST);
        read("принятая версия", 2, T_V1, 0.4);
        read("версия 1", T_V1 + 0.1, DUR, 0.4);
        read("в истории", T_HIST, DUR, 0.45);

        /* Git remembers every version of the file: one tile, one definition. */
        const git = mk(s1, "k-tile sc-abs sc-tile", Kit.icons.branch + "Git");
        git.style.cssText = "left:96px;top:214px";
        gsap.set(git, { autoAlpha: 0 });
        Kit.popIn(S, git, T_GIT);
        const keep = Kit.aside(S, { parent: s1, x: 340, y: 202, w: 800,
          html: '<div class="ttl">запоминает все версии файла</div><div class="sub">видно, что изменилось и почему</div>' });
        keep.el.classList.add("sc-keep"); keep.el.style.height = "128px"; keep.el.style.top = "202px"; keep.show(T_KEEP);
        fade(keep.el.querySelector(".sub"), T_WHY);
        read("запоминает все версии файла", T_KEEP, DUR, 0.6);
        read("видно, что изменилось и почему", T_WHY, DUR, 0.45);

        /* A clarification makes version two; version one stays in the history. */
        const arrowV = mk(s1, "sc-abs", '<svg width="64" height="40" viewBox="0 0 64 40" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20H58M46 8l12 12-12 12"/></svg>');
        arrowV.style.cssText = `left:624px;top:${CY + 170}px;color:var(--k-text-2)`;
        gsap.set(arrowV, { autoAlpha: 0 });
        S.tl.fromTo(arrowV, { autoAlpha: 0, x: -14 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, T_CLAR);
        const v2 = Kit.aside(S, { parent: s1, x: 704, y: CY, w: 520, tail: false,
          html: head("версия 2") + md('<span class="add">- Пустой результат\n  выгружается файлом\n  только с заголовками\n  столбцов</span>') });
        v2.el.classList.add("sc-ver", "sc-cur"); v2.show(T_V2);
        const added = v2.el.querySelector(".add");
        fade(added, T_V2 + 0.7, 0.5);
        read("версия 2", T_V2, DUR, 0.6);

        /* The task keeps status and discussion; the link joins it with the document. */
        const jira = mk(s1, "k-tile sc-abs sc-tile", Kit.icons.check + "Jira");
        jira.style.cssText = "left:1384px;top:214px";
        gsap.set(jira, { autoAlpha: 0 });
        Kit.popIn(S, jira, T_JIRA);
        const task = Kit.aside(S, { parent: s1, x: 1384, y: CY, w: 440, tail: false,
          html: '<div class="ttl">Задача</div><div class="sc-li">статус</div><div class="sc-li">обсуждение</div>' });
        task.el.classList.add("sc-task"); task.el.style.height = "220px"; task.show(T_TASK);
        const li = task.el.querySelectorAll(".sc-li");
        fade(li[0], T_STATUS); fade(li[1], T_DISC);
        read("Задача", T_TASK, DUR, 0.6); read("статус", T_STATUS, DUR, 0.45); read("обсуждение", T_DISC, DUR, 0.45);
        const arrowL = mk(s1, "sc-abs", '<svg width="148" height="40" viewBox="0 0 150 40" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20H134M30 8L16 20l14 12M120 8l14 12-14 12"/></svg>');
        arrowL.style.cssText = `left:1232px;top:${CY + 100}px;color:var(--k-info)`;
        const lblL = mk(s1, "sc-abs sc-lbl", "ссылка");
        lblL.style.cssText = `left:1232px;top:${CY + 48}px;width:148px`;
        gsap.set(arrowL, { autoAlpha: 0 });
        S.tl.fromTo(arrowL, { autoAlpha: 0, scaleX: 0.6 }, { autoAlpha: 1, scaleX: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, T_LINK);
        fade(lblL, T_LINK);
        read("ссылка", T_LINK, DUR, 0.45);
        // "документом": the link arrow lights up (the only accent on version 2 stays its green frame).
        S.tl.to(arrowL, { color: "#eef0f3", duration: 0.4 }, T_DOC);

        Kit.subtitles(S, {});
        // Keep the last spoken cue with the final frame through the silent tail.
        const lastSubtitle = S.root.querySelector(".k-sub:last-child");
        S.tl.getTweensOf(lastSubtitle).find((tw) => tw.vars.autoAlpha === 0).kill();
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
