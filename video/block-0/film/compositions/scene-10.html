<template id="scene-10-template">
  <div data-composition-id="scene-10" data-width="1920" data-height="1080" data-duration="20.7">
    <style>
      [data-composition-id="scene-10"] .sc-abs { position: absolute; }
      [data-composition-id="scene-10"] .k-path { gap: 18px; width: 1084px; }
      [data-composition-id="scene-10"] .k-path .k-tile { padding: 0 26px; gap: 14px; font-size: 40px; height: 104px; }
      [data-composition-id="scene-10"] .k-path .k-tile svg { width: 40px; height: 46px; flex-shrink: 0; }
      [data-composition-id="scene-10"] .k-path .k-sl { font-size: 54px; }
      [data-composition-id="scene-10"] .sc-head { font-size: 44px; font-weight: 700; line-height: 1.2; }
      [data-composition-id="scene-10"] .sc-step .sub { margin-top: 0; font-size: 32px; color: var(--k-text); }
      [data-composition-id="scene-10"] .sc-parts { display: flex; gap: 18px; width: 1728px; }
      [data-composition-id="scene-10"] .sc-part { position: relative; height: 84px; }
      [data-composition-id="scene-10"] .sc-slot { position: absolute; inset: 0; border: 3px dashed var(--k-text-2); border-radius: 18px; }
      [data-composition-id="scene-10"] .sc-fill { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 10px; border: 2px solid var(--k-info); border-radius: 18px; background: var(--k-panel-2); font-size: 32px; font-weight: 700; line-height: 1; white-space: nowrap; }
      [data-composition-id="scene-10"] .sc-ck { flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--k-text-2); color: var(--k-text); font-size: 28px; font-weight: 700; display: grid; place-items: center; }
      [data-composition-id="scene-10"] .sc-ck svg { width: 18px; height: 18px; }
      [data-composition-id="scene-10"] .sc-next { display: flex; align-items: center; justify-content: center; gap: 28px; height: 150px; padding: 0 40px; }
      [data-composition-id="scene-10"] .sc-next .lead { font-size: 52px; font-weight: 700; color: var(--k-text-2); }
      [data-composition-id="scene-10"] .sc-next .k-tile { position: relative; height: 96px; font-size: 46px; border-color: var(--k-accent); }
      [data-composition-id="scene-10"] .sc-next .k-tile svg { width: 44px; height: 44px; color: var(--k-info); flex: 0 0 44px; }
      [data-composition-id="scene-10"] .sc-next .and { font-size: 40px; font-weight: 400; color: var(--k-text-2); }
      [data-composition-id="scene-10"] .sc-film .lbl { font-size: 30px; font-weight: 600; color: var(--k-text-2); }
      [data-composition-id="scene-10"] .sc-film .ttl { margin-top: 8px; font-size: 52px; line-height: 1.2; }
    </style>
    <script>
      (function () {
        const S = Kit.scene("10"), t = S.t, DUR = 20.7;
        // Count only fully revealed, stationary text; transitions do not count as reading time.
        const read = (text, at, off, reveal = 0.6) => {
          const needed = text.trim().split(/\s+/).filter((word) => /[\p{L}\p{N}]/u.test(word)).length / 3 + 1;
          if (off - at - reveal < needed - 1e-6) throw new Error(`Недостаточно времени для «${text}»`);
        };
        const mk = (parent, cls, html) => { const e = document.createElement("div"); e.className = cls; e.innerHTML = html || ""; parent.appendChild(e); return e; };
        const hid = (el) => gsap.set(el, { autoAlpha: 0 });
        if (DUR - S.speechEnd < 3.0 - 0.05) throw new Error("Хвост сцены короче 3 с");

        Kit.header(S, { header: { mode: "parts", total: 9 }, chapter: "Первый шаг", step: null, mode: "done", duration: DUR, parts: [{ n: 1, blank: true, at: 0 }] });

        /* Stage 1: what the viewer can now do, and the first step with its five parts. */
        const s1 = S.stage(); gsap.set(s1, { autoAlpha: 1 });
        Kit.sketch(S, { parent: s1, name: "intro-idea", x: 96, y: 214, w: 560, at: 0.2, dur: 2.6 });
        const T_REQ = t("запрос"), T_OK = t("проверяемые") - 0.1;
        const path = Kit.path(S, { parent: s1, x: 740, y: 250, sep: "→", items: [
          { icon: "file", text: "запрос", at: T_REQ }, { icon: "check", text: "проверяемые требования", at: T_OK }] });
        S.tl.to(path.tiles[1], { borderColor: "var(--k-ok)", backgroundColor: "var(--k-ok-tint)", duration: 0.6 }, t("требования."));
        read("запрос", T_REQ, DUR, 0.5); read("проверяемые требования", T_OK, DUR, 0.5);

        const T_TASK = t("возьмите");
        // The heading comes with the words «первый шаг»; the card appears with its text, never empty.
        const head = mk(s1, "sc-abs sc-head", "Первый шаг"); head.style.cssText = "left:740px;top:410px"; hid(head);
        Kit.popIn(S, head, t("первый шаг") - 0.1, 0.5);
        const step = Kit.aside(S, { parent: s1, x: 740, y: 484, w: 1084, tail: false, text: "возьмите готовый запрос и запишите замысел" });
        step.el.classList.add("sc-step");
        Kit.popIn(S, step.el, T_TASK, 0.5);
        const sub = step.el.querySelector(".sub");
        read("Первый шаг", t("первый шаг") - 0.1, DUR, 0.5);
        read("возьмите готовый запрос и запишите замысел", T_TASK, DUR, 0.5);

        // Five parts in one row: each name appears on its word; empty frames mark the places.
        const PARTS = ["Проблема", "Результат", "Границы", "Признаки успеха", "Открытые вопросы"];
        const T_PART = [t("проблему"), t("результат,"), t("границы,"), t("признаки"), t("открытые")];
        const row = mk(s1, "sc-abs sc-parts"); row.style.cssText = "left:96px;top:690px";
        PARTS.forEach((name, i) => {
          const cell = mk(row, "sc-part", '<div class="sc-fill"></div>');
          cell.style.flex = `${name.length} 1 0`;
          const fill = cell.querySelector(".sc-fill");
          fill.innerHTML = `<span class="sc-ck">${i + 1}</span><span>${name}</span>`;
          hid(fill);
          Kit.popIn(S, fill, T_PART[i] - 0.05, 0.5);
        });
        const T_OUT = t("открытые") + 2.2;
        read("Открытые вопросы", t("открытые"), T_OUT, 0.5);
        read("Признаки успеха", t("признаки"), T_OUT, 0.5);

        /* Stage 2: the bridge to the next film. */
        const s2 = S.stage();
        Kit.stageOut(S, s1, T_OUT); Kit.stageIn(S, s2, T_OUT + 0.5);
        const T_MD = t("Markdown"), T_GIT = t("Git."), T_FILM = t("О них") - 0.2;
        const next = Kit.aside(S, { parent: s2, x: 250, y: 330, w: 1420, tail: false,
          html: `<div class="lead">Дальше:</div><div class="k-tile md">${Kit.icons.file}Markdown</div><div class="and">и</div><div class="k-tile git">${Kit.icons.branch}Git</div>` });
        next.el.classList.add("sc-next");
        gsap.set(next.el, { autoAlpha: 0 });
        S.tl.fromTo(next.el, { autoAlpha: 0, y: 36, scale: 0.94, filter: "blur(10px)" }, { autoAlpha: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "power3.out", immediateRender: false }, T_OUT + 0.5);
        const md = next.el.querySelector(".md"), and = next.el.querySelector(".and"), git = next.el.querySelector(".git");
        hid([md, and, git]);
        Kit.popIn(S, md, T_MD - 0.05, 0.5); Kit.popIn(S, and, t("и Git") - 0.05, 0.4); Kit.popIn(S, git, T_GIT - 0.05, 0.5);
        read("Дальше: Markdown и Git", T_OUT + 1.1, DUR, 0.5);
        // The title of the next film is the guide title from course-names.json (key 0a).
        const film = Kit.aside(S, { parent: s2, x: 250, y: 520, w: 1420, tail: false,
          html: '<div class="lbl">следующий ролик</div><div class="ttl">Markdown, Git и совместная работа в GitLab с нуля</div>' });
        film.el.classList.add("sc-film"); film.el.style.padding = "24px 40px 28px";
        film.show(T_FILM);
        read("Markdown, Git и совместная работа в GitLab с нуля", T_FILM, DUR, 0.6);

        Kit.subtitles(S, {});
        // Keep the last spoken cue with the final frame through the silent tail.
        const lastSubtitle = S.root.querySelector(".k-sub:last-child");
        S.tl.getTweensOf(lastSubtitle).find((tw) => tw.vars.autoAlpha === 0).kill();
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
