<template id="scene-08-template">
  <div data-composition-id="scene-08" data-width="1920" data-height="1080" data-duration="21.4">
    <style>
      [data-composition-id="scene-08"] .k-sg em,
      [data-composition-id="scene-08"] .k-pl { font-size: 28px; }
      [data-composition-id="scene-08"] .sc-node { display: flex; align-items: center; justify-content: center; gap: 22px; padding: 0 24px; font-size: 52px; font-weight: 700; letter-spacing: -0.015em; }
      [data-composition-id="scene-08"] .sc-node svg { flex: 0 0 64px; width: 64px; height: 64px; color: var(--k-text-2); }
      [data-composition-id="scene-08"] .sc-node-draft { border-color: var(--k-text); }
      [data-composition-id="scene-08"] .sc-node-draft svg { color: var(--k-text); }
      [data-composition-id="scene-08"] .sc-slot { border: 3px dashed var(--k-text-2); background: none; box-shadow: none; }
      [data-composition-id="scene-08"] .sc-arrow { position: absolute; width: 112px; text-align: center; font-size: 60px; font-weight: 300; line-height: 80px; color: var(--k-text-2); }
      [data-composition-id="scene-08"] .sc-card .ttl { font-size: 38px; }
      [data-composition-id="scene-08"] .sc-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      [data-composition-id="scene-08"] .sc-chip { display: inline-block; padding: 6px 18px; border-radius: 22px; font-size: 28px; font-weight: 600; line-height: 1.25; white-space: nowrap; }
      [data-composition-id="scene-08"] .sc-chip-info { color: var(--k-text-2); border: 2px solid var(--k-text-2); }
      [data-composition-id="scene-08"] .sc-chip-bad { margin-top: 12px; color: var(--k-accent-soft); border: 2px solid var(--k-accent-soft); background: var(--k-accent-tint); }
      [data-composition-id="scene-08"] .sc-line { margin-top: 16px; padding: 12px 18px; border-left: 6px solid var(--k-text-2); background: var(--k-panel-2); border-radius: 10px; font-size: 38px; font-weight: 700; letter-spacing: -0.01em; }
      [data-composition-id="scene-08"] .sc-q { margin-top: 12px; font-size: 34px; font-weight: 700; line-height: 1.25; }
      [data-composition-id="scene-08"] .sc-q2 { margin-top: 10px; font-size: 32px; line-height: 1.3; color: var(--k-text-2); }
      [data-composition-id="scene-08"] .sc-note { margin-top: 12px; font-size: 32px; font-weight: 600; color: var(--k-accent-soft); }
      [data-composition-id="scene-08"] .sc-act { margin-top: 10px; font-size: 34px; line-height: 1.25; }
      [data-composition-id="scene-08"] .sc-ok { font-weight: 700; color: var(--k-text); }
      [data-composition-id="scene-08"] .sc-open { display: flex; align-items: center; justify-content: center; gap: 24px; font-size: 38px; font-weight: 700; }
      [data-composition-id="scene-08"] .sc-open b { font-size: 72px; font-weight: 300; color: var(--k-text-2); }
      [data-composition-id="scene-08"] .sc-neq { position: absolute; left: 918px; width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--k-accent-soft); background: var(--k-accent-tint); color: var(--k-accent-soft); font-size: 52px; font-weight: 700; line-height: 76px; text-align: center; }
      [data-composition-id="scene-08"] .sc-neq-l { position: absolute; left: 816px; width: 288px; text-align: center; font-size: 30px; font-weight: 600; color: var(--k-accent-soft); }
    </style>
    <script>
      (function () {
        const S = Kit.scene("08"), t = S.t, DUR = 21.4;
        const mk = (parent, cls, html) => { const e = document.createElement("div"); e.className = cls; e.innerHTML = html || ""; parent.appendChild(e); return e; };
        const vis = (el) => gsap.set(el, { autoAlpha: 1 });
        const hid = (el) => gsap.set(el, { autoAlpha: 0 });
        // Count only fully revealed, stationary text; transitions do not count as reading time.
        const read = (text, at, off, reveal = 0.6) => {
          const needed = text.trim().split(/\s+/).filter((word) => /[\p{L}\p{N}]/u.test(word)).length / 3 + 1;
          if (off - at - reveal < needed - 1e-6) throw new Error(`Недостаточно времени для «${text}»`);
        };
        const T_SRC = Math.max(t("по источникам"), 2.05);   // the first 2 s are covered by the part title card
        const T_MODEL0 = Math.max(t("модель."), 2.2);
        const T_DRAFT = Math.max(t("Подготовить"), 2.45);
        const T_BAD1 = t("она может");
        const T_SWAP = t("Например") + 0.4;        // stage 1 exits; stage 2 enters 0.05 s after the exit ends
        const T_IN = T_SWAP + 0.5;
        const T_EX = T_IN;
        const T_LINE = t("добавить страховку");
        const T_NONE = t("В запросе");
        const T_BAD = t("такого нет");
        const T_HUMAN = t("Человек сверяет");
        const T_DIFF = t("видит расхождение");
        const T_OPEN = t("оставляет вопрос");
        const T_MODEL = t("Модель помогает");
        const T_DECIDE = t("решает и проверяет");
        if (DUR - S.speechEnd < 1.5) throw new Error("Недостаточный хвост сцены");

        Kit.header(S, { header: { mode: "parts", total: 9 }, chapter: "Помощь модели", step: 8, duration: DUR,
          parts: [{ n: 1, blank: true, at: 0 }] });

        /* 1. Sources -> model -> draft. The stage opens right after the part title card; slots fill in as spoken. */
        const s1 = S.stage(); gsap.set(s1, { autoAlpha: 0 });
        S.tl.to(s1, { autoAlpha: 1, duration: 0.2 }, 1.95);
        const NY = 380, NH = 200;
        const spark = '<svg viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"><path d="M28 6l5 17 17 5-17 5-5 17-5-17-17-5 17-5z"/></svg>';
        const node = (o) => Kit.aside(S, { parent: s1, y: NY, h: NH, tail: false, ...o });
        const model = node({ x: 708, w: 504, html: spark + "<span>Модель</span>" });
        model.el.classList.add("sc-node"); model.show(T_MODEL0);
        const src = node({ x: 96, w: 500, html: Kit.icons.file + "<span>Источники</span>" });
        src.el.classList.add("sc-node");
        const draft = node({ x: 1324, w: 500, html: Kit.icons.file + "<span>Черновик</span>" });
        draft.el.classList.add("sc-node", "sc-node-draft");
        const slot = (x, w, off) => {
          const el = document.createElement("div");
          el.className = "k-aside k-card sc-slot";
          el.style.cssText = `left:${x}px;top:${NY}px;width:${w}px;height:${NH}px`;
          s1.appendChild(el); vis(el);
          S.tl.to(el, { autoAlpha: 0, duration: 0.25 }, off - 0.1);
        };
        slot(96, 500, T_SRC); slot(1324, 500, T_DRAFT);
        [[596, "→"], [1212, "→"]].forEach(([x, ch]) => {
          const a = document.createElement("div");
          a.className = "sc-arrow"; a.textContent = ch;
          a.style.cssText = `left:${x}px;top:${NY + NH / 2 - 40}px`;
          s1.appendChild(a);
        });
        src.show(T_SRC); draft.show(T_DRAFT);
        const bad1 = mk(s1, "", '<span class="sc-chip sc-chip-bad">может выдумать</span>');
        bad1.style.cssText = `position:absolute;left:708px;top:${NY + NH + 30}px;width:504px;text-align:center`; hid(bad1);
        Kit.popIn(S, bad1, T_BAD1, 0.4);
        read("может выдумать", T_BAD1, T_SWAP, 0.4);
        read("Модель", T_MODEL0, T_SWAP);
        read("Источники", T_SRC, T_SWAP);
        read("Черновик", T_DRAFT, T_SWAP);

        /* 2. Example: the draft line against the source, the human compares and leaves the question open. */
        const s2 = S.stage();
        const AY = 262, AH = 316, BY = 606, BH = 190;
        const srcCard = Kit.aside(S, { parent: s2, x: 96, y: AY, w: 720, h: AH, tail: false, title: "Источник",
          html: '<div class="sc-q">«При ошибке уберите старый платёж»</div>' +
                '<div class="sc-q2">Показываем «—» и сообщение у неверного поля. Формулу не меняем.</div>' });
        const draftCard = Kit.aside(S, { parent: s2, x: 1104, y: AY, w: 720, h: AH, tail: false,
          html: '<div class="sc-head"><span class="ttl">Черновик</span><span class="sc-chip sc-chip-info">например</span></div>' +
                '<div class="sc-line">Добавить страховку в платёж</div>' +
                '<div class="sc-note">Такого в запросе нет</div>' +
                '<div class="sc-chip sc-chip-bad">может выдумать</div>' });
        [srcCard, draftCard].forEach((c) => { c.el.classList.add("sc-card"); vis(c.el); });
        const q = (c, sel) => c.el.querySelector(sel);
        const chipEx = q(draftCard, ".sc-chip-info"), line = q(draftCard, ".sc-line"), chipBad = q(draftCard, ".sc-chip-bad");
        const note = q(draftCard, ".sc-note");
        [chipEx, line, chipBad, note].forEach(hid);
        Kit.popIn(S, chipEx, T_EX, 0.4); Kit.popIn(S, line, T_LINE); Kit.popIn(S, note, T_NONE);
        Kit.popIn(S, chipBad, T_BAD);
        S.tl.to(line, { borderLeftColor: "var(--k-accent)", duration: 0.5 }, T_BAD);

        const neq = document.createElement("div"); neq.className = "sc-neq"; neq.textContent = "≠"; neq.style.top = `${AY + 110}px`;
        const neqL = document.createElement("div"); neqL.className = "sc-neq-l"; neqL.textContent = "расхождение"; neqL.style.top = `${AY + 110 + 84 + 10}px`;
        s2.append(neq, neqL); [neq, neqL].forEach(hid);
        Kit.popIn(S, neq, T_DIFF); Kit.popIn(S, neqL, T_DIFF + 0.2);

        const human = Kit.aside(S, { parent: s2, x: 96, y: BY, w: 720, h: BH, tail: false,
          html: '<div class="sc-head"><span class="ttl">Человек</span><span class="sc-chip sc-chip-info">Модель помогает</span></div>' +
                '<div class="sc-act">сверяет черновик с источником</div><div class="sc-act sc-ok">решает и проверяет</div>' });
        human.el.classList.add("sc-card"); human.show(T_HUMAN);
        const chipModel = q(human, ".sc-chip-info"), decide = q(human, ".sc-ok");
        hid(chipModel); hid(decide); Kit.popIn(S, chipModel, T_MODEL, 0.4); Kit.popIn(S, decide, T_DECIDE, 0.5);
        const open = Kit.aside(S, { parent: s2, x: 1104, y: BY, w: 720, h: BH, tail: false, html: '<b>?</b><span>Открытый вопрос</span>' });
        open.el.classList.add("sc-open", "sc-slot"); open.show(T_OPEN);
        const arrow = document.createElement("div"); arrow.className = "sc-arrow"; arrow.textContent = "→";
        arrow.style.cssText = `left:848px;top:${BY + BH / 2 - 40}px;width:224px`;
        s2.appendChild(arrow); hid(arrow); Kit.popIn(S, arrow, T_OPEN - 0.2, 0.4);

        read("Источник При ошибке уберите старый платёж Показываем — и сообщение у неверного поля. Формулу не меняем.", T_IN, DUR, 0.7);
        read("Черновик например", T_EX, DUR, 0.4);
        read("Добавить страховку в платёж", T_LINE, DUR);
        read("Такого в запросе нет", T_NONE, DUR);
        read("может выдумать", T_BAD, DUR);
        read("Человек сверяет черновик с источником", T_HUMAN, DUR);
        read("расхождение", T_DIFF + 0.2, DUR);
        read("Открытый вопрос", T_OPEN, DUR);
        read("Модель помогает", T_MODEL, DUR, 0.4);
        read("решает и проверяет", T_DECIDE, DUR, 0.5);

        Kit.stageOut(S, s1, T_SWAP); S.tl.recent().duration(T_IN - T_SWAP - 0.05);
        Kit.stageIn(S, s2, T_IN);
        Kit.subtitles(S, {});
        // Keep the last spoken cue with the final cards through the silent tail.
        const lastSubtitle = S.root.querySelector(".k-sub:last-child");
        S.tl.getTweensOf(lastSubtitle).find((tw) => tw.vars.autoAlpha === 0).kill();
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
