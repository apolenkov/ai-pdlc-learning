    <script>
      (function () {
        const S = Kit.scene("04"), DUR = 19.8;
        const h = document.createElement("div"); h.className = "et-h";
        h.textContent = "Roadmap · шаг за шагом"; S.root.appendChild(h);
        S.tl.fromTo(h, { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: true }, 0.1);
        // слово озвучки, подпись, вид полосы, grid-column «начало / конец» — как на странице enabling-team.html
        const rows = [
          ["Установочная", "1. Установочная встреча", "theory", 1, 3],
          ["Подготовка", "2. Подготовка по гайдам", "theory", 2, 5],
          ["Аудит", "3. Аудит: беседа с командой", "practice", 3, 6],
          ["План изменений", "4. План изменений", "practice", 5, 7],
          ["Обучение", "5. Обучение и метарепозиторий", "mixed", 6, 9],
          ["Внедрение", "6. Внедрение первым потоком", "practice", 8, 12],
          ["Метрики", "7. Метрики и повторный аудит", "practice", 11, 13],
        ];
        const card = document.createElement("div"); card.className = "gantt-card"; S.root.appendChild(card);
        const legend = document.createElement("p"); legend.className = "gantt-legend";
        legend.innerHTML = '<span><i class="gantt-swatch gantt-swatch--theory"></i>ТЕОРИЯ</span><span><i class="gantt-swatch gantt-swatch--practice"></i>ПРАКТИКА</span><span><i class="gantt-swatch gantt-swatch--mixed"></i>ТЕОРИЯ + ПРАКТИКА</span><span class="gantt-note">порядок шагов, длина — доля работы</span>';
        card.appendChild(legend);
        const note = legend.querySelector(".gantt-note");
        const chart = document.createElement("div"); chart.className = "gantt-chart"; card.appendChild(chart);
        const first = Math.min(S.t(rows[0][0]), DUR - 2);
        S.tl.fromTo(card, { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: true }, Math.max(first - 0.1, 0.2));
        S.tl.fromTo(note, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: "power2.out", immediateRender: true }, Math.min(S.t("Длина"), DUR - 2));

          const r = document.createElement("div"); r.className = "gantt-row" + (i % 2 ? " even" : "");

          const at = Math.min(S.t(word), DUR - 2);
          S.tl.fromTo(r, { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power2.out", immediateRender: true }, at);
          S.tl.fromTo(r.querySelector(".gantt-bar"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut", immediateRender: true }, at + 0.15);
        });
        S.finish(DUR);
      })();
    </script>
