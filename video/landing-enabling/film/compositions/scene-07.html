<template id="scene-07-template">
  <div data-composition-id="scene-07" data-width="1920" data-height="1080" data-duration="8.1">
    <style>
      [data-composition-id="scene-07"] .et-h { position: absolute; left: 96px; top: 64px; width: 1728px; font-size: 58px; font-weight: 800; }
      [data-composition-id="scene-07"] .et-btns { position: absolute; left: 96px; top: 300px; width: 1728px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
      [data-composition-id="scene-07"] .et-btn { padding: 44px 40px; border-radius: 28px; background: var(--k-accent); color: var(--k-on-accent); font-size: 44px; font-weight: 800; text-align: center; }
      [data-composition-id="scene-07"] .et-btn.ghost { background: var(--k-panel-2); color: var(--k-text); border: 3px solid var(--k-accent); }
      [data-composition-id="scene-07"] .et-note { position: absolute; left: 96px; top: 620px; width: 1728px; font-size: 36px; color: var(--k-text-2); }
    </style>
    <script>
      (function () {
        const S = Kit.scene("07"), DUR = 8.1;
        const h = document.createElement("div"); h.className = "et-h"; h.textContent = "Начните с аудита"; S.root.appendChild(h);
        S.tl.fromTo(h, { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: true }, 0.1);
        const btns = document.createElement("div"); btns.className = "et-btns";
        btns.innerHTML = '<div class="et-btn">Пройти аудит</div><div class="et-btn ghost">Страница команды развития</div>';
        S.root.appendChild(btns);
        S.tl.fromTo(btns.children, { autoAlpha: 0, y: 22 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out", stagger: 0.15, immediateRender: true }, Math.min(S.t("аудита"), DUR - 2.5));
        const note = document.createElement("div"); note.className = "et-note";
        note.textContent = "Остальное команда развития пройдёт путь вместе с вами";
        S.root.appendChild(note);
        S.tl.fromTo(note, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, immediateRender: true }, Math.min(S.t("вместе с вами"), DUR - 1.8));
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
