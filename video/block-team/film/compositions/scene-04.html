<template id="scene-04-template">
  <div data-composition-id="scene-04" data-width="1920" data-height="1080" data-duration="45.5">
    <style>
      [data-composition-id="scene-04"] .pr-title { position: absolute; left: 96px; width: 1728px; top: 206px; font-size: 54px; font-weight: 700; color: var(--k-accent); }
      [data-composition-id="scene-04"] .pr-sub { position: absolute; left: 96px; width: 1728px; font-size: 40px; font-weight: 700; color: var(--k-accent-soft); }
      [data-composition-id="scene-04"] .pr-row { position: absolute; left: 96px; width: 1728px; display: grid; align-items: stretch; gap: 24px; }
      [data-composition-id="scene-04"] .pr-col { display: grid; gap: 14px; justify-items: stretch; align-content: start; }
      [data-composition-id="scene-04"] .pr-col > .k-aside, [data-composition-id="scene-04"] .pr-row > .k-aside { position: relative; }
      [data-composition-id="scene-04"] .pr-t { font-size: 44px; font-weight: 700; line-height: 1.15; }
      [data-composition-id="scene-04"] .pr-t span { color: var(--k-accent-soft); }
      [data-composition-id="scene-04"] .pr-c { font-size: 30px; line-height: 1.25; color: var(--k-text-2); margin-top: 8px; }
      [data-composition-id="scene-04"] .pr-arr { align-self: center; text-align: center; font-size: 56px; font-weight: 300; color: var(--k-text-2); line-height: 1; }
      [data-composition-id="scene-04"] .pr-chips { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
      [data-composition-id="scene-04"] .pr-chip { padding: 8px 16px; border: 2px solid var(--k-line); border-radius: 14px; background: var(--k-panel-2); font-size: 30px; font-weight: 600; line-height: 1.2; white-space: nowrap; }
      [data-composition-id="scene-04"] .pr-ok { border-color: var(--k-ok); background: var(--k-ok-tint); }
      [data-composition-id="scene-04"] .pr-tag { position: absolute; left: 96px; top: 222px; }
      [data-composition-id="scene-04"] .sc-item { height: 100%; display: flex; align-items: center; gap: 28px; font-size: 44px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.15; }
      [data-composition-id="scene-04"] .sc-ok { flex: none; width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; color: var(--k-ok); border: 3px solid var(--k-ok); background: var(--k-ok-tint); }
      [data-composition-id="scene-04"] .sc-ok svg { width: 44px; height: 44px; opacity: 0; }
      [data-composition-id="scene-04"] .sc-next { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 32px; }
      [data-composition-id="scene-04"] .sc-next .lab { font-size: 36px; font-weight: 700; color: var(--k-accent-soft); white-space: nowrap; }
      [data-composition-id="scene-04"] .sc-next .nm { font-size: 58px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
      [data-composition-id="scene-04"] .sc-next svg { flex: none; width: 76px; height: 41px; }
    </style>
    <script>
      (function () {
        const S = Kit.scene("04"), t = S.t, DUR = 45.5;
        // Count only fully revealed, stationary text; transitions do not count as reading time.
        const read = (text, at, off, reveal = 0.6) => {
          const needed = text.trim().split(/\s+/).filter((word) => /[\p{L}\p{N}]/u.test(word)).length / 3 + 1;
          if (off - at - reveal < needed - 1e-6) throw new Error(`Недостаточно времени для «${text}»: ${(off - at - reveal).toFixed(1)} с, нужно ${needed.toFixed(1)}`);
        };
        if (DUR - S.speechEnd < 1.5) throw new Error("Недостаточный хвост сцены");
        const hide = (...els) => els.forEach((el) => gsap.set(el, { autoAlpha: 0 }));
        const div = (cls, html, parent) => { const el = document.createElement("div"); el.className = cls; el.innerHTML = html; parent.appendChild(el); return el; };
        const col = (p) => div("pr-col", "", p);
        const row = (p, top, cols) => { const r = div("pr-row", "", p); r.style.top = top + "px"; r.style.gridTemplateColumns = cols; return r; };
        const tile = (p, at, ttl, sub, off, cls) => {
          const a = Kit.aside(S, { parent: p, tail: false, html: '<div class="pr-t">' + ttl + "</div>" + (sub ? '<div class="pr-c">' + sub + "</div>" : "") });
          if (cls) a.el.classList.add(cls);
          a.show(at); read(ttl.replace(/<[^>]+>/g, "") + " " + (sub || ""), at, off);
          return a;
        };
        const arrow = (p, at, ch = "→") => { const a = div("pr-arr", ch, p); hide(a); Kit.popIn(S, a, at); return a; };
        const line = (cls, text, p, at, off) => { const e = div(cls, text, p); hide(e); Kit.popIn(S, e, at); read(text, at, off); return e; };

        Kit.header(S, { header: { mode: "parts", total: 5 }, chapter: "Как настроить GitLab", step: 4, duration: DUR, parts: [{ n: 1, blank: true, at: 0 }] });

        const OUT1 = t("Эти правила") - 0.3;
        const s1 = S.stage(); gsap.set(s1, { autoAlpha: 1 });
        const r1 = row(s1, 198, "1fr 1fr");
        const L = col(r1), R = col(r1);
        const hl = div("pr-sub", "GitLab 15.10 проверяет сам", L); hl.style.position = "relative"; hl.style.left = "0"; hl.style.width = "auto"; hl.style.textAlign = "left"; hide(hl); Kit.popIn(S, hl, t("Сам он")); read("GitLab 15.10 проверяет сам", t("Сам он"), OUT1);
        tile(L, t("основная ветка"), "Основная ветка защищена", "", OUT1);
        tile(L, t("прямая отправка"), "Прямая отправка запрещена", "", OUT1);
        tile(L, t("мейнтейнер"), "Слияние — только Maintainer", "", OUT1);
        tile(L, t("зелёной"), "Слияние ждёт зелёной проверки", "", OUT1);
        tile(L, t("обсуждения"), "Обсуждения закрыты", "", OUT1);
        const hr = div("pr-sub", "Держится на договорённости", R); hr.style.position = "relative"; hr.style.left = "0"; hr.style.width = "auto"; hr.style.textAlign = "left"; hide(hr); Kit.popIn(S, hr, t("А комментарии")); read("Держится на договорённости", t("А комментарии"), OUT1);
        tile(R, t("А комментарии"), "Комментарии и одно одобрение", "", OUT1);
        tile(R, t("запрет одобрять"), "Нельзя одобрять свой запрос", "", OUT1);
        tile(R, t("сброс одобрения"), "Сброс одобрения после правок", "", OUT1);

        const s2 = S.stage();
        const tp = Kit.aside(S, { parent: s2, x: 96, y: 240, w: 1728, tail: false, html: '<div class="pr-t">Шаблон запроса <span>Default.md</span></div><div class="pr-c">комментарии и одно одобрение · автор не одобряет свой запрос · техлид сверяет перед слиянием</div>' });
        tp.el.classList.add("pr-ok"); tp.show(t("шаблоне запроса")); read("Шаблон запроса Default.md комментарии и одно одобрение автор не одобряет свой запрос техлид сверяет перед слиянием", t("шаблоне запроса"), DUR);
        line("pr-sub", "Что платформа не обеспечивает — ручное правило, а не защита", s2, t("Что платформа"), DUR).style.top = "520px";
        Kit.stageOut(S, s1, OUT1); Kit.stageIn(S, s2, OUT1 + 0.5);

        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
