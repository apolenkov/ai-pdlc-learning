<template id="scene-0b-template">
  <div data-composition-id="scene-0b" data-width="1920" data-height="1080" data-duration="33.5">
    <style>
      [data-composition-id="scene-0b"] .pr-title { position: absolute; left: 96px; width: 1728px; top: 206px; font-size: 54px; font-weight: 700; color: var(--k-accent); }
      [data-composition-id="scene-0b"] .pr-sub { position: absolute; left: 96px; width: 1728px; font-size: 40px; font-weight: 700; color: var(--k-accent-soft); }
      [data-composition-id="scene-0b"] .pr-row { position: absolute; left: 96px; width: 1728px; display: grid; align-items: stretch; gap: 24px; }
      [data-composition-id="scene-0b"] .pr-col { display: grid; gap: 14px; justify-items: stretch; align-content: start; }
      [data-composition-id="scene-0b"] .pr-col > .k-aside, [data-composition-id="scene-0b"] .pr-row > .k-aside { position: relative; }
      [data-composition-id="scene-0b"] .pr-t { font-size: 44px; font-weight: 700; line-height: 1.15; }
      [data-composition-id="scene-0b"] .pr-t span { color: var(--k-accent-soft); }
      [data-composition-id="scene-0b"] .pr-c { font-size: 30px; line-height: 1.25; color: var(--k-text-2); margin-top: 8px; }
      [data-composition-id="scene-0b"] .pr-arr { align-self: center; text-align: center; font-size: 56px; font-weight: 300; color: var(--k-text-2); line-height: 1; }
      [data-composition-id="scene-0b"] .pr-chips { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
      [data-composition-id="scene-0b"] .pr-chip { padding: 8px 16px; border: 2px solid var(--k-line); border-radius: 14px; background: var(--k-panel-2); font-size: 30px; font-weight: 600; line-height: 1.2; white-space: nowrap; }
      [data-composition-id="scene-0b"] .pr-ok { border-color: var(--k-ok); background: var(--k-ok-tint); }
      [data-composition-id="scene-0b"] .pr-tag { position: absolute; left: 96px; top: 222px; }
      [data-composition-id="scene-0b"] .sc-item { height: 100%; display: flex; align-items: center; gap: 28px; font-size: 44px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.15; }
      [data-composition-id="scene-0b"] .sc-ok { flex: none; width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; color: var(--k-ok); border: 3px solid var(--k-ok); background: var(--k-ok-tint); }
      [data-composition-id="scene-0b"] .sc-ok svg { width: 44px; height: 44px; opacity: 0; }
      [data-composition-id="scene-0b"] .sc-next { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 32px; }
      [data-composition-id="scene-0b"] .sc-next .lab { font-size: 36px; font-weight: 700; color: var(--k-accent-soft); white-space: nowrap; }
      [data-composition-id="scene-0b"] .sc-next .nm { font-size: 58px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
      [data-composition-id="scene-0b"] .sc-next svg { flex: none; width: 76px; height: 41px; }
    </style>
    <script>
      (function () {
        const S = Kit.scene("0b"), t = S.t, DUR = 33.5;
        // Count only fully revealed, stationary text; transitions do not count as reading time.
        const read = (text, at, off, reveal = 0.6) => {
          const needed = text.trim().split(/\s+/).filter((word) => /[\p{L}\p{N}]/u.test(word)).length / 3 + 1;
          if (off - at - reveal < needed - 1e-6) throw new Error(`Недостаточно времени для «${text}»: ${(off - at - reveal).toFixed(1)} с, нужно ${needed.toFixed(1)}`);
        };
        if (DUR - S.speechEnd < 1.5) throw new Error("Недостаточный хвост сцены");
        const hide = (...els) => els.forEach((el) => gsap.set(el, { autoAlpha: 0 }));
        const div = (cls, html, parent) => { const el = document.createElement("div"); el.className = cls; el.innerHTML = html; parent.appendChild(el); return el; };
        const col = (p) => div("pr-col", "", p);
        const row = (p, top, cols) => { const r = div("pr-row", "", p); r.style.top = top + "px"; r.style.gridTemplateColumns = cols; return r; };
        const tile = (p, at, ttl, sub, off, cls) => {
          const a = Kit.aside(S, { parent: p, tail: false, html: '<div class="pr-t">' + ttl + "</div>" + (sub ? '<div class="pr-c">' + sub + "</div>" : "") });
          if (cls) a.el.classList.add(cls);
          a.show(at); read(ttl.replace(/<[^>]+>/g, "") + " " + (sub || ""), at, off);
          return a;
        };
        const arrow = (p, at, ch = "→") => { const a = div("pr-arr", ch, p); hide(a); Kit.popIn(S, a, at); return a; };
        const line = (cls, text, p, at, off) => { const e = div(cls, text, p); hide(e); Kit.popIn(S, e, at); read(text, at, off); return e; };

        Kit.header(S, { header: { mode: "parts", total: 5 }, chapter: "Как меняется работа", step: null, mode: "intro", duration: DUR, parts: [{ n: 1, blank: true, at: 0 }] });

        const OUT_ALL = t("Здесь") - 0.5;
        const sA = S.stage(); gsap.set(sA, { autoAlpha: 1 });
        const rA = row(sA, 215, "1fr 1fr");
        tile(rA, t("одно место"), "Одно место на вид сведений", "", OUT_ALL);
        tile(rA, t("свой человек"), "Свой человек на проверку", "", OUT_ALL, "pr-ok");
        const rB = row(sA, 360, "1fr 1fr 1fr");
        tile(rB, t("Метарепозиторий"), "Meta-repo", "контекст, ссылки, services.lock.yaml", OUT_ALL);
        tile(rB, t("закреплённые"), "Сервисы", "код и тесты; версии закреплены в meta-repo", OUT_ALL);
        tile(rB, t("Требования живут"), "Store · product-specs", "требования и изменения OpenSpec", OUT_ALL, "pr-ok");
        const cap = div("pr-sub", "Учебный пример: Store и контекст совмещены", sA); cap.style.top = "590px"; hide(cap); Kit.popIn(S, cap, t("Учебный")); read(cap.textContent, t("Учебный"), OUT_ALL);
        const req = Kit.aside(S, { parent: sA, x: 96, y: 690, w: 1728, tail: false, html: '<div class="pr-t">Запрос на слияние (MR) <span>→ одобрение на конкретной версии</span></div>' });
        req.el.classList.add("pr-ok"); req.show(t("Изменение идёт")); read("Запрос на слияние MR одобрение на конкретной версии", t("Изменение идёт"), OUT_ALL);

        const sC = S.stage();
        div("pr-title", "Здесь — понимание картины", sC);
        const rC = row(sC, 300, "1fr");
        tile(rC, t("Здесь"), "Картина для практики", "кто за что отвечает", DUR, "pr-ok");
        Kit.stageOut(S, sA, OUT_ALL); Kit.stageIn(S, sC, OUT_ALL + 0.3);

        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
