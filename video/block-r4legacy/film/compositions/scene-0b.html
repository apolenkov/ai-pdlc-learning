<template id="scene-0b-template">
  <div data-composition-id="scene-0b" data-width="1920" data-height="1080" data-duration="29.6">
    <style>
      [data-composition-id="scene-0b"] .en-ar { position: absolute; left: 596px; width: 88px; text-align: center; font-size: 64px; font-weight: 300; line-height: 72px; height: 72px; color: var(--k-text-2); }
      [data-composition-id="scene-0b"] .en-br { height: 100%; box-sizing: border-box; padding: 0 30px; display: flex; align-items: center; gap: 28px; }
      [data-composition-id="scene-0b"] .en-br .en-cd { flex: none; align-self: center; font-size: 50px; }
      [data-composition-id="scene-0b"] .en-h { font-size: 46px; font-weight: 800; line-height: 1.1; box-sizing: border-box; display: flex; align-items: center; padding: 0 30px; }
      [data-composition-id="scene-0b"] .en-card { box-sizing: border-box; padding: 22px 26px; display: flex; flex-direction: column; gap: 10px; }
      [data-composition-id="scene-0b"] .en-r4 { align-self: flex-start; padding: 2px 14px; border-radius: 10px; background: var(--k-accent-tint); color: var(--k-accent-soft); font-size: 30px; font-weight: 800; line-height: 1.3; }
      [data-composition-id="scene-0b"] .en-t { font-size: 42px; font-weight: 800; line-height: 1.12; }
      [data-composition-id="scene-0b"] .en-w { font-size: 34px; font-weight: 500; line-height: 1.22; color: var(--k-text-2); }
      [data-composition-id="scene-0b"] .en-k { align-self: flex-start; margin-top: auto; padding: 4px 18px; border: 3px solid var(--k-line); border-radius: 12px; font-size: 34px; font-weight: 700; line-height: 1.2; }
      [data-composition-id="scene-0b"] .en-k.on { border-color: var(--k-accent); background: var(--k-accent-tint); color: var(--k-accent-soft); }
      [data-composition-id="scene-0b"] .en-cap { box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 46px; font-weight: 800; line-height: 1.15; border-color: var(--k-info); }
      [data-composition-id="scene-0b"] .fl-row { position: absolute; left: 96px; top: 440px; width: 1728px; height: 200px; display: grid; grid-template-columns: 1fr 56px 1fr 56px 1fr 56px 1fr; align-items: stretch; }
      [data-composition-id="scene-0b"] .fl-row > .k-aside { position: relative; left: 0; top: 0; box-sizing: border-box; padding: 18px 22px; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
      [data-composition-id="scene-0b"] .fl-t { font-size: 40px; font-weight: 800; line-height: 1.1; }
      [data-composition-id="scene-0b"] .fl-s { font-size: 32px; font-weight: 500; line-height: 1.2; color: var(--k-text-2); }
      [data-composition-id="scene-0b"] .fl-a { align-self: center; text-align: center; font-size: 52px; font-weight: 300; color: var(--k-text-2); line-height: 1; }
      [data-composition-id="scene-0b"] .pl { box-sizing: border-box; display: flex; align-items: center; gap: 28px; padding: 0 34px; }
      [data-composition-id="scene-0b"] .pl .lab { font-size: 34px; font-weight: 700; color: var(--k-accent-soft); min-width: 250px; }
      [data-composition-id="scene-0b"] .pl .txt { font-size: 44px; font-weight: 700; line-height: 1.1; }
      [data-composition-id="scene-0b"] .pl-no { border-color: var(--k-ok); background: var(--k-ok-tint); }
      [data-composition-id="scene-0b"] .pl-no .lab { color: var(--k-ok); }
    </style>
    <script>
      (function () {
        const S = Kit.scene("0b"), t = S.t, DUR = 29.6;
        // Count only fully revealed, stationary text; transitions do not count as reading time.
        const read = (text, at, off, reveal = 0.6) => {
          const needed = text.trim().split(/\s+/).filter((word) => /[\p{L}\p{N}]/u.test(word)).length / 3 + 1;
          if (off - at - reveal < needed - 1e-6) throw new Error(`Недостаточно времени для «${text}»`);
        };
        if (DUR - S.speechEnd < 1.5) throw new Error("Недостаточный хвост сцены");
        const hide = (...els) => els.forEach((el) => gsap.set(el, { autoAlpha: 0 }));
        const div = (cls, html, parent) => { const el = document.createElement("div"); el.className = cls; el.innerHTML = html; parent.appendChild(el); return el; };
        const INFO = Kit.token("--k-info"), LINE = Kit.token("--k-line"), ACC = Kit.token("--k-accent");

        Kit.header(S, { header: { mode: "parts", total: 7 }, chapter: "Как меняется процесс", step: null, mode: "intro", duration: DUR, parts: [{ n: 1, blank: true, at: 0 }] });

        const sA = S.stage(); gsap.set(sA, { autoAlpha: 1 });
        const sB = S.stage();
        const T_OUT = t("продукт работает") + 0.0, T_IN = T_OUT + 0.55;

        /* Stage A: после шага 5 маршрут ветвится на 6а и 6б. Названия — заголовки карточек guides/index.html. */
        const head = Kit.aside(S, { parent: sA, x: 96, y: 206, w: 1124, h: 92, tail: false, html: "После шага 5 маршрут ветвится: 6а и 6б" });
        head.el.classList.add("en-h");
        head.show(0.2);
        read("После шага 5 маршрут ветвится 6а и 6б", 0.2, T_OUT);
        const both = Kit.aside(S, { parent: sA, x: 1244, y: 206, w: 580, h: 92, tail: false, html: "можно пройти оба" });
        both.el.classList.add("en-cap");
        both.show(t("можно пройти") - 0.1);
        read("можно пройти оба", t("можно пройти") - 0.1, T_OUT);

        const c5 = Kit.aside(S, { parent: sA, x: 96, y: 330, w: 500, h: 372, tail: false, html:
          '<div class="en-r4">шаг 5</div><div class="en-t">Требования в контексте продукта</div>' });
        c5.el.classList.add("en-card");
        c5.show(t("пять") - 0.1);
        read("шаг 5 Требования в контексте продукта", t("пять") - 0.1, T_OUT);

        const E = [
          { y: 330, cd: "6а", ttl: "Начинаем требования для нового продукта", who: "новый продукт — пустой репозиторий", at: t("шесть-а") },
          { y: 524, cd: "6б", ttl: "Описываем действующий продукт", who: "действующий продукт — старые документы", at: t("шесть-бэ") },
        ];
        const cards = E.map((e) => {
          const ar = div("en-ar", "→", sA); ar.style.top = (e.y + 89 - 36) + "px"; hide(ar); Kit.popIn(S, ar, e.at - 0.3);
          const a = Kit.aside(S, { parent: sA, x: 684, y: e.y, w: 1140, h: 178, tail: false, html:
            `<div class="en-br"><div class="en-r4 en-cd">${e.cd}</div><div class="en-tx"><div class="en-t">${e.ttl}</div><div class="en-w">${e.who}</div></div></div>` });
          a.el.classList.add("en-card"); a.el.style.padding = "0";
          a.show(e.at);
          S.tl.to(a.el, { borderColor: INFO, duration: 0.3 }, e.at);
          read(e.cd + " " + e.ttl + " " + e.who, e.at, T_OUT);
          return a.el;
        });
        // 6а отходит, когда ваша ветвь названа: 6б выделена
        S.tl.to(cards[0], { borderColor: LINE, duration: 0.3 }, t("Вы на шаге") - 0.1);
        S.tl.to(cards[0].querySelector(".en-br"), { opacity: 0.55, duration: 0.4 }, t("Вы на шаге"));
        S.tl.to(cards[1], { borderColor: ACC, duration: 0.3 }, t("Вы на шаге"));

        const cap = Kit.aside(S, { parent: sA, x: 96, y: 716, w: 1728, h: 88, tail: false, html: "ветвь выбирает то, что выдал организатор" });
        cap.el.classList.add("en-cap");
        const T_CAP = t("Ветвь") - 0.2;
        cap.show(T_CAP);
        read("ветвь выбирает то, что выдал организатор", T_CAP, T_OUT);

        /* Stage B: the chain «документы → черновик модели → люди решают → принятое изменение», then «код не нужен». */
        const lead = Kit.aside(S, { parent: sB, x: 96, y: 206, w: 1728, h: 96, tail: false, html: '<div class="lab">Действующий продукт</div><div class="txt">продукт работает, требования — в старых документах</div>' });
        lead.el.classList.add("pl"); lead.el.style.borderColor = ACC;
        lead.show(T_IN + 0.1);
        read("Действующий продукт продукт работает, требования в старых документах", T_IN + 0.1, DUR);

        const fix = Kit.aside(S, { parent: sB, x: 96, y: 322, w: 1728, h: 96, tail: false, html: '<div class="lab">Записываем</div><div class="txt">текущее состояние как есть — первым изменением</div>' });
        fix.el.classList.add("pl");
        fix.show(t("Вы записываете"));
        read("Записываем текущее состояние как есть первым изменением", t("Вы записываете"), DUR);

        const row = div("fl-row", "", sB);
        const F = [
          ["Документы", "источник", t("старых")],
          ["Черновик модели", "готовит модель", t("Модель готовит")],
          ["Люди решают", "решение за людьми", t("люди решают")],
          ["Принятое изменение", "результат этапа", t("принятое")],
        ];
        const tiles = F.map(([ttl, sub, at], i) => {
          if (i) { const ar = div("fl-a", "→", row); hide(ar); Kit.popIn(S, ar, at - 0.3); }
          const a = Kit.aside(S, { parent: row, tail: false, html: `<div class="fl-t">${ttl}</div><div class="fl-s">${sub}</div>` });
          hide(a.el); Kit.popIn(S, a.el, at);
          read(ttl + " " + sub, at, DUR);
          return a.el;
        });
        // Each tile lights up while the narrator talks about it.
        F.forEach(([, , at], i) => {
          const off = i < 3 ? F[i + 1][2] - 0.1 : DUR;
          S.tl.to(tiles[i], { borderColor: i === 3 ? ACC : INFO, duration: 0.3 }, at);
          if (i < 3) S.tl.to(tiles[i], { borderColor: LINE, duration: 0.3 }, off);
        });

        const no = Kit.aside(S, { parent: sB, x: 96, y: 690, w: 1728, h: 96, tail: false, html: '<div class="lab">Итог</div><div class="txt">Код не нужен</div>' });
        no.el.classList.add("pl", "pl-no");
        no.show(t("изменение, а"));
        read("Итог Код не нужен", t("изменение, а"), DUR);

        Kit.stageOut(S, sA, T_OUT); Kit.stageIn(S, sB, T_IN);
        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
