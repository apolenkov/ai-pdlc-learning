<template id="scene-01-template">
  <div data-composition-id="scene-01" data-width="1920" data-height="1080" data-duration="8.6">
    <style>
      [data-composition-id="scene-01"] .h-h { position: absolute; left: 96px; top: 226px; width: 1180px; font-size: 84px; font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; }
      [data-composition-id="scene-01"] .h-rule { position: absolute; left: 96px; top: 402px; width: 132px; height: 6px; border-radius: 3px; background: var(--k-accent); }
      [data-composition-id="scene-01"] .h-chip { position: absolute; top: 512px; padding: 20px 36px; border: 2px solid var(--k-line); border-radius: 22px; background: var(--k-panel); font-size: 44px; font-weight: 800; }
    </style>
    <script>
      (function () {
        const S = Kit.scene("01"), DUR = 8.6;
        const tt = (w, d) => { try { return S.t(w); } catch (e) { return d; } };
        const el = (cls, html, x, y, w) => { const e = document.createElement("div"); e.className = cls; e.innerHTML = html; e.style.left = x + "px"; e.style.top = y + "px"; if (w) e.style.width = w + "px"; S.root.appendChild(e); return e; };
        const show = (e, at) => { (Array.isArray(e) ? e : [e]).forEach((x) => { gsap.set(x, { autoAlpha: 0 }); S.tl.fromTo(x, { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, at); }); };
        // Светлая карточка-постер: «Курс · PDLC» и название курса; уходит к 2,6 с.
        People.poster(S, { kicker: "Курс · PDLC", title: "Намерение и план", sketch: { name: "intro-idea", x: 1010, y: 270, w: 760 }, until: 1.9, fade: 0.7, exit: "slide" });
        // Тёмная сцена: подпись курса, затем три слова записи.
        const h = el("h-h", "Намерение и план", 96, 226, 1180); show(h, 2.7);
        const r = el("h-rule", "", 96, 402); show(r, 2.75);
        const c1 = el("h-chip", "проблема", 96, 512); show(c1, tt("проблему", 5.7));
        const c2 = el("h-chip", "эффект", 420, 512); show(c2, tt("эффект", 6.45));
        const c3 = el("h-chip", "границы", 690, 512); show(c3, tt("границы", 6.77));
        Kit.sketch(S, { name: "intro-idea", x: 1010, y: 270, w: 760, at: tt("намерение", 3.2), dur: 2.8 });
        Kit.subtitles(S, {});
        S.finish(DUR);
      })();
    </script>
  </div>
</template>
